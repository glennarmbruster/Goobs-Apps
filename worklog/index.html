<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Log</title>
<meta name="description" content="A quick log of what you did on each job, with ticket numbers, time and notes, and a weekly summary. Data stays on your device.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Work Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.row .btn{flex:none}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;vertical-align:middle}
.row>.dot{margin-top:0}
.quick{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.quick .chip{display:inline-flex;align-items:center;gap:6px}
.qbtns{display:flex;gap:8px;flex-wrap:wrap}
.qbtns .primary{flex:1}
.run{margin-top:14px;padding:12px 14px;background:var(--accent-soft);border-color:transparent;display:flex;align-items:center;gap:12px}
.run .clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.note{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px;margin:10px 0}
.hb{display:block;width:100%;height:12px}
.hbrow{padding:8px 14px}
.hbrow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.hbrow .top b{overflow-wrap:anywhere}
.dayc{display:block;width:100%;height:auto;padding:6px 8px}
.seg2{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:14px}
.seg2 .mid{flex:1;text-align:center;font-weight:700;min-width:0}
.seg2 .mid small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.filters{display:flex;flex-direction:column;gap:10px;margin-top:14px}
textarea.big{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.pv{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;font-size:13px}
.pv div{padding:6px 10px;border-top:1px solid var(--line);overflow-wrap:anywhere}
.pv div:first-child{border-top:0}
.pv .e{color:var(--bad)} .pv .o{color:var(--ok)} .pv .d{color:var(--muted)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chiprow .chip{min-height:30px;padding:3px 10px;font-size:13px}
#printArea{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font:11pt/1.35 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000;background:#fff}
  #printArea h1{font-size:18pt;margin:0 0 2pt}
  #printArea h2{font-size:13pt;margin:12pt 0 4pt;border-bottom:1.5pt solid #000;padding-bottom:2pt;break-after:avoid}
  #printArea h3{font-size:11pt;margin:8pt 0 2pt;break-after:avoid}
  #printArea .pa-sub{color:#333;margin:0 0 6pt}
  #printArea ul{margin:0 0 4pt;padding-left:16pt}
  #printArea li{break-inside:avoid;margin:1pt 0}
  #printArea .pa-n{color:#333;font-size:10pt}
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="grow"><h1 id="title">Today</h1><div class="sub" id="sub"></div></div><button type="button" class="btn small primary hide" id="addBtn">+ Entry</button></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="today"><span class="ico">📝</span>Today</button>
  <button type="button" data-tab="log"><span class="ico">🗂️</span>Log</button>
  <button type="button" data-tab="summary"><span class="ico">📊</span>Summary</button>
  <button type="button" data-tab="jobs"><span class="ico">💼</span>Jobs</button>
  <button type="button" data-tab="backup"><span class="ico">💾</span>Backup</button>
</div></nav>
<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);
}

/* ---- dialogs ---- */
if (!$('#dlg')) document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg"></dialog><dialog id="ask"></dialog>');
{
  const dlg = $('#dlg'); let down = false;
  dlg.addEventListener('pointerdown', e => { down = e.target === dlg; });
  dlg.addEventListener('click', e => { if (e.target === dlg && down) dlg.close(); });
}

function fieldHTML(f) {
  const id = 'f_' + f.name, v = f.value ?? '';
  if (f.type === 'checkbox')
    return `<div class="field check"><input type="checkbox" id="${id}" name="${f.name}"${f.value ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label></div>`;
  let ctl;
  if (f.type === 'select') {
    ctl = `<select id="${id}" name="${f.name}">${f.options.map(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    ctl = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
  } else {
    const t = f.type || 'text';
    const extra = t === 'number' ? ` inputmode="decimal" step="${f.step || 'any'}"` : '';
    ctl = `<input id="${id}" name="${f.name}" type="${t}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}"${extra}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''} autocomplete="${f.autocomplete || 'off'}" autocapitalize="${f.capitalize || (t === 'email' || t === 'password' ? 'none' : 'sentences')}">`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

/* formDialog: fields -> values. onSubmit(values) may return an error string (keeps dialog open).
   onDelete() may return true to close. extra: [{label, kind, onClick}] extra buttons. */
function formDialog({ title, intro = '', fields, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extra = [], onClose, grid = '' }) {
  const dlg = $('#dlg');
  const body = grid ? `<div class="${grid}">${fields.map(fieldHTML).join('')}</div>` : fields.map(fieldHTML).join('');
  dlg.innerHTML = `<form class="dlg-form" novalidate>
    <h2>${esc(title)}</h2>${intro ? `<p class="muted">${esc(intro)}</p>` : ''}${body}
    <div class="dlg-err" role="alert"></div>
    <div class="dlg-actions">
      ${onDelete ? `<button type="button" class="btn danger" data-k="del">${esc(deleteLabel)}</button>` : ''}
      ${extra.map((x, i) => `<button type="button" class="btn ${x.kind || ''}" data-x="${i}">${esc(x.label)}</button>`).join('')}
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-k="cancel">Cancel</button>
      <button type="submit" class="btn primary">${esc(submitLabel)}</button>
    </div></form>`;
  const form = $('form', dlg), err = $('.dlg-err', dlg);
  const collect = () => {
    const vals = {};
    for (const f of fields) { const el = form.elements[f.name]; vals[f.name] = f.type === 'checkbox' ? el.checked : el.value; }
    return vals;
  };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const vals = collect();
    for (const f of fields) if (f.required && !String(vals[f.name]).trim()) { err.textContent = `${f.label} is required.`; return; }
    err.textContent = '';
    let msg;
    try { msg = await onSubmit(vals); } catch (ex) { msg = ex.message || 'Something went wrong.'; }

/* ---- backup: optional AES-GCM passphrase encryption (Web Crypto, PBKDF2-SHA256) ---- */
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

  return { encrypted: true, kdf: 'PBKDF2-SHA256', iterations, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('Wrong passphrase, or the file is damaged.'); }
}

    let result = null;
    formDialog({
      title: 'Encrypted backup', intro: 'Enter the passphrase you chose when you made this backup.',
      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },

}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');
    let data;

function jobDialog(id) {
  const j = id ? jobById(id) : null;

  const used = state.entries.filter(e => j && e.jobId === j.id).length;
  formDialog({
    title: j ? 'Edit job' : 'Add job',
    fields: [
      { name: 'name', label: 'Job name', required: true, value: j && j.name, placeholder: 'e.g. Day job' },
      { name: 'color', label: 'Color', type: 'select', options: PALETTE.map(([c, n]) => [c, n]), value: j ? j.color : PALETTE[state.jobs.length % PALETTE.length][0] },
      { name: 'prefix', label: 'Default ticket prefix (optional)', value: j && j.prefix, placeholder: 'CHG, INC…', capitalize: 'characters', hint: 'Digits-only tickets get this prefix; typed tickets like CHG0012345 are picked up from quick add.' },
      { name: 'targetHours', label: 'Weekly hours target (optional)', type: 'number', value: j && j.targetHours ? j.targetHours : '', min: 0, max: 168, placeholder: '40' },

    ],

      const t = v.targetHours === '' ? 0 : parseFloat(v.targetHours);
      if (!(t >= 0 && t <= 168)) return 'Target must be between 0 and 168 hours.';
      const rec = { name, color: v.color, prefix: v.prefix.trim(), targetHours: t };
      if (j) { const n = normJob({ ...j, ...rec, archived: !!v.archived }, 0); Object.assign(j, n); }

    },

      commit(); toast('Job deleted'); return true;
    } : null
  });
}

function filterEntries(f) {
  const q = f.q.trim().toLowerCase();
  return state.entries.filter(e => {
    if (f.job && e.jobId !== f.job) return false;
    if (f.status && e.status !== f.status) return false;
    if (f.cat && catKey(e.category) !== f.cat) return false;
    if (f.from && e.date < f.from) return false;
    if (f.to && e.date > f.to) return false;
    if (q && !(`${e.title}\n${e.ticket}\n${e.notes}\n${e.category}\n${jobName(e.jobId)}`.toLowerCase().includes(q))) return false;
    return true;
  }).sort(byNewest);
}
function logListHTML() {
  const list = filterEntries(ui.f);

/* ---- status report ---- */
const entryKey = e => e.jobId + '|' + (e.ticket ? e.ticket.toLowerCase() : e.title.toLowerCase());
function lineFor(e) {
  return `${e.title}${e.ticket ? ' [' + e.ticket + ']' : ''}${e.minutes ? ' (' + fmtMin(e.minutes) + ')' : ''}${e.status !== 'done' && e.followUp ? ' — by ' + e.followUp : ''}`;
}
function buildReport(from, to, label) {
  const es = inRange(from, to).sort(byOldest);
  const latest = new Map();
  for (const e of es) latest.set(entryKey(e), e);
  const openFU = state.entries.filter(e => isOpenFU(e) && e.date <= to);
  const tx = [`Status report: ${label}`, ''];
  let h = `<h1>Status report</h1><p class="pa-sub">${esc(label)} · ${esc(fmtMin(sumMin(es)))} logged</p>`;
  let any = false;
  for (const j of state.jobs) {
    const mine = es.filter(e => e.jobId === j.id);
    const fus = openFU.filter(e => e.jobId === j.id);
    if (!mine.length && !fus.length) continue;
    any = true;
    const done = mine.filter(e => e.status === 'done');
    const prog = mine.filter(e => e.status === 'progress' && latest.get(entryKey(e)) === e);
    const blocked = mine.filter(e => e.status === 'blocked' && latest.get(entryKey(e)) === e);
    const shown = new Set([...prog, ...blocked].map(entryKey));
    const nextMap = new Map();
    for (const e of [...mine.filter(x => x.status === 'followup' && latest.get(entryKey(x)) === x), ...fus].sort(byOldest)) if (!shown.has(entryKey(e))) nextMap.set(entryKey(e), e);
    const next = [...nextMap.values()];
    const secs = [['Done', done], ['In progress', prog], ['Blocked', blocked], ['Next', next]].filter(s => s[1].length);
    tx.push(`== ${j.name} (${fmtMin(sumMin(mine))}) ==`);
    h += `<h2>${esc(j.name)} <span style="float:right;font-weight:400">${esc(fmtMin(sumMin(mine)))}</span></h2>`;
    for (const [t, arr] of secs) {
      tx.push(t + ':', ...arr.map(e => '- ' + lineFor(e)), '');
      h += `<h3>${t}</h3><ul>${arr.map(e => `<li>${esc(lineFor(e))}</li>`).join('')}</ul>`;
    }
    if (!secs.length) tx.push('(no items)', '');
  }
  if (!any) { tx.push('Nothing logged in this period.'); h += '<p>Nothing logged in this period.</p>'; }
  return { text: tx.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n', html: h };
}
function doPrint(html, title) {
  let pa = document.getElementById('printArea');
  if (!pa) { pa = document.createElement('div'); pa.id = 'printArea'; document.body.appendChild(pa); }
  pa.innerHTML = html;

  const done = () => { window.removeEventListener('afterprint', done); document.title = oldTitle; const q = document.getElementById('printArea'); if (q) q.innerHTML = ''; };
  window.addEventListener('afterprint', done);

}
async function copyText(t) {

  try { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return !!ok; } catch { return false; }
}

async function restoreFromText(text) {
  let parsed;
  try { parsed = await Backup.parse(text, { appId: APP_ID, schema: SCHEMA }); }
  catch (e) { await msgBox('Can’t restore that file', e.message); return false; }
  if (!parsed) return false;
  const { data, dropped } = normalizeData(parsed.data);
  if (!data.jobs.length && !data.entries.length) { await msgBox('Nothing to restore', 'That backup has no jobs or entries in it.'); return false; }
  const hasLocal = state.jobs.length > 0 || state.entries.length > 0;
  const sum = `${plural(data.jobs.length, 'job')} and ${nEntries(data.entries.length)}`;
  const when = parsed.exportedAt ? ` Backup made ${fmtDateTime(parsed.exportedAt)}.` : '';
  const skipped = dropped ? ` ${plural(dropped, 'unreadable item')} will be skipped.` : '';
  const body = `<p>${esc(sum + '.' + when + skipped)}</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps everything here for the backup. <b>Merge</b> adds what isn’t here yet and keeps the rest.</p>' : '');
  const choice = await askDialog({
    title: 'Restore this backup?', body,
    buttons: hasLocal
      ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }]
      : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }]
  });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    state.jobs = data.jobs; state.entries = data.entries; state.timer = null;
    if (!jobById(state.settings.lastJob)) state.settings.lastJob = '';
    ui.quickJob = '';
    state.meta.lastBackup = ts; state.meta.lastChange = ts;
    await persist({ touch: false });
    render(); toast(`Restored ${sum}`); return true;
  }
  if (choice === 'merge') {
    const map = new Map(); let nj = 0, ne = 0;
    for (const j of data.jobs) {
      const same = state.jobs.find(x => x.id === j.id) || state.jobs.find(x => x.name.toLowerCase() === j.name.toLowerCase());
      if (same) map.set(j.id, same.id);
      else if (state.jobs.length < MAX_JOBS) { state.jobs.push(j); map.set(j.id, j.id); nj++; }
    }
    const ids = new Set(state.entries.map(e => e.id));
    for (const e of data.entries) {
      if (ids.has(e.id) || !map.has(e.jobId) || state.entries.length >= MAX_ENTRIES) continue;
      state.entries.push({ ...e, jobId: map.get(e.jobId) }); ids.add(e.id); ne++;
    }
    await persist(); render(); toast(`Merged in ${plural(nj, 'job')} and ${nEntries(ne)}`); return true;
  }
  return false;
}

/* ---- import pasted lines ---- */
function splitLine(line) {
  const delim = line.includes('\t') ? '\t' : ',';
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"' && cur === '') q = true;
    else if (c === delim) { out.push(cur.trim()); cur = ''; }
    else cur += c;
  }
  out.push(cur.trim());
  return out;
}
function looseDate(s) {
  s = str(s).trim().toLowerCase();
  if (isISO(s)) return s;
  if (s === 'today') return todayISO();
  if (s === 'yesterday') return addDays(todayISO(), -1);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/);
  if (!m) return '';
  let y = m[3] ? +m[3] : new Date().getFullYear(); if (y < 100) y += 2000;
  const iso = `${y}-${pad(+m[1])}-${pad(+m[2])}`;
  return isISO(iso) ? iso : '';
}
/* returns {rows:[{n,raw,entry?,err?,dup?}], newJobs:[names]} without touching state */
function parseImport(text, createJobs) {
  const jobs = new Map(state.jobs.map(j => [j.name.toLowerCase(), j]));
  const seen = new Set(state.entries.map(e => [e.date, e.jobId, e.title.toLowerCase(), e.ticket.toLowerCase()].join('|')));
  const newJobs = new Map(); const rows = [];
  let room = MAX_ENTRIES - state.entries.length;
  str(text).split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line[0] === '#') return;
    const f = splitLine(line);
    if (!rows.length && /^date$/i.test(f[0])) return;
    const r = { n: i + 1, raw: line };
    rows.push(r);
    const date = looseDate(f[0]);
    if (!date) { r.err = 'Date should look like 2026-10-11.'; return; }
    const jn = (f[1] || '').trim();
    if (!jn) { r.err = 'Missing job name.'; return; }
    let job = jobs.get(jn.toLowerCase()), jobId;
    if (job) jobId = job.id;
    else if (createJobs) {
      if (!newJobs.has(jn.toLowerCase())) {
        if (state.jobs.length + newJobs.size >= MAX_JOBS) { r.err = 'Too many jobs.'; return; }
        newJobs.set(jn.toLowerCase(), { name: jn.slice(0, 60), id: uid() });
      }
      jobId = newJobs.get(jn.toLowerCase()).id; job = null;
    } else { r.err = `Unknown job “${jn.slice(0, 40)}”. Add it first or tick “Create missing jobs”.`; return; }
    const title = (f[2] || '').replace(/\s+/g, ' ').trim();
    if (!title) { r.err = 'Missing title.'; return; }
    const tm = parseMinutes(f[4] || '');
    if (tm.err) { r.err = tm.err; return; }
    const st = (f[6] || '').trim().toLowerCase();
    const status = !st ? 'done' : (STATUSES.find(([v, l]) => v === st || l.toLowerCase() === st) || [])[0];
    if (!status) { r.err = 'Status should be done, in progress, blocked or follow-up needed.'; return; }
    const ticket = normTicket(f[3] || '', job);
    const key = [date, jobId, title.toLowerCase(), ticket.toLowerCase()].join('|');
    if (seen.has(key)) { r.dup = true; return; }
    if (room <= 0) { r.err = 'Entry limit reached.'; return; }
    seen.add(key); room--;
    r.entry = { date, jobId, title, ticket, minutes: tm.min || null, category: f[5] || '', status, notes: f[7] || '' };
  });
  return { rows, newJobs: [...newJobs.values()] };
}
function applyImport(res) {
  const added = new Set();
  for (const nj of res.newJobs) {
    if (!res.rows.some(r => r.entry && r.entry.jobId === nj.id)) continue;
    state.jobs.push(normJob({ id: nj.id, name: nj.name }, state.jobs.length)); added.add(nj.id);
  }
  let n = 0;
  const ids = new Set(state.jobs.map(j => j.id));
  for (const r of res.rows) {
    if (!r.entry || !ids.has(r.entry.jobId)) continue;
    const e = normEntry({ id: uid(), createdAt: Date.now() + n, ...r.entry }, ids);
    if (e) { state.entries.push(e); n++; }
  }
  return { n, jobs: added.size };
}

    const ok = res.rows.filter(r => r.entry), bad = res.rows.filter(r => r.err), dup = res.rows.filter(r => r.dup);
    $('#impPrev').innerHTML = res.rows.length ? `<p><b>${ok.length}</b> ready${bad.length ? `, <b class="bad">${bad.length}</b> with errors` : ''}${dup.length ? `, ${dup.length} duplicate${dup.length === 1 ? '' : 's'} skipped` : ''}${res.newJobs.length ? `, new jobs: ${esc(res.newJobs.map(j => j.name).join('; '))}` : ''}.</p>
      <div class="pv">${res.rows.slice(0, 200).map(r => `<div class="${r.err ? 'e' : r.dup ? 'd' : 'o'}">${r.err ? '✗' : r.dup ? '=' : '✓'} Line ${r.n}: ${esc(r.err || (r.dup ? 'Already logged, skipped.' : `${r.entry.date} · ${r.entry.title}${r.entry.minutes ? ' · ' + fmtMin(r.entry.minutes) : ''}`))}</div>`).join('')}</div>` : '<p class="muted">No lines found.</p>';
    previewed = { text, cj, n: ok.length };
    goBtn.disabled = !ok.length; goBtn.textContent = ok.length ? `Import ${ok.length}` : 'Import';
  };
  $('[data-k="prev"]', dlg).onclick = preview;
  $('[data-k="cancel"]', dlg).onclick = () => dlg.close();
  goBtn.onclick = () => {
    const text = $('#impText').value, cj = $('#impCreate').checked;
    if (!previewed || previewed.text !== text || previewed.cj !== cj) { preview(); return toast('Check the updated preview, then import.'); }
    const res = parseImport(text, cj), r = applyImport(res);
    dlg.close(); commit();
    toast(`Imported ${nEntries(r.n)}${r.jobs ? ' and ' + plural(r.jobs, 'job') : ''}`);
  };
  dlg.onclose = () => { dlg.onclose = null; };
  dlg.showModal();
  $('#impText').focus();
}

/* ---- quick add ---- */
function quickAdd(start) {
  const inp = $('#qText'); if (!inp) return;
  const job = jobById(defaultJobId());
  const q = parseQuick(inp.value, job);
  if (!q.title) { inp.focus(); return toast('Type what you did first.'); }
  const e = addEntry({ date: todayISO(), jobId: job.id, title: q.title, ticket: normTicket(q.ticket, job), minutes: q.minutes, status: start ? 'progress' : 'done' });
  if (!e) return;
  ui.quickText = '';
  if (start) { commit(); startTimer(e.id); }
  else { commit(); toast('Logged', { label: 'Undo', fn: () => { removeEntry(e.id); commit(); } }); }
  const n = $('#qText'); if (n) n.focus();
}
function quickMore() {
  const inp = $('#qText'); const job = jobById(defaultJobId());
  const q = parseQuick(inp ? inp.value : '', job);
  entryDialog(null, { title: q.title, ticket: q.ticket, minutes: q.minutes, jobId: job && job.id });
}

/* ---- wiring ---- */
view.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'edit': entryDialog(id); break;
    case 'timer': (state.timer && state.timer.entryId === id) ? stopTimer() : startTimer(id); break;
    case 'done': markDone(id); break;
    case 'carry': carryForward(id); break;
    case 'qjob': ui.quickJob = id; state.settings.lastJob = id; ui.quickText = ($('#qText') || {}).value || ''; render(); { const q = $('#qText'); if (q) q.focus(); } break;
    case 'qadd': quickAdd(false); break;
    case 'qstart': quickAdd(true); break;
    case 'qmore': quickMore(); break;
    case 'frcreate': {
      const n = (($('#frName') || {}).value || '').trim();
      if (!n) { toast('Type a job name.'); break; }
      const j = normJob({ id: uid(), name: n }, 0); state.jobs.push(j); state.settings.lastJob = j.id; ui.quickJob = j.id; commit(); break;
    }
    case 'togglefilters': ui.f.open = !ui.f.open; render(); break;
    case 'clearfilters': ui.f = { q: ui.f.q, job: '', cat: '', status: '', from: '', to: '', open: ui.f.open }; ui.logLimit = 150; render(); break;
    case 'more': ui.logLimit += 150; updateLog(); break;
    case 'mode': ui.sumMode = el.dataset.v; render(); break;
    case 'prev': if (ui.sumMode === 'month') ui.monthOff--; else ui.weekOff--; render(); break;
    case 'next': if (ui.sumMode === 'month') ui.monthOff++; else ui.weekOff++; render(); break;
    case 'now': ui.weekOff = 0; ui.monthOff = 0; render(); break;
    case 'report': reportDialog(); break;
    case 'print': { const p = period(); const r = buildReport(p.from, p.to, p.label); doPrint(r.html, 'Status report ' + p.label); break; }
    case 'jobadd': jobDialog(); break;
    case 'jobedit': jobDialog(id); break;
    case 'tab-jobs': go('jobs'); break;
    case 'tab-today': go('today'); break;
    case 'export': doExport(); break;
    case 'restore': doRestore(); break;
    case 'csv': csvDialog(); break;
    case 'import': importDialog(); break;
    case 'wipe': doWipe(); break;
    case 'install': runInstall(); break;
  }
});
view.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'qText') ui.quickText = t.value;
  else if (t.dataset && t.dataset.f && t.tagName === 'INPUT') { ui.f[t.dataset.f] = t.value; ui.logLimit = 150; updateLog(); }
});
view.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.f && t.tagName === 'SELECT') { ui.f[t.dataset.f] = t.value; ui.logLimit = 150; render(); }
});
view.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'qText') { e.preventDefault(); quickAdd(false); }
  else if (e.target.id === 'frName') { e.preventDefault(); const b = $('[data-action="frcreate"]'); if (b) b.click(); }
});
$('#addBtn').onclick = () => (tab === 'jobs' ? jobDialog() : entryDialog());
$$('nav.tabs button').forEach(b => { b.onclick = () => go(b.dataset.tab); });
function refreshIfIdle() { if (!$('dialog[open]')) render(); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshIfIdle(); });
window.addEventListener('pageshow', e => { if (e.persisted) refreshIfIdle(); });
/* live timer clock + midnight rollover */
setInterval(() => {
  $$('[data-since]').forEach(el => { el.textContent = fmtClock(Date.now() - Number(el.dataset.since)); });
  if (renderedDay && todayISO() !== renderedDay && !$('dialog[open]') && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();
}, 1000);

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const raw = await idbGet(db, 'state');
      if (raw) {
        try { state = loadState(JSON.parse(raw)); }
        catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged. A copy was kept aside.'); }
      }
    } catch (e) { console.error(e); db = null; }
  }
  render();
})();
</script>
