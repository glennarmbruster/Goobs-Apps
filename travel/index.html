<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trips</title>
<meta name="description" content="Plan trips: packing lists, itinerary, budget, ideas and weather.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trips">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--bg:#f4f6f8;--accent:#0369a1;--accent-soft:#dbeefa;--line:#dde3e8;--soft:#e9eef2}
@media (prefers-color-scheme:dark){:root{--bg:#0d1215;--card:#161e23;--line:#25323a;--soft:#1d272d;--accent:#38bdf8;--accent-ink:#04202f;--accent-soft:#0f2f42}}
.addrow{display:flex;gap:8px;align-items:center}
.addrow input{flex:1;min-width:0}
.addrow select{width:auto;max-width:44%}
.addrow.wrap{flex-wrap:wrap}.addrow.wrap .btn{flex:0 0 auto}.addrow.wrap input[name=text]{flex:1 1 100%}.addrow.wrap select{flex:1 1 40%;max-width:none}.addrow.wrap input[name=qty]{flex:0 0 64px}
.tripcard{display:block;padding:14px 16px;text-decoration:none;color:inherit;margin-bottom:12px}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
a.tile{display:block;text-decoration:none;color:inherit}
.check-row{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer;min-height:44px;overflow-wrap:anywhere}
.done{text-decoration:line-through;color:var(--muted)}
.hero{text-align:center;margin-top:14px;padding:22px 16px}
.hero .big{font-size:46px;font-weight:800;line-height:1;color:var(--accent)}
.hero .lbl{color:var(--muted);font-weight:600;margin-top:4px}
.time{width:48px;flex:none;font-size:13px;font-weight:700;color:var(--muted)}
.wx{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.wxrow .emoji{font-size:26px;width:40px;text-align:center;flex:none}
.checkgrid .field:first-child,.checkgrid .field:has(select){grid-column:1/-1}
.catline{margin:12px 0}
.catline .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pad-b{padding-bottom:6px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.row .btn{flex:none}
textarea.notes{min-height:120px}
/* big amounts (group trips) must not push the three summary tiles off-screen */
.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.tile .val{font-size:clamp(15px,5vw,20px);overflow-wrap:anywhere}
a.chip{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.chip[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.spl-nav{margin:10px 0 12px}
.spl-who{border:1px solid var(--line);border-radius:12px;padding:4px 10px}
.spl-r{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.spl-r:first-child{border-top:0}
.spl-n{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font-size:15px;overflow-wrap:anywhere;cursor:pointer;margin:0}
.spl-n small{color:var(--muted)}
.spl-v{width:84px;flex:none;min-height:40px;padding:6px 8px;text-align:right}
.spl-sh{flex:none;min-width:64px;text-align:right;font-size:13px;color:var(--muted)}
.spl-sum{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--soft)}
.spl-sum.warn{background:var(--warn-soft);color:var(--warn)}
.spl-sel{display:flex;gap:6px;flex-wrap:wrap}
.spl-tbl{width:100%;border-collapse:collapse}.spl-tbl td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}.spl-tbl td.r{text-align:right;white-space:nowrap}
.pplform{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.pplform input[name=pname]{flex:1 1 100%}.pplform input[name=pgroup]{flex:1 1 50%;min-width:0}.pplform input[name=pwt]{flex:0 0 84px;min-width:0}.pplform .btn{flex:0 0 auto}
.pinbtn{filter:grayscale(1);opacity:.55}
.pinbtn[aria-pressed="true"]{filter:none;opacity:1;background:var(--accent-soft);border-color:var(--accent)}
.row-sub a{color:var(--accent)}
#printArea{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font:12pt/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000;background:#fff}
  #printArea h1{font-size:20pt;margin:0 0 2pt}
  #printArea h2{font-size:14pt;margin:14pt 0 6pt;border-bottom:1.5pt solid #000;padding-bottom:2pt;break-after:avoid}
  #printArea h3{font-size:12pt;margin:10pt 0 3pt;break-after:avoid}
  #printArea .pa-sub{color:#333;margin:0 0 6pt}
  #printArea .pa-day{break-inside:avoid;margin:0 0 8pt}
  #printArea .pa-day h3{background:#eee;padding:3pt 6pt;margin:8pt 0 3pt}
  #printArea .pa-wx{font-weight:400;float:right}
  #printArea .pa-it{display:flex;gap:8pt;margin:2pt 6pt;break-inside:avoid}
  #printArea .pa-t{width:56pt;flex:none;font-variant-numeric:tabular-nums}
  #printArea .pa-n{color:#333;font-size:10.5pt}
  #printArea .pa-cats{columns:2;column-gap:20pt}
  #printArea .pa-cat{break-inside:avoid;margin:0 0 8pt}
  #printArea .pa-pk{display:flex;gap:6pt;align-items:flex-start;margin:2pt 0}
  #printArea .pa-box{flex:none;width:10pt;height:10pt;border:1pt solid #000;margin-top:2pt;font-size:9pt;line-height:9pt;text-align:center}
  #printArea .pa-pk.on .pa-box::after{content:"✓"}
  #printArea .pa-pk.on span:last-child{color:#555}
  #printArea .pa-blank{border-bottom:.5pt solid #999;height:15pt;margin:0 0 2pt 16pt}
  #printArea .pa-page{break-before:page}
  #printArea .pa-page:first-child{break-before:auto}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea td{padding:2pt 4pt;border-bottom:.5pt solid #bbb}
  #printArea td.r{text-align:right}
  #printArea .pa-foot{margin-top:16pt;color:#555;font-size:9pt}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);
}

/* ---- dialogs ---- */
if (!$('#dlg')) document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg"></dialog><dialog id="ask"></dialog>');
{
  const dlg = $('#dlg'); let down = false;
  dlg.addEventListener('pointerdown', e => { down = e.target === dlg; });
  dlg.addEventListener('click', e => { if (e.target === dlg && down) dlg.close(); });
}

function fieldHTML(f) {
  const id = 'f_' + f.name, v = f.value ?? '';
  if (f.type === 'checkbox')
    return `<div class="field check"><input type="checkbox" id="${id}" name="${f.name}"${f.value ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label></div>`;
  let ctl;
  if (f.type === 'select') {
    ctl = `<select id="${id}" name="${f.name}">${f.options.map(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {

function formDialog({ title, intro = '', fields, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extra = [], onClose, grid = '' }) {

}

/* ---- backup: optional AES-GCM passphrase encryption (Web Crypto, PBKDF2-SHA256) ---- */
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptPayload(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const iterations = 250000;
  const key = await deriveKey(pass, salt, iterations);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { encrypted: true, kdf: 'PBKDF2-SHA256', iterations, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('Wrong passphrase, or the file is damaged.'); }
}
function promptDecrypt(env) {
  return new Promise(resolve => {
    let result = null;
    formDialog({
      title: 'Encrypted backup', intro: 'Enter the passphrase you chose when you made this backup.',
      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },
      onClose: () => resolve(result)
    });
  });
}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');
    let data;
    if (env.encrypted) {
      if (!(window.crypto && crypto.subtle)) throw new Error('Encrypted backups need a secure (https) connection.');
      if (!(env.iterations >= 1000 && env.iterations <= 2000000) || typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.data !== 'string')
        throw new Error('The encrypted backup is damaged.');
      data = await promptDecrypt(env);
      if (data === null) return null;
    } else data = env.data;
    if (!data || typeof data !== 'object') throw new Error('The backup contains no data.');
    return { data, exportedAt: typeof env.exportedAt === 'string' ? env.exportedAt : null, schemaVersion: env.schemaVersion };
  }
};

/* share sheet when the platform supports sharing files (iPhone), otherwise a normal download */
async function deliverFile(filename, text, mime = 'application/json') {
  const file = new File([text], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; /* otherwise fall back to a download */ }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  return 'downloaded';
}

/* nag banner: only when there is data and no recent backup */
function backupNag(meta, hasData) {
  if (!hasData) return null;
  if (!meta.lastBackup) return 'You have data but no backup yet. Make one so you can restore it if this device loses it.';
  const age = (Date.now() - Date.parse(meta.lastBackup)) / 86400000;
  const changed = meta.lastChange && Date.parse(meta.lastChange) > Date.parse(meta.lastBackup) + 1000;

}

   The app always works from its own on-device copy. This layer pushes local changes
   (per item, last write wins) and merges in changes made on the other phone.
   The Firebase calls live in firebaseBackend() only; everything else is plain logic. */
const SYNC_CONFIG = {
  apiKey: 'AIzaSyCztAn5kfhZ1yLjvia17D0dEsnDBvFzuKA',

async function firebaseBackend() {
  const [appM, authM, fsM] = await Promise.all([
    import(SYNC_SDK + 'firebase-app.js'), import(SYNC_SDK + 'firebase-auth.js'), import(SYNC_SDK + 'firebase-firestore.js')

    signIn: (email, pw) => authM.signInWithEmailAndPassword(auth, email, pw),
    signOut: () => authM.signOut(auth),
    watch: (coll, onDocs, onErr) => fsM.onSnapshot(fsM.collection(fs, coll),
      snap => { if (!snap.metadata.fromCache) onDocs(snap.docs.map(d => ({ id: d.id, data: d.data() }))); },   // ignore cache-only snapshots: an empty one would look like "everything was deleted"
      onErr),

    // First-time uploads (ts 0) never overwrite a copy that already exists.
    write: op => {
      const ref = fsM.doc(fs, op.coll, op.id);

const Sync = (() => {

  let model = null, db = null, dbKey = 'sync', backend = null, user = null, state0 = 'off';

  const nextN = () => (lastN = Math.max(Date.now() * 1000, lastN + 1));
  const keyOf = (c, id) => c + '/' + id;

  let saveChain = Promise.resolve();
  function save() { if (!db) return; const s = JSON.stringify(st); saveChain = saveChain.then(() => idbPut(db, dbKey, s)).catch(e => console.error(e)); }

  function status() {

    if (!user) return backend ? 'signed-out' : 'connecting';
    if (denied) return 'denied';
    if (errored) return 'error';
    if (!model.colls.every(c => ready[c])) return 'connecting';

  /* what changed on this device since we last synced -> queue it */
  function localDiff() {
    if (!st.enabled || !model) return;
    const present = new Set(); let dirty = false;
    for (const e of model.toEntities()) {
      const k = keyOf(e.coll, e.id); present.add(k);
      const j = canon(e.data);
      if (st.seen[k] === j) continue;
      st.seen[k] = j;
      if (!(k in st.order)) st.order[k] = nextN();
      st.outbox[k] = { op: 'set', coll: e.coll, id: e.id, data: JSON.parse(j), ts: st.joined ? nextTs() : 0, n: st.order[k] };

      if (a && a.op === 'del' && now - a.at < ACK_MS && u <= a.ts) continue;   // our delete just landed; the list is a moment behind
      const { _u, _n, ...data } = d.data;

    async signOut() { if (backend) await backend.signOut(); }

})();

/* ---- expense form: raw field values -> a validated expense (pure; used by the dialog and the tests) ---- */
function parseExpenseInput(t, inp, existingId) {
  const dg = curDigits(t.currency), fm = x => fmtMinor(x, t.currency);
  const desc = str(inp.desc).trim();
  const amt = toMinor(inp.amount, dg);
  if (amt == null || amt < 1 || amt > MAX_MINOR) return { error: `Enter the amount as a positive number with at most ${dg} decimals.`, field: 'amount' };
  if (!desc) return { error: 'Add a description.', field: 'desc' };
  const date = str(inp.date); if (date && !isISO(date)) return { error: 'Pick a valid date.', field: 'date' };
  const ids = Object.keys(inp.ins).filter(k => inp.ins[k]);
  if (!ids.length) return { error: 'Pick at least one person to split between.', field: 'who' };
  const known = new Set(Object.keys(inp.ins));
  let payers;
  if (inp.payerMode === 'multi') {
    payers = [];
    for (const [id, v] of Object.entries(inp.pays || {})) {
      if (str(v).trim() === '') continue;
      const a = toMinor(v, dg); if (a == null) return { error: 'A payer’s amount isn’t valid.', field: 'payers' };
      if (a > 0) payers.push({ p: id, a });
    }
    const sum = payers.reduce((s, p) => s + p.a, 0);
    if (!payers.length) return { error: 'Enter who paid and how much.', field: 'payers' };
    if (sum !== amt) return { error: `The payers add up to ${fm(sum)}, but the expense is ${fm(amt)} (${sum < amt ? fm(amt - sum) + ' short' : fm(sum - amt) + ' over'}).`, field: 'payers' };
  } else {
    if (!inp.payer || !known.has(inp.payer) && !t.people.some(p => p.id === inp.payer)) return { error: 'Pick who paid.', field: 'payers' };
    payers = [{ p: inp.payer, a: amt }];
  }
  const m = oneOf(inp.method, SPLIT_METHODS.map(x => x[0]), 'equal'), w = {};
  for (const id of ids) {
    const raw = str((inp.vals || {})[id]).trim(), person = t.people.find(p => p.id === id);
    if (m === 'equal') w[id] = 1;
    else if (m === 'shares') { const h = raw === '' ? hund(person ? person.wt : 1) : toMinor(raw, 2); if (h == null || h > 9900) return { error: 'Shares should be numbers like 1, 2 or 0.5.', field: 'split' }; w[id] = h / 100; }
    else if (m === 'pct') { const h = raw === '' ? 0 : toMinor(raw, 2); if (h == null || h > 10000) return { error: 'Percentages should be numbers between 0 and 100.', field: 'split' }; w[id] = h / 100; }
    else { const a = raw === '' ? 0 : toMinor(raw, dg); if (a == null) return { error: 'An amount in the split isn’t valid.', field: 'split' }; w[id] = a; }
  }
  const exp = { id: existingId || uid(), desc: desc.slice(0, 140), date, amt, payers, cat: BUDGET_CATS.includes(inp.cat) ? inp.cat : '', m, w, note: str(inp.note).slice(0, 500), bud: !!inp.bud };
  const chk = expenseShares(exp, fm);
  if (chk.err) return { error: chk.err, field: m === 'equal' ? 'who' : 'split' };
  return { exp, shares: chk.shares };
}

  const out = [row(['Expenses']), row(['Date', 'Description', 'Category', 'Paid by', 'Amount', 'Split', 'Note', 'In budget', ...pl.map(p => p.name)])];

  const when = parsed.exportedAt ? ` Backup made ${fmtDateTime(parsed.exportedAt)}.` : '';
  const skipped = dropped ? ` ${plural(dropped, 'unreadable item')} will be skipped.` : '';
  const body = `<p>${esc(sum + '.' + when + skipped)}</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps everything here for the backup. <b>Merge</b> adds trips that aren’t here yet and keeps the rest.</p>' : '') + (Sync.enabled() ? '<p class="muted"><b>Sharing is on:</b> Replace all also replaces the shared copy, so the other phone will change too.</p>' : '');
  const choice = await askDialog({
    title: 'Restore this backup?', body,
    buttons: hasLocal
      ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }]
      : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }]
  });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    state.trips = data.trips; state.settings = data.settings; uniqueItemIds();
    state.meta.lastBackup = ts; state.meta.lastChange = ts;
    await persist({ touch: false });
    render(); toast(`Restored ${sum}`); return true;
  }
  if (choice === 'merge') {
    const ids = new Set(state.trips.map(x => x.id)); let n = 0;
    for (const t of data.trips) if (!ids.has(t.id)) { state.trips.push(t); n++; }
    uniqueItemIds();
    await persist(); render(); toast(`Merged in ${plural(n, 'trip')}`); return true;
  }
  return false;
}
async function doRestore() {
  const f = await pickFile(); if (!f) return;
  let text;
  try { text = await readFileText(f); } catch { await msgBox('Couldn’t read that file', 'Try choosing it again.'); return; }
  await restoreFromText(text);
}
async function doWipe() {
  if (!(await confirmBox('Erase everything?', Sync.enabled() ? 'Sharing is on, so this also deletes every trip from the shared copy and from the other phone. Make a backup first if you might want them.' : 'This permanently deletes all trips on this device. Make a backup first if you might want them.', 'Erase everything'))) return;
  state = defaultState(); ui.geo = null;
  await persist({ touch: false });
  location.hash = '#/'; render(); toast('Everything erased');
}

/* ---- events ---- */
function curTrip() { return route().trip || null; }
function handleAction(a, el) {
  if (a.startsWith('sync-')) return syncAction(a);
  const t = curTrip(), id = el.dataset.id;
  switch (a) {
    case 'new-trip': return tripDialog(null);
    case 'edit-trip': return t && tripDialog(t);
    case 'export': return doExport();
    case 'restore': return doRestore();
    case 'wipe': return doWipe();
    case 'install': return runInstall();
  }
  if (a === 'todo-toggle' || a === 'todo-pin' || a === 'todo-edit') {
    const tr = el.dataset.trip ? tripById(el.dataset.trip) : t, x = tr && tr.todos.find(v => v.id === id);
    if (!x) return;
    if (a === 'todo-toggle') { x.done = el.checked; commit(); }
    else if (a === 'todo-pin') { x.pin = !x.pin; commit(); toast(x.pin ? 'Pinned to the Trips home screen' : 'Unpinned'); }
    else todoDialog(tr, x);
    return;
  }
  if (!t) return;
  switch (a) {
    case 'pack-list': ui.packList = el.dataset.name; return render();
    case 'pack-newlist': return listNameDialog(t, null);
    case 'pack-rename': return currentList(t) && listNameDialog(t, currentList(t));
    case 'pack-dellist': return currentList(t) && deleteList(t, currentList(t));
    case 'cruise-month': ui.cruiseMonth = +el.dataset.m; return render();
    case 'ports-edit': return t.cruise && portsDialog(t);
    case 'port-live': { const p = portById(el.dataset.port); const mm = ui.cruiseMonth != null ? ui.cruiseMonth : (t.startDate ? +t.startDate.slice(5, 7) - 1 : new Date().getMonth()); return p && portLive(p, mm); }
    case 'todo-toggle': { const x = t.todos.find(v => v.id === id); if (x) { x.done = el.checked; commit(); } return; }
    case 'todo-del': t.todos = t.todos.filter(v => v.id !== id); return commit();
    case 'todo-starter': {
      const have = new Set(t.todos.map(v => normText(v.text))); let n = 0;
      for (const s of TODO_STARTERS) if (!have.has(normText(s))) { t.todos.push({ id: uid(), text: s, done: false, pin: false, notes: '' }); n++; }
      commit(); return toast(n ? `Added ${plural(n, 'task')}` : 'You already have all of those');
    }
    case 'pack-toggle': { const x = t.packing.find(v => v.id === id); if (x) { x.packed = el.checked; commit(); } return; }
    case 'pack-edit': return packDialog(t, id);
    case 'pack-cruise': {
      const days = tripDays(t).length || 7;
      confirmBox('Cruise packing list', `Adds about ${cruiseTplCount()} items to the Glenn, Cindy and Joint lists, with clothing sized to ${plural(days, 'day')} (about 1.75 per day). Items you already have are skipped.`, 'Add items', false).then(ok => {
        if (!ok) return;
        const n = addCruiseTemplate(t); commit(); toast(n ? `Added ${plural(n, 'item')}` : 'Nothing new to add — you already have those');
      });
      return;
    }
    case 'pack-starter': return starterDialog(t);
    case 'pack-copy': return copyPackDialog(t);
    case 'pack-hide': ui.hidePacked = !ui.hidePacked; return render();
    case 'pack-reset': t.packing.forEach(i => { if (!currentList(t) || i.list === currentList(t)) i.packed = false; }); commit(); return toast('All items unchecked');
    case 'plan-add': return planDialog(t, null, { date: el.dataset.date || '' });
    case 'plan-edit': return planDialog(t, id);
    case 'bud-add': return budgetDialog(t, null);
    case 'bud-edit': return budgetDialog(t, id);
    case 'spl-add': return expenseDialog(t, null);
    case 'spl-edit': return expenseDialog(t, id);
    case 'spl-view': ui.splitView[t.id] = el.dataset.v; return render();
    case 'ppl-edit': return personDialog(t, id);
    case 'ppl-bulk': return peopleBulkDialog(t);
    case 'ppl-travelers': { const n = addTravelerPeople(t); commit(); return toast(n ? `Added ${pplN(n)}` : 'Those names are already on the list'); }
    case 'spl-fam': t.splitFam = !t.splitFam; return commit();
    case 'spl-pay': {
      const p = recordPayment(t, el.dataset.from, el.dataset.to, +el.dataset.a); if (!p) return toast('Couldn’t record that payment.');
      persist(); render(); return toast('Payment recorded', { label: 'Undo', fn: () => { t.payments = t.payments.filter(x => x.id !== p.id); commit(); } });
    }
    case 'spl-undo': t.payments = t.payments.filter(x => x.id !== id); commit(); return toast('Payment removed');
    case 'spl-pay-manual': return paymentDialog(t);
    case 'spl-stmt': return statementDialog(t, el.dataset.ent);
    case 'spl-copy': return copyOrShow(splitText(t), 'Copy this text');
    case 'spl-print': return splitPrintDialog(t);
    case 'spl-csv': return deliverFile(`${t.name.replace(/[^\w]+/g, '-').replace(/^-|-$/g, '') || 'trip'}-expenses-${todayISO()}.csv`, '\ufeff' + splitCSV(t), 'text/csv');
    case 'idea-add': return ideaDialog(t, null);
    case 'idea-edit': return ideaDialog(t, id);
    case 'idea-filter': ui.ideaFilter = el.dataset.type; return render();
    case 'idea-plan': { const i = t.ideas.find(v => v.id === id); if (i) planDialog(t, null, { title: i.title, notes: [i.notes, i.url].filter(Boolean).join('\n'), ideaId: i.id }); return; }
    case 'print': return printDialog(t, el.dataset.preset);
    case 'wx-tab': ui.wxTab[t.id] = el.dataset.tab === 'avg' ? 'avg' : 'current'; return render();
    case 'wx-refresh': ui.wxTried[t.id] = ''; return refreshWeather(t, true);
    case 'wx-units': state.settings.units = state.settings.units === 'imperial' ? 'metric' : 'imperial'; return commit();
    case 'wx-setloc': t.location = null; t.weather = null; ui.geo = { tripId: t.id, query: t.destination, status: 'idle', results: [], error: '' }; persist(); return render();
    case 'wx-pick': {
      const r = ui.geo && ui.geo.results[+el.dataset.i]; if (!r) return;
      t.location = r; t.weather = null; ui.geo = null; ui.wxTried[t.id] = ''; persist(); return render();
    }
  }
}
app.addEventListener('click', e => {
  if (e.target.closest('a')) return; // real links (maps, tabs, back) just work
  const el = e.target.closest('[data-action]');
  if (!el || el.matches('input[type=checkbox]')) return;
  handleAction(el.dataset.action, el);
});
app.addEventListener('change', e => { if (e.target.matches('input[type=checkbox][data-action]')) handleAction(e.target.dataset.action, e.target); });
app.addEventListener('input', e => {
  if (e.target.id !== 'tripNotes') return;
  const t = curTrip(); if (!t) return;
  t.notes = e.target.value; clearTimeout(noteTimer); noteTimer = setTimeout(() => persist(), 400);
});
app.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const t = curTrip(); if (!t) return;
  const fd = k => (f.elements[k] ? f.elements[k].value.trim() : '');
  switch (f.dataset.form) {
    case 'todo-add': { const x = fd('text'); if (x) { t.todos.push({ id: uid(), text: x.slice(0, 140), done: false, pin: false, notes: '' }); ui.focus = 'form[data-form="todo-add"] input'; commit(); } break; }
    case 'pack-add': {
      let text = fd('text'), qty = 1; const m = text.match(/^(\d{1,2})\s*[x×]?\s+(.+)$/i);
      if (m) { qty = +m[1]; text = m[2]; }
      if (text) { ui.lastCat = fd('cat'); t.packing.push({ id: uid(), text: text.slice(0, 120), cat: oneOf(ui.lastCat, PACK_CATS, 'Other'), qty: clampInt(qty, 1, 99, 1), packed: false, list: currentList(t) || (f.elements.list && t.packLists.includes(f.elements.list.value) ? f.elements.list.value : t.packLists[0]) }); ui.focus = 'form[data-form="pack-add"] input[name="text"]'; commit(); }
      break;
    }
    case 'geo': { const q = fd('q'); if (q) searchGeo(t, q); break; }
    case 'ppl-add': {
      const err = addPerson(t, { name: fd('pname'), group: fd('pgroup'), wt: fd('pwt') });
      if (err) toast(err); else { ui.focus = 'form[data-form="ppl-add"] input[name="pname"]'; commit(); }
      break;
    }
  }
});
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dialog[open]')) render(); });

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const gc = await idbGet(db, 'geocache'); if (gc) loadGeo(gc);
      const raw = await idbGet(db, 'state');
      if (raw) {
        try { state = loadState(JSON.parse(raw)); }
        catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged — a copy was kept aside.'); }
      }
    } catch (e) { console.error(e); db = null; }
  }
  if (uniqueItemIds()) persist({ touch: false, sync: false });
  render();
  Sync.onChange(renderIfSafe);
  Sync.start({ db, key: 'sync', model: tripModel });
})();
</script>
