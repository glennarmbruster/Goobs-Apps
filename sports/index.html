<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports</title>
<meta name="description" content="Schedules, standings and rivalry records for your teams. You enter the data; it stays on your device.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f6f8f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1410" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sports">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--bg:#f6f8f1;--accent:#4d7c0f;--accent-ink:#fff;--accent-soft:#e3efd0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1410;--card:#171e17;--line:#263226;--soft:#1e271e;--accent:#a3e635;--accent-ink:#13200a;--accent-soft:#25331a}}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.ctl .btn{flex:1}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.filters .field{min-width:0}
.filters label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:3px}
#dlg .fields2 .field:has(textarea),#dlg .fields2 .field:has(select),#dlg .fields2 .field.check{grid-column:1/-1}
#dlg .fields2 .field{min-width:0}
.hero{padding:16px;border-left:6px solid var(--accent);background:var(--accent-soft);cursor:pointer;margin-top:14px}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero .cd{font-size:36px;font-weight:800;color:var(--accent);line-height:1.1;margin-top:2px}
.hero .cdsub{font-size:14px;font-weight:600;color:var(--muted);min-height:20px}
.hero .vs{font-size:19px;font-weight:700;margin-top:8px;overflow-wrap:anywhere}
.hero .meta{font-size:14px;color:var(--ink);margin-top:3px;overflow-wrap:anywhere}
.cal{flex:none;width:48px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:3px 0;background:var(--bg)}
.cal b{display:block;font-size:10px;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
.cal span{display:block;font-size:19px;font-weight:800;line-height:1.1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;flex:none}
.score{font-weight:800;white-space:nowrap;text-align:right}
.score small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.when{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.rowbtn{flex:none}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:9px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td{border-top:1px solid var(--line)}
.tbl th{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.tbl .tm{text-align:left;position:sticky;left:0;background:var(--card);max-width:9.5em;overflow:hidden;text-overflow:ellipsis}
.tbl td.tm{font-weight:600}
.tbl .lead td{background:var(--accent-soft)}
.tbl .lead td.tm{background:var(--accent-soft)}
.tbl .l{text-align:left}
.tbl tr[data-action]{cursor:pointer}
.mx{text-align:center!important;min-width:56px;height:44px;cursor:pointer;font-weight:700;font-size:13px}
.mx.self{background:var(--soft);color:var(--muted);cursor:default}
.mx.p1{background:rgba(22,163,74,.15)} .mx.p2{background:rgba(22,163,74,.3)} .mx.p3{background:rgba(22,163,74,.48)}
.mx.n1{background:rgba(220,38,38,.15)} .mx.n2{background:rgba(220,38,38,.3)} .mx.n3{background:rgba(220,38,38,.48)}
.mx.none{color:var(--muted);font-weight:400}
.series{text-align:center;margin-top:14px}
.series .sr-teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.series .sr-teams>div{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere;font-size:15px}
.series .sr-rec{flex:none!important;font-size:30px;font-weight:800;color:var(--accent);white-space:nowrap}
.series .lead-tx{font-weight:700;margin-top:6px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tiles2 .tile{padding:12px}
.tiles2 .val{font-size:18px}
.tiles2 .sub{font-size:12px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.chartbox{padding:10px 8px 6px;margin-top:12px}
.chartbox h3{padding:0 6px;font-size:14px}
.chartbox svg{width:100%;height:auto;display:block}
.optrow{display:flex;gap:10px;align-items:center}
.optrow label{font-size:15px}
.pvwrap{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.pv th,.pv td{padding:6px 7px;font-size:12.5px;white-space:normal;text-align:left;vertical-align:top}
.pv tr.bad td{color:var(--bad)} .pv tr.dup td{color:var(--muted)}
.fine{font-size:13px;color:var(--muted)}
.sr{position:absolute;left:-9999px}
.more{margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.etbl tr.lead td{font-weight:800}
.espn-line{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.espn-line .fine{flex:1;min-width:0;overflow-wrap:anywhere}
.espn-test{margin-top:8px;overflow-wrap:anywhere}.espn-test:empty{display:none}.espn-test.ok{color:var(--ok,#15803d);font-weight:600}.espn-test.bad{color:var(--bad,#b91c1c);font-weight:600}
.espn-card{margin-top:14px}
.eh{margin:16px 2px 6px;font-size:15px}
details.eg{margin-top:8px;padding:0}
details.eg>summary{padding:12px 14px;font-weight:700;cursor:pointer;min-height:44px;box-sizing:border-box;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.pbar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="grow"><h1 id="title">Sports</h1><div class="sub" id="sub"></div></div><button type="button" class="btn small primary hide" id="addBtn">+ Game</button></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="schedule"><span class="ico">📅</span>Schedule</button>
  <button type="button" data-tab="standings"><span class="ico">📊</span>Standings</button>
  <button type="button" data-tab="rivalries"><span class="ico">⚔️</span>Rivalries</button>
  <button type="button" data-tab="teams"><span class="ico">👥</span>Teams</button>
  <button type="button" data-tab="backup"><span class="ico">💾</span>Backup</button>
</div></nav>
<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');

const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);

    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));

}

  return new Promise(resolve => {
    let result = null;
    formDialog({
      title: 'Encrypted backup', intro: 'Enter the passphrase you chose when you made this backup.',
      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },

}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');

      if (!(window.crypto && crypto.subtle)) throw new Error('Encrypted backups need a secure (https) connection.');

    return { data, exportedAt: typeof env.exportedAt === 'string' ? env.exportedAt : null, schemaVersion: env.schemaVersion };

/* ---- past seasons (one request at a time, with progress and cancel) ---- */
function latestSeasonYear(t) {
  const ys = state.games.filter(g => g.source === 'espn' && g.type === 'regular' && (g.homeId === t.id || g.awayId === t.id)).map(g => seasonYear(g.season));
  return ys.length ? Math.max(...ys) : new Date().getFullYear();
}
function progressDialog(title) {
  const d = $('#ask'), ctl = new AbortController();
  d.innerHTML = `<div class="dlg-form"><h2>${esc(title)}</h2><div class="ask-body"><p id="progTxt" role="status">Starting…</p><div class="pbar"><i id="progBar" style="width:0%"></i></div></div><div class="dlg-actions ask-actions"><button type="button" class="btn" data-k="stop">Cancel</button></div></div>`;
  $('[data-k="stop"]', d).onclick = () => { ctl.abort(); const p = $('#progTxt', d); if (p) p.textContent = 'Cancelling…'; };

  d.showModal();
  return { signal: ctl.signal, update(txt, frac) { const p = $('#progTxt', d), b = $('#progBar', d); if (p) p.textContent = txt; if (b) b.style.width = Math.round(frac * 100) + '%'; }, close() { d.oncancel = null; if (d.hasAttribute('open')) d.close(); } };
}
async function importPastSeasons(tid, count) {
  const t = tm(tid); if (!t || !t.espnId) return null;
  const base = latestSeasonYear(t), years = []; for (let i = 1; i <= count; i++) years.push(base - i);
  const prog = progressDialog(`Past seasons — ${t.name}`), out = { years: [], done: [], failed: [], cancelled: false, added: 0, updated: 0 };
  try {
    for (let i = 0; i < years.length; i++) {
      const y = years[i];
      prog.update(`Season ${y} (${i + 1} of ${years.length})…`, i / years.length);
      if (prog.signal.aborted) { out.cancelled = true; break; }
      try {
        const parsed = parseEspnSchedule(await espnGet(espnScheduleUrl(t.espnPath, t.espnId, y), prog.signal));
        const r = mergeEspnGames(state, t.espnPath, parsed);
        out.added += r.added; out.updated += r.updated; out.done.push({ year: y, games: parsed.games.length });
        await persist();
      } catch (e) {
        if (e.kind === 'cancelled') { out.cancelled = true; break; }
        out.failed.push({ year: y, why: e.message });
        if (e.kind === 'offline') break;
      }
    }
    if (out.done.length) { state.espn.lastRefresh = state.espn.lastRefresh || new Date().toISOString(); await persist(); }
  } finally { prog.close(); }
  render();
  return out;
}

    fields: [

    ],

    out += `<section class="card pad series" id="series"><div class="sr-teams"><div>${dot(a)}${esc(A)}</div><div class="sr-rec">0-0</div><div>${esc(B)}${dot(b)}</div></div><p class="muted" style="margin-top:8px">No meetings recorded yet. Add a past meeting, or enter final scores on the Schedule tab.</p></section>`;
  } else {
    const lead = h.w === h.l ? `Series tied ${fmtRec(h)}` : h.w > h.l ? `${A} leads ${fmtRec(h)}` : `${B} leads ${h.l}-${h.w}${h.t ? '-' + h.t : ''}`;
    const sk = h.streak, skTx = sk.type === 'W' ? `${A} has won ${sk.len} straight` : sk.type === 'L' ? `${B} has won ${sk.len} straight` : `Last ${sk.len} ended in ties`;
    out += `<section class="card pad series" id="series"><div class="sr-teams"><div>${dot(a)}${esc(A)}</div><div class="sr-rec num">${fmtRec(h)}</div><div>${esc(B)}${dot(b)}</div></div><div class="lead-tx">${esc(lead)}</div><div class="muted" style="font-size:14px;margin-top:4px">${esc(skTx)} · ${plural(h.n, 'meeting')}<br>First: ${esc(gameDateLabel(h.first))} · Last: ${esc(gameDateLabel(h.last))}</div></section>`;
    const big = (x, who) => x ? `<div class="val num">${x.g.homeId === who ? x.g.homeScore : x.g.awayScore}–${x.g.homeId === who ? x.g.awayScore : x.g.homeScore}</div><div class="sub">by ${x.margin}, ${esc(gameDateLabel(x.g))}</div>` : '<div class="val">–</div><div class="sub">no wins</div>';
    const am = h.avgMargin, amTx = am === 0 ? 'even' : (am > 0 ? tShort(a) : tShort(b)) + ' +' + Math.abs(am).toFixed(1);
    out += `<div class="tiles2"><div class="card tile"><div class="lbl">${esc(tShort(a))} biggest win</div>${big(h.bigA, a)}</div><div class="card tile"><div class="lbl">${esc(tShort(b))} biggest win</div>${big(h.bigB, b)}</div><div class="card tile"><div class="lbl">Average margin</div><div class="val num" id="avgm">${esc(amTx)}</div><div class="sub">${esc(h.avgTotal.toFixed(1))} total per game</div></div><div class="card tile"><div class="lbl">Playoff record</div><div class="val num">${h.playoff.w + h.playoff.l + h.playoff.t ? esc(tShort(a) + ' ' + fmtRec(h.playoff)) : '–'}</div><div class="sub">${h.playoff.w + h.playoff.l + h.playoff.t ? plural(h.playoff.w + h.playoff.l + h.playoff.t, 'game') : 'none yet'}</div></div></div>`;
    out += `<div class="sec-h"><span>Home / away splits (${esc(tShort(a))})</span></div><div class="card"><table class="tbl" id="splits"><tbody><tr><td class="l">At ${esc(tShort(a))}</td><td>${fmtRec(h.atA)}</td></tr><tr><td class="l">At ${esc(tShort(b))}</td><td>${fmtRec(h.atB)}</td></tr><tr><td class="l">Neutral / unknown</td><td>${fmtRec(h.neutral)}</td></tr></tbody></table></div>`;
    const dec = decadeBreakdown(h.meetings, a);
    out += `<div class="sec-h"><span>By decade (${esc(tShort(a))})</span></div><div class="card"><table class="tbl" id="decades"><tbody>${dec.map(d => `<tr><td class="l">${d.decade}s</td><td>${fmtRec(d)}</td><td>${d.n} gm</td></tr>`).join('')}</tbody></table></div>`;
    out += `<div class="card chartbox"><h3>Every meeting</h3>${timelineSVG(h, a, b)}</div>`;
  }
  const note = state.rivalNotes[pairKey(a, b)] || '';
  out += `<section class="card pad" style="margin-top:14px" id="rnote"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>What makes this a rivalry</h3><button type="button" class="btn small" data-action="edit-note">${note ? 'Edit' : 'Add notes'}</button></div>${note ? `<p style="margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(note)}</p>` : '<p class="muted" style="margin:8px 0 0">Nothing written yet.</p>'}</section>`;
  if (h.n) out += `<div class="sec-h"><span>All meetings (${h.n})</span></div><ul class="card list" id="meetings">${[...h.meetings].reverse().map(g => gameRowHTML(g, a)).join('')}</ul>`;
  return out + renderMatrix();
}
function noteDialog() {
  const [a, b] = rivalPair(), key = pairKey(a, b);
  formDialog({
    title: `${tName(a)} vs ${tName(b)}`, submitLabel: 'Save',
    fields: [{ name: 'note', label: 'What makes this a rivalry', type: 'textarea', value: state.rivalNotes[key] || '', placeholder: 'History, trophies, bad blood…' }],
    onSubmit: v => { const t = v.note.trim(); if (t) state.rivalNotes[key] = t.slice(0, 2000); else delete state.rivalNotes[key]; commit(); toast('Notes saved'); }
  });
}

/* ===================== TEAMS ===================== */
function espnCardHTML() {
  const syn = syncedTeams().length, tst = ui.espnTest;
  return `<section class="card pad espn-card" id="espnCard"><h3>Add from a league (online)</h3><p class="fine" style="margin:4px 0 0">Pick a league and a team. The app downloads its schedule and standings from ESPN and keeps a copy on this device. Offline, you see the saved copy. Hand-entered teams and games still work as before.</p><div class="ctl"><button type="button" class="btn primary" data-action="espn-add">Add team from a league</button>${syn ? '<button type="button" class="btn" data-action="espn-past">Past seasons</button>' : ''}<button type="button" class="btn" data-action="espn-test">Test connection</button></div>${syn ? espnLineHTML() : ''}<div class="fine espn-test ${tst ? tst.st : ''}" id="espnTest" role="status">${tst ? esc(tst.msg) : ''}</div></section>`;
}
function renderTeams() {
  if (!state.teams.length) return storageBannerHTML() + '<div class="empty"><div class="big">👥</div><h2>No teams yet</h2><p>Add your team and its opponents. Mark your own teams so the app knows whose point of view to use.</p><button type="button" class="btn primary" data-action="add-team">Add a team</button></div>' + espnCardHTML();
  const cnt = id => state.games.filter(g => g.homeId === id || g.awayId === id).length;
  const byName = (a, b) => (b.mine - a.mine) || a.name.localeCompare(b.name);
  const sorted = state.teams.filter(t => !t.auto || isMine(t)).sort(byName), opps = state.teams.filter(t => t.auto && !isMine(t)).sort(byName);
  const li = t => `<li class="row" data-action="edit-team" data-id="${esc(t.id)}"><span class="sw" style="background:${esc(t.color)};margin:0"></span><div class="row-main"><div class="row-title">${esc(t.name)}${t.mine ? '<span class="badge acc">My team</span>' : ''}${t.espnSync ? '<span class="badge">ESPN</span>' : ''}</div><div class="row-sub">${[t.short, t.league, t.division].filter(Boolean).map(esc).join(' · ')}</div></div><div class="when">${plural(cnt(t.id), 'game')}</div></li>`;
  return storageBannerHTML() + espnCardHTML() + (sorted.length ? `<ul class="card list" style="margin-top:14px" id="teamlist">${sorted.map(li).join('')}</ul>` : '') + (opps.length ? `<details class="card eg" id="oppsBox" style="margin-top:14px"><summary>Opponents (auto-added) <span class="fine"> · ${opps.length}</span></summary><ul class="list" id="opplist">${opps.map(li).join('')}</ul></details>` : '');
}
function teamDialog(id) {
  const t = id ? tm(id) : null;
  if (id && !t) return;
  formDialog({
    title: t ? 'Edit team' : 'Add team', submitLabel: t ? 'Save' : 'Add team', grid: 'fields2',
    intro: t && t.espnSync ? `Synced from ESPN (${leagueLabel(t.espnPath)}). Its games refresh automatically.` : '',
    extra: t && t.espnSync ? [{ label: 'Past seasons', onClick: () => { $('#dlg').close(); pastDialog(t.id); } }] : [],
    fields: [
      { name: 'name', label: 'Team name', required: true, value: t ? t.name : '', capitalize: 'words' },
      { name: 'short', label: 'Abbreviation', value: t ? t.short : '', placeholder: 'auto', capitalize: 'characters' },
      { name: 'color', label: 'Color', type: 'color', value: t ? t.color : PALETTE[state.teams.length % PALETTE.length] },
      { name: 'league', label: 'League / sport', value: t ? t.league : '', placeholder: 'NFL, Little League…' },
      { name: 'division', label: 'Division / group', value: t ? t.division : '', placeholder: 'AFC South', hint: 'Standings are grouped by this.' },
      { name: 'mine', label: 'This is my team', type: 'checkbox', value: t ? t.mine : !state.teams.some(x => x.mine) },
      { name: 'notes', label: 'Notes', type: 'textarea', value: t ? t.notes : '' }
    ],
    onSubmit: v => {
      const name = cleanTeamName(v.name); if (!name) return 'Team name is required.';
      if (state.teams.some(x => x.id !== (t && t.id) && normName(x.name) === normName(name))) return 'You already have a team with that name.';
      if (!t && state.teams.length >= MAX.teams) return 'Team limit reached.';
      const rec = normTeam({ id: t ? t.id : uid(), name, short: v.short, league: v.league, division: v.division, color: v.color, mine: v.mine, notes: v.notes.trim(), espnId: t && t.espnId, espnPath: t && t.espnPath, espnSync: t && t.espnSync, auto: t && t.auto && !v.mine });
      if (t) Object.assign(t, rec); else state.teams.push(rec);
      commit(); toast(t ? 'Team updated' : 'Team added');
    },
    onDelete: t ? async () => {
      const gs = state.games.filter(g => g.homeId === t.id || g.awayId === t.id);
      const fin = gs.filter(isScored).length;
      if (t.espnSync) {
        const sy = gs.filter(g => g.source === 'espn').length;
        const choice = await askDialog({ title: `Remove ${t.name}?`, body: `<p>${esc(`${t.name} is synced from ESPN and is in ${plural(gs.length, 'game')} (${sy} synced, ${fin} with a final score). Keep the games, or delete them along with the team?`)}</p><p class="muted">Keeping stops the sync: the team and its games stay, but nothing refreshes.</p>`, buttons: [{ label: 'Cancel', value: 'cancel' }, { label: 'Keep games', value: 'keep', kind: 'primary' }, { label: `Delete team and ${plural(gs.length, 'game')}`, value: 'delete', kind: 'danger' }] });
        if (choice === 'keep') { t.espnSync = false; pruneEspn(); commit(); toast(`${t.name} is no longer synced; games kept`); return true; }
        if (choice !== 'delete') return false;
      } else {
        const body = gs.length ? `${t.name} is in ${plural(gs.length, 'game')} (${fin} with a final score, ${gs.length - fin} without). Deleting the team also deletes those games and their results.` : `${t.name} has no games.`;
        if (!(await confirmBox(gs.length ? `Delete ${t.name} and ${plural(gs.length, 'game')}?` : `Delete ${t.name}?`, body, gs.length ? `Delete team and ${plural(gs.length, 'game')}` : 'Delete'))) return false;
      }
      state.games = state.games.filter(g => g.homeId !== t.id && g.awayId !== t.id);
      state.teams = state.teams.filter(x => x.id !== t.id);
      for (const k of Object.keys(state.rivalNotes)) if (k.split('|').includes(t.id)) delete state.rivalNotes[k];
      if (ui.fTeam === t.id) setFTeam('mine');
      pruneEspn(); commit(); toast(gs.length ? `Deleted ${t.name} and ${plural(gs.length, 'game')}` : 'Team deleted'); return true;
    } : null
  });
}

/* ===================== BACKUP ===================== */
function renderBackup() {
  const last = state.meta.lastBackup ? `Last backup: ${esc(fmtDateTime(state.meta.lastBackup))}.` : 'No backup made yet.';
  const canEncrypt = !!(window.crypto && crypto.subtle);
  return storageBannerHTML() + installCardHTML() + `<div class="stack">
    <section class="card pad"><h3>Back up</h3>
      <p class="muted">${last}</p>
      <p>Saves one file with your teams, games, scores and rivalry notes. On iPhone it opens the share sheet; save it to Files or OneDrive. Keep the file out of your GitHub repo.</p>
      ${canEncrypt ? `<div class="field"><label for="bkPass">Passphrase (optional — encrypts the file)</label><input id="bkPass" type="password" autocomplete="new-password"></div>
      <div class="field" style="margin-top:8px"><label for="bkPass2">Repeat passphrase</label><input id="bkPass2" type="password" autocomplete="new-password"></div>
      <p class="hint">If you set one, the file can’t be opened without it.</p>` : ''}
      <button type="button" class="btn primary block" style="margin-top:12px" data-action="export">Back up now</button></section>
    <section class="card pad"><h3>Restore</h3><p>Pick a backup file made by this app. You’ll choose whether to replace what’s here or merge it in.</p>
      <button type="button" class="btn block" data-action="restore">Choose backup file…</button></section>
    <section class="card pad"><h3>Danger zone</h3><p>Erases everything in this app on this device.</p>
      <button type="button" class="btn danger block" data-action="wipe">Erase everything on this device</button></section>
    <p class="hint" style="text-align:center">Your data lives only on this device. Nothing is sent anywhere.</p></div>`;
}
async function doExport() {
  const pass = ($('#bkPass') || {}).value || '', pass2 = ($('#bkPass2') || {}).value || '';
  if (pass) {
    if (pass.length < 8) return toast('Use at least 8 characters for the passphrase.');
    if (pass !== pass2) return toast('The two passphrases don’t match.');
  }
  const btn = $('[data-action="export"]'); if (btn) btn.disabled = true;
  try {
    const text = await Backup.build({ appId: APP_ID, schema: SCHEMA, data: exportData(), passphrase: pass || null });
    const r = await deliverFile(`goobs-sports-backup-${todayISO()}${pass ? '-encrypted' : ''}.json`, text, 'application/json');
    if (r !== 'cancelled') {
      state.meta.lastBackup = new Date().toISOString();
      await persist({ touch: false });
      render();
      toast(r === 'shared' ? 'Backup shared' : 'Backup saved to your downloads');
    }
  } catch (e) { toast('Backup failed: ' + e.message); }
  finally { const b2 = $('[data-action="export"]'); if (b2) b2.disabled = false; }
}
async function restoreFromText(text) {
  let parsed;
  try { parsed = await Backup.parse(text, { appId: APP_ID, schema: SCHEMA }); }
  catch (e) { await msgBox('Can’t restore that file', e.message); return false; }
  if (!parsed) return false;
  const { data, dropped } = normalizeData(parsed.data);
  if (!hasAnyData(data)) { await msgBox('Nothing to restore', 'That backup has no data in it.'); return false; }
  const hasLocal = hasAnyData();
  const sum = `${plural(data.teams.length, 'team')}, ${plural(data.games.length, 'game')}`;
  const when = parsed.exportedAt ? ` Backup made ${fmtDateTime(parsed.exportedAt)}.` : '';
  const skipped = dropped ? ` ${plural(dropped, 'unreadable item')} will be skipped.` : '';
  const body = `<p>${esc(sum + '.' + when + skipped)}</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps everything here for the backup. <b>Merge</b> adds what isn’t here yet and keeps your current settings.</p>' : '');
  const choice = await askDialog({
    title: 'Restore this backup?', body,
    buttons: hasLocal
      ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }]
      : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }]
  });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    for (const k of DATA_KEYS) state[k] = data[k];
    state.meta.lastBackup = ts; state.meta.lastChange = ts;
    ui.fTeam = state.prefs.fTeam; ui.rA = ui.rB = null;
    await persist({ touch: false });
    render(); toast(`Restored ${sum}`); return true;
  }
  if (choice === 'merge') {
    const merged = { settings: state.settings, espn: state.espn.lastRefresh ? state.espn : data.espn, prefs: state.prefs, rivalNotes: { ...data.rivalNotes, ...state.rivalNotes } }; let added = 0;
    for (const k of ['teams', 'games']) { const ids = new Set(state[k].map(x => x.id)); merged[k] = [...state[k]]; for (const x of data[k]) if (!ids.has(x.id)) { merged[k].push(x); added++; } }
    const n = normalizeData(merged).data;
    for (const k of DATA_KEYS) state[k] = n[k];
    await persist(); render(); toast(`Merged in ${plural(added, 'item')}`); return true;
  }
  return false;
}
async function doRestore() {
  const f = await pickFile(); if (!f) return;
  let text;
  try { text = await readFileText(f); } catch { await msgBox('Couldn’t read that file', 'Try choosing it again.'); return; }
  await restoreFromText(text);
}
async function doWipe() {
  if (!(await confirmBox('Erase everything?', 'This permanently deletes all teams, games, scores and notes on this device.', 'Erase everything'))) return;
  state = defaultState(); ui.fTeam = 'mine'; ui.fSeason = null; ui.sSeason = null; ui.rA = ui.rB = null;
  await persist({ touch: false });
  render(); toast('Everything erased');
}

/* ===================== shell ===================== */
const TABS = { schedule: ['Schedule', renderSchedule], standings: ['Standings', renderStandings], rivalries: ['Rivalries', renderRivalries], teams: ['Teams', renderTeams], backup: ['Backup & restore', renderBackup] };
const ADD = { schedule: '+ Game', rivalries: '+ Meeting', teams: '+ Team' };
function render() {
  const y = window.scrollY;
  view.innerHTML = TABS[ui.tab][1]();
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'));
  const add = $('#addBtn'), label = ADD[ui.tab] || '';
  add.classList.toggle('hide', !label); if (label) add.textContent = label;
  $('#title').textContent = 'Sports';
  $('#sub').textContent = TABS[ui.tab][0] + ' · ' + new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  window.scrollTo(0, y);
}
function go(t) { ui.tab = t; render(); window.scrollTo(0, 0); }

view.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'add-game': gameDialog(null); break;
    case 'edit-game': gameDialog(id); break;
    case 'enter-score': scoreDialog(id); break;
    case 'import': importDialog(); break;
    case 'export-ics': exportICS(); break;
    case 'show-all': ui.showAll = true; render(); break;
    case 'add-team': teamDialog(null); break;
    case 'edit-team': teamDialog(id); break;
    case 'add-meeting': meetingDialog(); break;
    case 'edit-note': noteDialog(); break;
    case 'rival': ui.rA = el.dataset.a; ui.rB = el.dataset.b; ui.tab = 'rivalries'; render(); window.scrollTo(0, 0); break;
    case 'export': doExport(); break;
    case 'restore': doRestore(); break;
    case 'wipe': doWipe(); break;
    case 'install': runInstall(); break;
    case 'chip': setFTeam(el.dataset.v); ui.showAll = false; render(); break;
    case 'league-refresh': ensureStandings(el.dataset.p, true); break;
    case 'league': state.prefs.sLeague = el.dataset.v; ui.sSeason = null; commit(); break;
    case 'espn-add': addFromLeagueDialog(); break;
    case 'espn-refresh': refreshEspn(); break;
    case 'espn-past': pastDialog(); break;
    case 'espn-test': testEspn(); break;
  }
});
view.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.sel) {
    const v = el.value;
    if (el.dataset.sel === 'fTeam') setFTeam(v);
    else if (el.dataset.sel === 'fSeason') ui.fSeason = v;
    else if (el.dataset.sel === 'sSeason') ui.sSeason = v;
    else if (el.dataset.sel === 'moreLeague') { if (!v) return; state.prefs.sLeague = leagueLabel(v).toLowerCase(); ui.sSeason = null; persist({ touch: false }); }
    else if (el.dataset.sel === 'rA') { ui.rA = v; if (ui.rB === v) ui.rB = null; }
    else if (el.dataset.sel === 'rB') ui.rB = v;
    ui.showAll = false; render();
  } else if (el.dataset.opt === 'otl') { state.settings.otl = el.checked; commit(); }
  else if (el.dataset.opt === 'stMine') { state.prefs.stMine[el.dataset.path] = el.checked; commit(); }
});
$('#addBtn').onclick = () => { if (ui.tab === 'rivalries') meetingDialog(); else if (ui.tab === 'teams') teamDialog(null); else gameDialog(null); };
$$('nav.tabs button').forEach(b => { b.onclick = () => go(b.dataset.tab); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dialog[open]')) { render(); maybeAutoRefresh(); } });
window.addEventListener('online', () => { paintEspnStatus(); maybeAutoRefresh(); });
window.addEventListener('offline', paintEspnStatus);
setInterval(tickCountdown, 30000);

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const raw = await idbGet(db, 'state');
      if (raw) {
        try { state = loadState(JSON.parse(raw)); }
        catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged — a copy was kept aside.'); }
      }
    } catch (e) { console.error(e); db = null; }
  }
  ui.fTeam = state.prefs.fTeam;
  render();
  maybeAutoRefresh();
})();
</script>
</body>
</html>
