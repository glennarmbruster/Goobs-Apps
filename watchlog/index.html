<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch Log</title>
<meta name="description" content="Private TV and movie log: cast and crew you enter, who-was-in-what cross-reference, ratings, watchlist. Data stays on your device.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#faf5fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#170f19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watch Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--bg:#faf5fb;--accent:#a21caf;--accent-ink:#fff;--accent-soft:#f5d0fe}
@media (prefers-color-scheme:dark){:root{--bg:#170f19;--card:#231a26;--line:#3a2a40;--soft:#2c2031;--accent:#e879f9;--accent-ink:#2d0833;--accent-soft:#4a1d52}}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.big-add{margin-top:14px}
.segs{display:flex;gap:8px;margin-top:14px}
.segs .chip{flex:1;text-align:center;padding:6px 4px}
.cards{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.qa{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 12px}
.qa .btn{flex:1 1 auto}
.stars{font-weight:700;color:var(--accent);white-space:nowrap}
.ctrl{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.ctrl .two{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.ctrl .two select{min-width:0}
.fine{font-size:13px;color:var(--muted)}
.synopsis{margin:0 0 12px;line-height:1.45;color:var(--ink)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0;font-size:15px}
.facts dt{color:var(--muted);font-size:13px;font-weight:600;padding-top:2px}
.facts dd{margin:0;overflow-wrap:anywhere}
.sub-h{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sub-h:first-child{margin-top:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1 1 auto}
.chain{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:15px;line-height:1.7}
.chain a,.chain button.lnk{color:var(--accent);font-weight:700;text-decoration:none;cursor:pointer;background:none;border:0;padding:4px 2px;font:inherit;font-weight:700;min-height:36px}
.chain .tt{color:var(--ink);font-weight:600}
.chain .ar{color:var(--muted)}
.res{margin-top:14px}
.note{padding:10px 12px;border-radius:12px;background:var(--soft);font-size:14px;margin:10px 0;overflow-wrap:anywhere}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.brow{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.brow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bn{font-weight:700;min-width:22px;text-align:right}
.hist{display:flex;gap:5px;align-items:flex-end;height:110px;margin-top:8px}
.hc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.hc i{display:block;width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.hc b{font-size:11px;color:var(--muted);font-weight:700;line-height:1.4}
.hl{display:flex;gap:5px;margin-top:2px}
.hl span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.tilesb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:13px;background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:999px;font-weight:600}
.cname{font-weight:600}
.cchar{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .btn.small{flex:none}
.dots{letter-spacing:2px}
.orow{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;display:block;padding:12px 4px;min-height:44px;cursor:pointer}
.orow:first-child{border-top:0}
.orow .ot{font-weight:600;overflow-wrap:anywhere}
.orow .ov{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.keyrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.keyrow .btn{flex:1 1 auto}
.hs{width:46px;height:62px;object-fit:cover;border-radius:8px;flex:none;background:var(--soft)}
.hs.big{width:92px;height:124px;border-radius:12px}
.phead{display:flex;gap:14px;align-items:flex-start}
.castctl{display:flex;flex-direction:column;gap:8px;padding:0 14px 10px}
.castctl .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.castctl .chip{flex:none}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="grow"><h1 id="title">Watch Log</h1><div class="sub" id="sub"></div></div><button type="button" class="btn small primary hide" id="addBtn">+ Title</button></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="log"><span class="ico">🎬</span>Log</button>
  <button type="button" data-tab="titles"><span class="ico">🔎</span>Titles</button>
  <button type="button" data-tab="people"><span class="ico">👥</span>People</button>
  <button type="button" data-tab="connect"><span class="ico">🔗</span>Connect</button>
  <button type="button" data-tab="stats"><span class="ico">📊</span>Stats</button>
  <button type="button" data-tab="backup"><span class="ico">💾</span>Backup</button>
</div></nav>
<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);
}

/* ---- dialogs ---- */
if (!$('#dlg')) document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg"></dialog><dialog id="ask"></dialog>');
{
  const dlg = $('#dlg'); let down = false;
  dlg.addEventListener('pointerdown', e => { down = e.target === dlg; });
  dlg.addEventListener('click', e => { if (e.target === dlg && down) dlg.close(); });
}

function fieldHTML(f) {
  const id = 'f_' + f.name, v = f.value ?? '';
  if (f.type === 'checkbox')
    return `<div class="field check"><input type="checkbox" id="${id}" name="${f.name}"${f.value ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label></div>`;
  let ctl;
  if (f.type === 'select') {
    ctl = `<select id="${id}" name="${f.name}">${f.options.map(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    ctl = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
  } else {
    const t = f.type || 'text';
    const extra = t === 'number' ? ` inputmode="decimal" step="${f.step || 'any'}"` : '';
    ctl = `<input id="${id}" name="${f.name}" type="${t}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}"${extra}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''} autocomplete="${f.autocomplete || 'off'}" autocapitalize="${f.capitalize || (t === 'email' || t === 'password' ? 'none' : 'sentences')}">`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

/* ---- backup: optional AES-GCM passphrase encryption (Web Crypto, PBKDF2-SHA256) ---- */
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptPayload(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const iterations = 250000;
  const key = await deriveKey(pass, salt, iterations);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { encrypted: true, kdf: 'PBKDF2-SHA256', iterations, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('Wrong passphrase, or the file is damaged.'); }
}
function promptDecrypt(env) {
  return new Promise(resolve => {
    let result = null;
    formDialog({
      title: 'Encrypted backup', intro: 'Enter the passphrase you chose when you made this backup.',
      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },
      onClose: () => resolve(result)
    });
  });
}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');
    let data;
    if (env.encrypted) {
      if (!(window.crypto && crypto.subtle)) throw new Error('Encrypted backups need a secure (https) connection.');
      if (!(env.iterations >= 1000 && env.iterations <= 2000000) || typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.data !== 'string')
        throw new Error('The encrypted backup is damaged.');
      data = await promptDecrypt(env);
      if (data === null) return null;
    } else data = env.data;
    if (!data || typeof data !== 'object') throw new Error('The backup contains no data.');
    return { data, exportedAt: typeof env.exportedAt === 'string' ? env.exportedAt : null, schemaVersion: env.schemaVersion };
  }
};

/* share sheet when the platform supports sharing files (iPhone), otherwise a normal download */
async function deliverFile(filename, text, mime = 'application/json') {
  const file = new File([text], filename, { type: mime });

    try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; /* otherwise fall back to a download */ }

function backupNag(meta, hasData) {

/* ===================== Watch Log app ===================== */
const APP_ID = 'goobs-watchlog', DB_NAME = 'goobs-watchlog-db', SCHEMA = 1;

const ROLES = [['actor', 'Actor'], ['director', 'Director'], ['writer', 'Writer'], ['creator', 'Creator'], ['producer', 'Producer'], ['other', 'Other']];
const ROLE_KEYS = ROLES.map(r => r[0]);

const cleanName = s => str(s).normalize('NFC').replace(/\s+/g, ' ').trim();

/* ---- cast block parser ---- */
const HEADS = {
  'directed by': 'director', 'director': 'director', 'directors': 'director',
  'created by': 'creator', 'creator': 'creator', 'creators': 'creator',
  'written by': 'writer', 'writer': 'writer', 'writers': 'writer', 'screenplay by': 'writer', 'teleplay by': 'writer', 'story by': 'writer',
  'produced by': 'producer', 'producer': 'producer', 'producers': 'producer', 'executive producer': 'producer', 'executive producers': 'producer',
  'music by': 'other', 'cinematography by': 'other', 'edited by': 'other',
  'cast': 'actor', 'full cast': 'actor', 'cast & crew': 'actor', 'starring': 'actor', 'stars': 'actor', 'actors': 'actor'
};
const BY_HEAD = /^(directed by|created by|written by|produced by|screenplay by|teleplay by|story by|music by|cinematography by|edited by)\s+(.+)$/i;
const SUFFIX = /^(jr|sr|ii|iii|iv)\.?$/i;

  for (const p of parts) { if (SUFFIX.test(p) && out.length) out[out.length - 1] += ', ' + p; else out.push(p); }

}

  const mk = (n, c) => { n = cleanName(n); c = cleanName(c).replace(/^["'“‘]+|["'”’]+$/g, '').trim(); return n ? { name: n, character: c } : null; };
  let m;
  if ((m = line.match(/^(.+?)\s+as\s+(.+)$/i))) return mk(m[1], m[2]);
  if ((m = line.match(/^(.+?)\s*(?:\.{3,}|…|\t+)\s*(.+)$/))) return mk(m[1], m[2]);

function parseCastBlock(text, defaultRole = 'actor') {
  if (!ROLE_KEYS.includes(defaultRole)) defaultRole = 'actor';
  const credits = [], lines = str(text).replace(/\r/g, '').split('\n');
  let cur = defaultRole, has = false, skipped = 0;

    let line = raw.replace(/^\s*(?:\(?\d{1,3}[.)\]:]\s+|[•·*]\s*|[-–—]\s+)/, '').trim();
    if (!line) { if (has) { cur = defaultRole; has = false; } continue; }

    if ((m = line.match(/^([^:]{2,30}?)\s*:\s*(.*)$/)) && headRole(m[1])) { role = headRole(m[1]); rest = m[2].trim(); }

/* bucket n (1..10) holds ratings in (n-1, n]; unrated (0) excluded */

  const hist = Array(10).fill(0); let sum = 0, rated = 0, unrated = 0;
  for (const t of titles) {
    const r = t.rating;
    if (!(r > 0)) { unrated++; continue; }
    rated++; sum += r; hist[Math.min(10, Math.max(1, Math.ceil(r))) - 1]++;
  }
  return { rated, unrated, avg: rated ? Math.round(sum / rated * 100) / 100 : null, hist };
}
/* titles with a watched-on date, grouped by that date's year -> [{year,count}] ascending */
function yearStats(titles) {
  const m = {};
  for (const t of titles) if (isISO(t.watchedOn)) { const y = +t.watchedOn.slice(0, 4); m[y] = (m[y] || 0) + 1; }
  return Object.keys(m).map(Number).sort((a, b) => a - b).map(year => ({ year, count: m[year] }));
}

  const m = new Map(), shown = new Map();
  for (const t of titles) for (const g of parseGenres(t.genres)) { const k = g.toLowerCase(); m.set(k, (m.get(k) || 0) + 1); if (!shown.has(k)) shown.set(k, g); }
  return topBy(m, 10, k => k).map(r => ({ genre: shown.get(r.key), count: r.count }));
}
function statsOf(data) {
  const { titles, people, credits } = data;
  const tById = new Map(titles.map(t => [t.id, t])), pName = new Map(people.map(p => [p.id, p.name]));
  const byStatus = { want: 0, watching: 0, watched: 0, dropped: 0 };
  for (const t of titles) byStatus[t.status]++;
  const actorSet = new Set(), dirSet = new Set(), actorN = new Map(), dirN = new Map();
  for (const c of credits) {
    const t = tById.get(c.titleId); if (!t) continue;
    const k = c.personId + '|' + c.titleId;
    if (c.role === 'actor' && t.status === 'watched' && !actorSet.has(k)) { actorSet.add(k); actorN.set(c.personId, (actorN.get(c.personId) || 0) + 1); }
    if (c.role === 'director' && !dirSet.has(k)) { dirSet.add(k); dirN.set(c.personId, (dirN.get(c.personId) || 0) + 1); }
  }

    total: titles.length, byStatus, movies: titles.filter(t => t.kind === 'movie').length, series: titles.filter(t => t.kind === 'series').length,
    rating: ratingStats(titles), years: yearStats(titles), genres: genreCounts(titles),
    topActors: withName(topBy(actorN, 10, nm)), topDirectors: withName(topBy(dirN, 10, nm))
  };
}

/* ---- search / sort ---- */
function titleHay(t, byTitle, pById) {
  const parts = [t.name, t.genres, t.where, t.year ? String(t.year) : '', t.kind === 'series' ? 'series tv' : 'movie film'];
  for (const c of byTitle.get(t.id) || []) { const p = pById.get(c.personId); if (p) parts.push(p.name); if (c.character) parts.push(c.character); }
  return normName(parts.join(' | '));
}
/* data = {people, credits} is optional; with it, person names and characters are searchable too */
function searchTitles(query, filters, titles, data) {
  const f = Object.assign({ kind: 'all', status: 'all', rating: 'any' }, filters || {});
  const qt = tokens(query);
  const byTitle = new Map(), pById = new Map();
  if (data && qt.length) {
    for (const p of data.people || []) pById.set(p.id, p);
    for (const c of data.credits || []) { if (!byTitle.has(c.titleId)) byTitle.set(c.titleId, []); byTitle.get(c.titleId).push(c); }
  }
  return titles.filter(t => {
    if (f.kind !== 'all' && t.kind !== f.kind) return false;
    if (f.status !== 'all' && t.status !== f.status) return false;
    if (f.rating === 'unrated') { if (t.rating > 0) return false; }
    else if (f.rating !== 'any' && f.rating != null && !(t.rating >= Number(f.rating))) return false;
    if (qt.length) { const hay = titleHay(t, byTitle, pById); if (!qt.every(w => hay.includes(w))) return false; }
    return true;

}
const sortKeyName = s => normName(s).replace(/^(the|a|an) /, '');
const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

function titleComparator(key, dir = 'asc') {
  const sgn = dir === 'desc' ? -1 : 1;
  const val = { name: t => sortKeyName(t.name), year: t => t.year, rating: t => (t.rating > 0 ? t.rating : null), watched: t => t.watchedOn || null }[key] || (t => sortKeyName(t.name));
  return (a, b) => {
    const x = val(a), y = val(b);
    if (x == null && y != null) return 1;
    if (y == null && x != null) return -1;
    let c = x == null ? 0 : (typeof x === 'string' ? cmpStr(x, y) : x - y);
    c *= sgn;
    return c || cmpStr(sortKeyName(a.name), sortKeyName(b.name)) || cmpStr(a.id, b.id);
  };
}
const sortTitles = (list, key, dir) => [...list].sort(titleComparator(key, dir));
function recentTitles(titles, n = 5) {
  return titles.map((t, i) => [t, i]).sort((a, b) => cmpStr(b[0].createdAt, a[0].createdAt) || b[1] - a[1]).slice(0, n).map(x => x[0]);
}
function pickRandom(list, rnd = Math.random) { return list.length ? list[Math.min(list.length - 1, Math.floor(rnd() * list.length))] : null; }

/* ---- people lookups ---- */
/* "Who's that?": every token of the fragment must appear in the person's name, or in a character they played.
   -> [{personId,name,by:'name'|'character',credits:[credit]}] best match first */
function matchPeople(fragment, data) {
  const qt = tokens(fragment); if (!qt.length) return [];
  const byP = new Map();
  for (const c of data.credits) { if (!byP.has(c.personId)) byP.set(c.personId, []); byP.get(c.personId).push(c); }
  const out = [], q = qt.join(' ');
  for (const p of data.people) {
    const n = normName(p.name), cs = byP.get(p.id) || [];
    if (qt.every(w => n.includes(w))) {
      const rank = n === q ? 0 : n.startsWith(q) ? 1 : n.split(' ').some(w => w.startsWith(qt[0])) ? 2 : 3;
      out.push({ personId: p.id, name: p.name, by: 'name', credits: cs, rank });
    } else {
      const mc = cs.filter(c => c.character && qt.every(w => normName(c.character).includes(w)));
      if (mc.length) out.push({ personId: p.id, name: p.name, by: 'character', credits: mc, rank: 4 });
    }
  }
  return out.sort((a, b) => a.rank - b.rank || b.credits.length - a.credits.length || cmpStr(normName(a.name), normName(b.name)) || cmpStr(a.personId, b.personId));
}
/* "Seen them in": everyone in a title, with the other titles they appear in */
function seenIn(titleId, data) {
  const pById = new Map(data.people.map(p => [p.id, p])), tById = new Map(data.titles.map(t => [t.id, t]));
  const mine = data.credits.filter(c => c.titleId === titleId).sort((a, b) => a.order - b.order);
  const seen = new Set(), out = [];
  for (const c of mine) {
    if (seen.has(c.personId)) continue; seen.add(c.personId);
    const p = pById.get(c.personId); if (!p) continue;
    const roles = mine.filter(x => x.personId === c.personId);
    const others = [...new Set(data.credits.filter(x => x.personId === c.personId && x.titleId !== titleId).map(x => x.titleId))]
      .map(id => tById.get(id)).filter(Boolean).sort(titleComparator('name'));
    out.push({ personId: p.id, name: p.name, credits: roles, others });
  }

}
function personSummary(personId, data) {

  const byT = new Map();
  for (const c of mine) { if (!byT.has(c.titleId)) byT.set(c.titleId, []); byT.get(c.titleId).push(c); }
  const rows = [...byT].map(([id, cs]) => ({ title: tById.get(id), credits: cs })).filter(r => r.title)
    .sort((a, b) => (b.title.year || 0) - (a.title.year || 0) || cmpStr(sortKeyName(a.title.name), sortKeyName(b.title.name)));
  const ids = new Set(rows.map(r => r.title.id)), co = new Map();

const titleLabel = t => t.name + (t.year ? ` (${t.year})` : '') + (t.kind === 'series' ? ' – series' : '');
/* typed text -> {id} | {error}. Exact label, exact name, then a unique substring. */
function resolveTitleRef(text, titles) {
  const q = normName(text); if (!q) return { empty: true, error: '' };
  let hits = titles.filter(t => normName(titleLabel(t)) === q);
  if (!hits.length) hits = titles.filter(t => normName(t.name) === q);
  if (!hits.length) hits = titles.filter(t => normName(titleLabel(t)).includes(q));
  if (hits.length === 1) return { id: hits[0].id };
  if (!hits.length) return { error: 'No title in your log matches “' + cleanName(text) + '”.' };
  return { error: hits.length + ' titles match; type a bit more or pick from the list.' };
}
function resolvePersonRef(text, people) {
  const q = normName(text); if (!q) return { empty: true, error: '' };
  let hits = people.filter(p => normName(p.name) === q);
  if (!hits.length) { const qt = tokens(text); hits = people.filter(p => { const n = normName(p.name); return qt.every(w => n.includes(w)); }); }
  if (hits.length === 1) return { id: hits[0].id };
  if (!hits.length) return { error: 'Nobody named “' + cleanName(text) + '” yet.' };

}

/* ---- deletes (pure: return new lists) ---- */
function deleteTitleFrom(data, titleId) {
  const credits = data.credits.filter(c => c.titleId !== titleId);
  const still = new Set(credits.map(c => c.personId));
  const gone = data.credits.filter(c => c.titleId === titleId).map(c => c.personId);
  const goneSet = new Set(gone.filter(id => !still.has(id)));
  const people = data.people.filter(p => !(goneSet.has(p.id) && !cleanName(p.notes)));
  return { titles: data.titles.filter(t => t.id !== titleId), people, credits, removedPeople: data.people.length - people.length, removedCredits: data.credits.length - credits.length };
}
function deletePersonFrom(data, personId) {
  const credits = data.credits.filter(c => c.personId !== personId);
  return { titles: data.titles, people: data.people.filter(p => p.id !== personId), credits, removedCredits: data.credits.length - credits.length };

/* ---- CSV ---- */
function titlesCsv(data) {

  for (const c of data.credits) { if (!by.has(c.titleId)) by.set(c.titleId, []); by.get(c.titleId).push(c); }
  const head = ['Title', 'Type', 'Year', 'Status', 'Rating', 'Watched on', 'Rewatches', 'Where', 'Genres', 'Directors', 'Creators', 'Cast', 'Notes'];
  const rows = [head];
  for (const t of sortTitles(data.titles, 'name', 'asc')) {
    const cs = (by.get(t.id) || []).slice().sort((a, b) => a.order - b.order);
    const names = role => cs.filter(c => c.role === role).map(c => pName.get(c.personId) || '').filter(Boolean).join('; ');
    const cast = cs.filter(c => c.role === 'actor').map(c => (pName.get(c.personId) || '') + (c.character ? ' as ' + c.character : '')).join('; ');
    rows.push([t.name, t.kind === 'series' ? 'Series' : 'Movie', t.year ?? '', STATUS_LABEL[t.status], t.rating > 0 ? fmtR(t.rating) : '', t.watchedOn, t.rewatchCount, t.where, parseGenres(t.genres).join('; '), names('director'), names('creator'), cast, t.notes.replace(/\s*\n\s*/g, ' ')]);

/* ===================== ONLINE LOOKUP (TMDB / TVMaze) =====================
   The only network code in the app. Nothing but the search text or a title id is ever sent, and only to the two hosts below. */
const ALLOWED_HOSTS = ['api.themoviedb.org', 'api.tvmaze.com'];
let NET_TIMEOUT = 10000;
const CREW_CAP = 6; /* directors / creators / writers taken per title */
const WRITER_JOBS = ['writer', 'screenplay', 'story', 'novel', 'teleplay'];
const arr = x => (Array.isArray(x) ? x : []);
const obj = x => (x && typeof x === 'object' ? x : {});
const yearOf = d => { const m = str(d).match(/^(\d{4})/); return m ? +m[1] : null; };
const stripHtml = s => cleanName(str(s).replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"').replace(/&#39;|&#x27;|&rsquo;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&'));
const trimText = (s, n = 140) => (s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s);
const extIdOk = s => /^(tmdb:(movie|tv):\d{1,9}|tvmaze:\d{1,9})$/.test(str(s));
const isTmdbToken = k => /^eyJ/.test(str(k).trim());
/* v3 key -> ?api_key=..., v4 read-access token (starts with eyJ) -> Authorization: Bearer */
function tmdbRequest(path, params, key) {
  key = str(key).trim();
  const q = Object.entries(params || {}).map(([k, v]) => k + '=' + encodeURIComponent(v).replace(/%2C/g, ','));
  const headers = {};
  if (isTmdbToken(key)) headers.Authorization = 'Bearer ' + key; else q.push('api_key=' + encodeURIComponent(key));
  return { url: 'https://api.themoviedb.org/3' + path + (q.length ? '?' + q.join('&') : ''), headers };
}
function parseTmdbSearch(j) {
  const out = [];
  for (const r0 of arr(obj(j).results)) {
    const r = obj(r0);
    if (r.media_type !== 'movie' && r.media_type !== 'tv') continue;
    const id = intIn(r.id, 1, 999999999), name = cleanName(r.title || r.name);
    if (id == null || !name) continue;
    out.push({ source: 'tmdb', kind: r.media_type === 'tv' ? 'series' : 'movie', extId: `tmdb:${r.media_type}:${id}`, name, year: yearOf(r.release_date || r.first_air_date), overview: trimText(cleanName(r.overview)) });
  }
  return out.slice(0, 15);
}
function parseTvmazeSearch(j) {
  const out = [];
  for (const r0 of arr(j)) {
    const sh = obj(obj(r0).show), id = intIn(sh.id, 1, 999999999), name = cleanName(sh.name);
    if (id == null || !name) continue;
    out.push({ source: 'tvmaze', kind: 'series', extId: 'tvmaze:' + id, name, year: yearOf(sh.premiered), overview: trimText(stripHtml(sh.summary)) });
  }
  return out.slice(0, 15);
}
function dedupeCrew(list) {
  const seen = new Set(), out = [];
  for (const c of list) { const k = c.role + '|' + normName(c.name); if (!normName(c.name) || seen.has(k)) continue; seen.add(k); out.push(c); }
  return out;
}
/* TMDB videos -> the best YouTube trailer key ('' if none): official trailers first, then any trailer, then teasers; English preferred */
const YT_KEY = /^[\w-]{6,20}$/;
function pickTrailer(v) {
  const score = x => (x.type === 'Trailer' ? 0 : 10) + (x.official === true ? 0 : 2) + (!x.iso_639_1 || x.iso_639_1 === 'en' ? 0 : 1);
  const list = arr(obj(v).results).map(obj).filter(x => x.site === 'YouTube' && YT_KEY.test(str(x.key)) && (x.type === 'Trailer' || x.type === 'Teaser'));
  list.sort((a, b) => score(a) - score(b));

/* -> {source, externalId, kind, name, year, genres[], overview, synopsis, trailer, cast:[{name,character,pid}], crew:[{name,role}]} or null */
function parseTmdbDetails(j, media) {
  j = obj(j);
  const id = intIn(j.id, 1, 999999999), name = cleanName(j.title || j.name);
  if (id == null || !name) return null;
  const tv = media === 'tv', credits = obj(j.credits), aggCast = arr(obj(j.aggregate_credits).cast);
  let cast;

function parseTvmazeDetails(j) {

/* crew first (directors, creators, writers; CREW_CAP each), then the top N cast (10 | 25 | 'all') -> parsed credits for planBulk */
function selectCredits(d, count) {
  const out = [];
  for (const role of ['director', 'creator', 'writer']) for (const c of d.crew.filter(x => x.role === role).slice(0, CREW_CAP)) out.push({ name: c.name, role, character: '' });
  const n = count === 'all' ? Infinity : (Number(count) > 0 ? Number(count) : 25);
  for (const c of d.cast.slice(0, n)) out.push({ name: c.name, role: 'actor', character: c.character.slice(0, 120) });

async function netGet(url, headers) {

  if (u.protocol !== 'https:' || !ALLOWED_HOSTS.includes(u.hostname)) throw new Error('Blocked: only TMDB and TVMaze may be contacted.');
  const tmdb = u.hostname === 'api.themoviedb.org', ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), NET_TIMEOUT);
  const timeoutMsg = 'Timed out after 10 seconds. Try again.';
  try {
    let res;
    try { res = await fetch(url, { method: 'GET', headers: headers || {}, signal: ctl.signal, credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store' }); }
    catch (e) { throw new Error(ctl.signal.aborted ? timeoutMsg : 'Couldn’t reach the service. You may be offline, or something is blocking the request.'); }
    if (res.status === 401 || (tmdb && res.status === 403)) throw new Error('TMDB rejected the key (' + res.status + '). Check it in Backup → Online lookup.');
    if (res.status === 429) throw new Error('Too many requests (429). Wait a minute and try again.');
    if (res.status === 404) throw new Error('Not found (404).');
    if (!res.ok) throw new Error('The service had a problem (HTTP ' + res.status + '). Try again later.');
    try { return await res.json(); }
    catch (e) { throw new Error(ctl.signal.aborted ? timeoutMsg : 'The service sent something unreadable. Try again.'); }
  } finally { clearTimeout(timer); }
}
async function searchOnline(q) {

  const key = state.settings.tmdbKey;
  if (key) { const r = tmdbRequest('/search/multi', { query: q }, key); return parseTmdbSearch(await netGet(r.url, r.headers)); }
  return parseTvmazeSearch(await netGet('https://api.tvmaze.com/search/shows?q=' + encodeURIComponent(q)));
}

    const r = tmdbRequest(`/${m[1]}/${m[2]}`, { append_to_response: m[1] === 'tv' ? 'aggregate_credits,credits,videos,external_ids' : 'credits,videos' }, key);

  const sub = [t.kind === 'series' ? 'Series' : 'Movie', parseGenres(t.genres).slice(0, 3).join(', '), t.where].filter(Boolean).join(' · ');
  return `<div class="row" data-action="open-title" data-id="${esc(t.id)}" role="button" tabindex="0"><div class="row-main"><div class="row-title">${tName(t)}</div><div class="row-sub">${esc(extra || sub)}</div></div>${ratingTag(t.rating)}${statusBadge(t.status)}</div>`;
}
function titlesResultHTML() {
  const f = ui.tf, db_ = refTitlesHTML(f.q);
  const res = sortTitles(searchTitles(f.q, f, state.titles, state), f.sort, f.dir);
  if (!state.titles.length) return (db_ || emptyHTML('🎬', 'No titles yet', 'Add your first movie or series.', addTitleBtn()));
  if (!res.length) return (db_ ? `<p class="fine" style="margin:12px 4px 6px">Nothing in your log matches.</p>` : `<div class="empty"><h2>No matches</h2><p>Try fewer words or clear the filters.</p></div>`) + db_;
  return `<p class="fine" style="margin:12px 4px 6px">${plural(res.length, 'title')}</p><div class="card">${res.map(t => titleRowHTML(t)).join('')}</div>` + db_;
}
/* the "In the movie database" part of a search: titles not already in your log */
function refLoadingHTML() {
  const st = refStatus();
  if (st === 'none' || st === 'ready') return '';
  return `<p class="fine" style="margin:14px 4px 6px">${st === 'error' ? 'Movie database: ' + esc(refErr) : 'Loading the movie database…'}</p>`;
}
function refTitlesHTML(q) {
  if (!tokens(q).length) return '';
  if (!ref) return refLoadingHTML();
  const L = logRef(), hits = refSearchTitles(q, 60).filter(i => !L.byRef.has(i)).slice(0, 15);
  if (!hits.length) return '';
  return `<div class="sec-h"><span>In the movie database</span></div><div class="card">${hits.map(ti => refTitleRowHTML(ti, [REF_KIND[ref.t.k[ti]], refGenres(ti).slice(0, 3).join(', '), refRating(ti) ? '★ ' + refRating(ti) : '', refMain(ti).slice(0, 2).map(c => ref.p.n[c.pi]).join(', ')].filter(Boolean).join(' · '))).join('')}</div>`;
}
function refTitleRowHTML(ti, sub) {
  const t = logRef().byRef.get(ti);
  const head = `<div class="row-main"><div class="row-title">${esc(refName(ti))} <span class="muted">(${esc(refYears(ti))})</span></div><div class="row-sub">${esc(sub)}</div></div>`;
  return t ? `<div class="row" data-action="open-title" data-id="${esc(t.id)}" role="button" tabindex="0">${head}${statusBadge(t.status)}</div>`
    : `<div class="row" data-action="open-rt" data-i="${ref.t.id[ti]}" role="button" tabindex="0">${head}</div>`;
}
function refPersonRowHTML(pi, sub) {
  const lp = logPersonOfRef(pi);
  return `<div class="row" ${lp ? `data-action="open-person" data-id="${esc(lp.id)}"` : `data-action="open-rp" data-i="${ref.p.id[pi]}"`} role="button" tabindex="0"><div class="row-main"><div class="row-title">${esc(ref.p.n[pi])}</div>${sub ? `<div class="row-sub">${esc(sub)}</div>` : ''}</div></div>`;
}
function refPeopleHTML(q, skip = new Set()) {
  if (!tokens(q).length) return '';
  if (!ref) return refLoadingHTML();
  const hits = refSearchPeople(q, 40).filter(pi => !skip.has(pi)).slice(0, 15);
  if (!hits.length) return '';
  return `<div class="sec-h"><span>In the movie database</span></div><div class="card">${hits.map(pi => refPersonRowHTML(pi, refKnownFor(pi).join(', '))).join('')}</div>`;
}
function renderTitles() {
  const f = ui.tf, chip = (grp, v, l, cur) => `<button type="button" class="chip" data-action="tf" data-g="${grp}" data-v="${v}" aria-pressed="${cur === v}">${l}</button>`;
  const opt = (v, l, cur) => `<option value="${v}"${String(cur) === String(v) ? ' selected' : ''}>${l}</option>`;
  return `<div class="ctrl">
    <input id="q" type="search" placeholder="${refInfo ? 'Search your log and the movie database' : 'Search title, person, character, genre'}" value="${esc(f.q)}" autocomplete="off" aria-label="Search titles">
    <div class="chips">${chip('kind', 'all', 'All', f.kind)}${chip('kind', 'movie', 'Movies', f.kind)}${chip('kind', 'series', 'Series', f.kind)}</div>
    <div class="chips">${chip('status', 'all', 'Any status', f.status)}${STATUSES.map(([k, l]) => chip('status', k, l, f.status)).join('')}</div>
    <div class="two">
      <select id="tfRating" aria-label="Rating filter">${opt('any', 'Any rating', f.rating)}${opt('unrated', 'Unrated', f.rating)}${[6, 7, 8, 9].map(n => opt(n, n + '+', f.rating)).join('')}</select>
      <select id="tfSort" aria-label="Sort by">${opt('name', 'Sort: Name', f.sort)}${opt('year', 'Sort: Year', f.sort)}${opt('rating', 'Sort: Rating', f.sort)}${opt('watched', 'Sort: Date watched', f.sort)}</select>
      <button type="button" class="btn" data-action="dir" aria-label="Toggle sort direction">${f.dir === 'asc' ? '↑' : '↓'}</button>
    </div></div><div id="tres">${titlesResultHTML()}</div>`;
}

/* ---- Title detail ---- */
function renderTitle() {
  const t = titleById(ui.titleId), cs = creditsOfTitle(t.id);
  autoMeta(t);
  const facts = [];
  const fact = (l, v) => { if (v) facts.push(`<dt>${l}</dt><dd>${v}</dd>`); };
  fact('Watched on', fmtWhen(t.watchedOn)); fact('Rewatched', t.rewatchCount ? plural(t.rewatchCount, 'time') : '');
  fact('Where', esc(t.where)); fact('Progress', esc(seriesProg(t)));
  const gen = parseGenres(t.genres);
  const personRow = c => { const p = personById(c.personId); if (!p) return ''; return `<div class="row" data-action="open-person" data-id="${esc(p.id)}" role="button" tabindex="0"><div class="row-main"><div class="cname">${esc(p.name)}</div>${c.character || c.role !== 'actor' ? `<div class="cchar">${esc(c.role === 'actor' ? 'as ' + c.character : c.character ? ROLE_LABEL[c.role] + ' · ' + c.character : ROLE_LABEL[c.role])}</div>` : ''}</div><button type="button" class="btn small ghost" data-action="edit-credit" data-id="${esc(c.id)}" aria-label="Edit credit for ${esc(p.name)}">Edit</button></div>`; };
  const crewGroups = [['director', 'Directed by'], ['creator', 'Created by'], ['writer', 'Written by'], ['producer', 'Produced by'], ['other', 'Other crew']];
  let crew = '';
  for (const [r, l] of crewGroups) { const g = cs.filter(c => c.role === r); if (g.length) crew += `<div class="sub-h">${l}</div>` + g.map(personRow).join(''); }
  const cast = cs.filter(c => c.role === 'actor');
  const cc = cs.length
    ? `${crew}${cast.length ? `<div class="sub-h">Cast</div>${cast.map(personRow).join('')}` : ''}`
    : `<p class="muted">No cast or crew yet. Add one person, or paste a whole list.</p>`;
  return `<div class="stack">
    <section class="card pad">
      <div class="muted" style="font-size:14px">${t.kind === 'series' ? 'TV series' : 'Movie'}${t.year ? ' · ' + t.year : ''}</div>
      <h2 style="margin:2px 0 10px">${esc(t.name)}</h2>
      ${t.synopsis ? `<p class="synopsis" id="synopsis">${esc(t.synopsis)}</p>` : (() => { const ti = ref ? logRef().byTitle.get(t.id) : null, d = ti != null ? refDesc(ti) || '' : ''; return d ? `<p class="synopsis" id="synopsis">${esc(d)}</p><p class="fine" style="margin:-8px 0 12px">Description: ${esc(refDescSrc(ti))}</p>` : ''; })()}
      <div class="btnrow" style="margin:0 0 12px">${t.trailer ? `<a class="btn" id="trailer" href="${esc(ytWatch(t.trailer))}" target="_blank" rel="noopener noreferrer">▶ Watch trailer</a>` : `<a class="btn ghost" id="trailerSearch" href="${esc(ytSearch(t))}" target="_blank" rel="noopener noreferrer">▶ Find trailer on YouTube</a>`}</div>
      <div class="chips" role="group" aria-label="Status">${STATUSES.map(([k, l]) => `<button type="button" class="chip" data-action="set-status" data-s="${k}" aria-pressed="${t.status === k}">${l}</button>`).join('')}</div>
      <div class="btnrow"><button type="button" class="btn" data-action="rate" data-id="${esc(t.id)}">${t.rating > 0 ? '★ ' + fmtR(t.rating) + ' / 10 · Change' : '★ Rate it'}</button>${t.kind === 'series' ? `<button type="button" class="btn" data-action="q-ep" data-id="${esc(t.id)}">+ Episode</button>` : ''}<button type="button" class="btn" data-action="q-again" data-id="${esc(t.id)}">↻ Watched again</button></div>
      ${facts.length ? `<dl class="facts">${facts.join('')}</dl>` : ''}
      ${gen.length ? `<div class="pill-row">${gen.map(g => `<span class="pill">${esc(g)}</span>`).join('')}</div>` : ''}
      ${t.notes ? `<div class="note" style="white-space:pre-wrap">${esc(t.notes)}</div>` : ''}
      <div class="btnrow"><button type="button" class="btn" data-action="edit-title" data-id="${esc(t.id)}">Edit details</button><button type="button" class="btn danger" data-action="del-title" data-id="${esc(t.id)}">Delete</button></div>
    </section>
    <section class="card pad"><h3>Cast &amp; crew <span class="muted" style="font-weight:500">(${cs.length})</span></h3>
      <div class="btnrow" style="margin-bottom:6px"><button type="button" class="btn primary" data-action="add-person">+ Add person</button><button type="button" class="btn" data-action="bulk">Paste a list</button></div><button type="button" class="btn block" data-action="fetch-cast" data-id="${esc(t.id)}">🔎 Fetch cast online</button>${cc}</section>
    ${refTitleCardHTML(t)}
    ${knownCastHTML(t)}
  </div>`;
}
/* on a title in your log: its database entry, and its cast from there when you haven't entered any */
function refTitleCardHTML(t) {
  if (!ref) return refStatus() === 'loading' ? '<p class="fine" style="margin:0 4px">Loading the movie database…</p>' : '';
  const ti = logRef().byTitle.get(t.id); if (ti == null) return '';
  const actors = refMain(ti), has = creditsOfTitle(t.id).some(c => c.role === 'actor');
  const facts = [REF_KIND[ref.t.k[ti]], refYears(ti), refRating(ti) ? `★ ${refRating(ti)} on IMDb (${nfmt(ref.t.v[ti])} votes)` : ''].filter(Boolean).join(' · ');
  return `<section class="card pad" id="refTitle"><h3>Movie database</h3><p class="fine" style="margin-top:0">${esc(facts)}</p>
    ${has ? '' : `<p>${plural(actors.length, 'main cast member')}: ${esc(actors.slice(0, 4).map(c => ref.p.n[c.pi]).join(', '))}${actors.length > 4 ? '…' : ''}</p>`}
    <div class="btnrow">${has ? '' : `<button type="button" class="btn primary" data-action="rt-cast" data-id="${esc(t.id)}">Add this cast to the title</button>`}<button type="button" class="btn" data-action="who" data-id="${esc(t.id)}">👥 Who’s in this?</button></div></section>`;
}

/* the "where do I know them from?" card on a title: each cast member and the other titles in your log they're in */
function knownCastHTML(t) {
  const actors = creditsOfTitle(t.id).filter(c => c.role === 'actor');
  if (!actors.length) return '';
  autoFilmoForTitle(t.id);
  const seen = new Set(), rows = []; let linked = 0, none = 0;
  for (const c of actors) {
    if (seen.has(c.personId)) continue; seen.add(c.personId);
    const p = personById(c.personId); if (!p) continue;
    if (p.tmdbId || p.tvmazeId || refPersonOf(p) >= 0) linked++;
    const kf = knownFrom(p.id, t.id);
    if (!kf.length) { none++; continue; }
    rows.push(`<div class="row" data-action="open-person" data-id="${esc(p.id)}" role="button" tabindex="0"><div class="row-main"><div class="row-title">${esc(p.name)}${c.character ? ` <span class="muted" style="font-weight:500">as ${esc(c.character)}</span>` : ''}</div>${kf.slice(0, 3).map(r => `<div class="row-sub">${esc(r.title.name)}${r.title.year ? ' (' + r.title.year + ')' : ''}${r.chars.length ? ' – ' + esc(r.chars.join(', ')) : ''} ${statusBadge(r.title.status)}</div>`).join('')}${kf.length > 3 ? `<div class="row-sub">+ ${kf.length - 3} more</div>` : ''}</div></div>`);
  }
  const hint = linked ? '' : ref ? '<p class="muted">Nobody here is in the movie database or linked online yet. Use “Fetch cast online” above; their other work is then looked up automatically.</p>' : '<p class="muted">These people aren’t linked online yet. Use “Fetch cast online” above; their other work is then looked up automatically.</p>';
  const empty = rows.length ? '' : linked && !fj.running ? '<p class="muted pad" style="padding-top:0">Nobody here is in anything else in your log yet.</p>' : '';
  return `<section class="card" id="knownFrom"><div class="pad" style="padding-bottom:4px"><h3>Where do I know them from?</h3><p class="fine" id="filmoStatus" role="status">${esc(filmoStatusText())}</p>${hint}</div>${rows.join('')}${empty}
    ${rows.length && none ? `<p class="fine pad" style="padding-top:6px;padding-bottom:0">${plural(none, 'other cast member')} ${none === 1 ? 'isn’t' : 'aren’t'} in anything else you’ve logged.</p>` : ''}
    ${actors.some(c => { const p = personById(c.personId); return p && (p.tmdbId || p.tvmazeId); }) ? `<div class="pad" style="padding-top:8px"><button type="button" class="btn small ghost" data-action="filmo-refresh" data-id="${esc(t.id)}"${fj.running ? ' disabled' : ''}>Refresh from online</button></div>` : ''}</section>`;
}
/* the full filmography card on a person */
function filmoCardHTML(p, also = false) {
  if (!(p.tmdbId || p.tvmazeId)) return also ? '' : `<section class="card pad" id="filmo"><h3>Everything they’ve been in</h3><p class="muted">Not linked online yet. People are linked when their title is added from an online match or with Fetch cast online.</p></section>`;
  autoFilmoForPerson(p);
  const f = filmoOf(p);
  if (!f) return `<section class="card pad" id="filmo"><h3>Everything they’ve been in</h3><p class="fine" id="filmoStatus" role="status">${esc(filmoStatusText() || (navigator.onLine === false ? 'Offline: this loads when you’re online.' : 'Loading…'))}</p></section>`;
  const mx = matchIx(), tvm = f === filmo['tvmaze:' + p.tvmazeId];
  const rows = f.items.map(it => {
    const t = matchFilmoItem(it, mx), yr = it.y || it.ay;
    const sub = [it.k === 'series' ? 'TV' : 'Movie', it.c ? 'as ' + it.c : '', it.e ? plural(it.e, 'episode') : ''].filter(Boolean).join(' · ');
    const head = `<div class="row-main"><div class="row-title">${esc(it.n)}${yr ? ` <span class="muted" style="font-weight:500">(${yr})</span>` : ''}</div><div class="row-sub">${esc(sub)}</div></div>`;
    return t ? `<div class="row" data-action="open-title" data-id="${esc(t.id)}" role="button" tabindex="0">${head}${statusBadge(t.status)}</div>`
      : `<div class="row" data-action="filmo-add" data-x="${esc(it.x)}" role="button" tabindex="0" aria-label="Add ${esc(it.n)} to your log">${head}<span class="badge acc">+ Add</span></div>`;
  }).join('');
  return `<details class="card eg" id="filmo"${f.items.length <= 30 && !also ? ' open' : ''}><summary>${also ? 'Online filmography, with guest roles' : 'Everything they’ve been in'} <span class="fine">· ${f.items.length}</span></summary>${rows || '<p class="muted pad">Nothing listed online.</p>'}
    <div class="pad"><p class="fine" id="filmoStatus" role="status">${esc(filmoStatusText())}</p><p class="fine">From ${tvm ? 'TVMaze (TV only; add a TMDB key in Backup for movies)' : 'TMDB'}, updated ${esc(fmtWhen(f.at.slice(0, 10)) || f.at.slice(0, 10))}. Tap one you haven’t logged to add it. Talk shows and appearances as themselves are left out.</p>
    <button type="button" class="btn small ghost" data-action="filmo-person" data-id="${esc(p.id)}"${fj.running ? ' disabled' : ''}>Refresh from online</button></div></details>`;
}

/* ---- Person detail + People list ---- */
function renderPerson() {
  const p = personById(ui.personId), sm = personSummary(p.id, state), kf = knownFrom(p.id);
  const rows = kf.map(r => `<div class="row" data-action="open-title" data-id="${esc(r.title.id)}" role="button" tabindex="0"><div class="row-main"><div class="row-title">${tName(r.title)}</div><div class="row-sub">${esc((r.roles.length ? r.roles : r.chars.map(c => 'as ' + c)).join(' · '))}${r.fromFilmo ? '<span class="badge">from their filmography</span>' : ''}</div></div>${ratingTag(r.title.rating)}${statusBadge(r.title.status)}</div>`).join('');
  const kw = kf.filter(r => r.title.status === 'watched'), kr = kw.filter(r => r.title.rating > 0);
  sm.titles = kf.length; sm.watched = kw.length; sm.avgRating = kr.length ? Math.round(kr.reduce((a, r) => a + r.title.rating, 0) / kr.length * 100) / 100 : null;
  const co = sm.coStars.map(c => `<div class="row" data-action="open-person" data-id="${esc(c.personId)}" role="button" tabindex="0"><div class="row-main"><div class="row-title">${esc(c.name)}</div></div><span class="muted">${plural(c.count, 'title')}</span></div>`).join('');
  return `<div class="stack">
    ${personHeadHTML(p)}
    <section class="card pad"><div class="tilesb" style="margin-top:0"><div class="card tile"><div class="lbl">Titles</div><div class="val">${sm.titles}</div></div><div class="card tile"><div class="lbl">Watched</div><div class="val">${sm.watched}</div></div><div class="card tile"><div class="lbl">Avg rating</div><div class="val">${sm.avgRating == null ? '–' : fmtR(sm.avgRating)}</div></div></div>
      ${p.notes ? `<div class="note" style="white-space:pre-wrap">${esc(p.notes)}</div>` : ''}
      <div class="btnrow"><button type="button" class="btn" data-action="edit-person" data-id="${esc(p.id)}">Edit</button><button type="button" class="btn danger" data-action="del-person" data-id="${esc(p.id)}">Delete</button></div></section>
    <section class="card"><div class="pad" style="padding-bottom:4px"><h3>In your log</h3></div>${rows || '<p class="muted pad">Not in any title yet.</p>'}</section>
    ${co ? `<section class="card"><div class="pad" style="padding-bottom:4px"><h3>Also worked with</h3></div>${co}</section>` : ''}
    ${refPersonCardHTML(p)}
    ${filmoCardHTML(p, refPersonOf(p) >= 0)}
  </div>`;
}
/* top of a person page in your log: photo (when looked up) and age, when the movie database knows them */
function personHeadHTML(p) {
  const nm = logPersonNm(p), pi = ref ? refPersonOf(p) : -1, life = pi >= 0 ? refLife(pi) : '';
  if (!nm && !life) return '';
  return `<section class="card pad"><div class="phead">${nm ? photoImg(nm, true) : ''}<div style="flex:1;min-width:0">${life ? `<div class="muted" style="font-size:14px">${esc(life)}</div>` : ''}${nm && !photos.has(nm) ? `<button type="button" class="btn small" style="margin-top:6px" data-action="photo" data-nm="${esc(nm)}">📷 Photo</button>` : nm && !photos.get(nm) ? '<p class="fine">No photo on TMDB.</p>' : ''}</div></div></section>`;
}
/* rows of a database person's credits: logged titles open in your log, the rest open their database page */
function refFilmoRowsHTML(pi) {
  const L = logRef();
  return refCredits(pi).map(c => {
    const t = L.byRef.get(c.ti), sub = [REF_KIND[ref.t.k[c.ti]], c.dir ? 'Director' : c.ch ? 'as ' + c.ch : '', epsText(c.e)].filter(Boolean).join(' · ');
    const head = `<div class="row-main"><div class="row-title">${esc(refName(c.ti))} <span class="muted" style="font-weight:500">(${esc(refYears(c.ti))})</span></div><div class="row-sub">${esc(sub)}</div></div>`;
    return t ? `<div class="row" data-action="open-title" data-id="${esc(t.id)}" role="button" tabindex="0">${head}${statusBadge(t.status)}</div>`
      : `<div class="row" data-action="open-rt" data-i="${ref.t.id[c.ti]}" role="button" tabindex="0">${head}</div>`;
  }).join('');
}
const refFootHTML = () => `<p class="fine">From the offline movie database (IMDb data${ref.built ? ', ' + esc(fmtDate(ref.built, false)) : ''}): each title’s main cast and directors, plus everyone credited in a series’ episodes. Small movie roles may be missing.</p>`;
function refPersonCardHTML(p) {
  if (!ref) return refStatus() === 'loading' ? '<p class="fine" style="margin:0 4px">Loading the movie database…</p>' : '';
  const pi = refPersonOf(p); if (pi < 0) return '';
  const n = ref.pStart[pi + 1] - ref.pStart[pi];
  return `<details class="card eg" id="refFilmo"${n <= 30 ? ' open' : ''}><summary>Everything they’ve been in <span class="fine">· ${n}</span></summary>${refFilmoRowsHTML(pi)}
 <div class="pad">${refFootHTML()}<a class="btn small ghost" href="https://www.imdb.com/name/${nmId(ref.p.id[pi])}/" target="_blank" rel="noopener noreferrer">IMDb page ↗</a></div></details>`;
}

/* ---- photos: looked up on TMDB only when you tap a 📷 button; kept for this session only ---- */
const photos = new Map();   /* IMDb person id -> image URL, or '' when TMDB has none */
const PHOTO_PATH = /^\/[\w-]{5,80}\.(jpg|jpeg|png)$/i;
const photoImg = (nm, big) => { const u = photos.get(nm); return u ? `<img class="hs${big ? ' big' : ''}" src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''; };
async function fetchPhoto(nm) {
  if (photos.has(nm)) return photos.get(nm);
  const r = tmdbRequest(`/find/${nm}`, { external_source: 'imdb_id' }, state.settings.tmdbKey);
  const path = str(obj(arr(obj(await netGet(r.url, r.headers)).person_results)[0]).profile_path);
  const u = PHOTO_PATH.test(path) ? 'https://image.tmdb.org/t/p/w185' + path : '';
  photos.set(nm, u); return u;
}
const photoBusy = { on: false };
/* the 📷 buttons: look up these people's photos now (and only now) */
async function lookUpPhotos(ids) {
  if (photoBusy.on) return;
  if (!state.settings.tmdbKey) return msgBox('Photos need a TMDB key', 'Photos come from TMDB. Add your free TMDB key in Backup → Online lookup, then tap 📷 again.');
  const off = offlineMsg(); if (off) return msgBox('Offline', 'Photos need a connection. Everything else works offline.');
  const todo = [...new Set(ids)].filter(nm => IMDB_NM.test(nm) && !photos.has(nm)).slice(0, 25);
  if (!todo.length) return toast(ids.length ? 'Already looked up' : 'Nobody to look up');
  photoBusy.on = true; toast(`Looking up ${plural(todo.length, 'photo')}…`);
  let found = 0, err = '';
  try { for (const nm of todo) { try { if (await fetchPhoto(nm)) found++; } catch (e) { err = e.message; break; } await wait(40); } }
  finally { photoBusy.on = false; }
  if (ui.refT != null) paintCast(); else render();
  toast(err ? 'Stopped: ' + err : found ? `${plural(found, 'photo')} found` : 'No photos on TMDB for them');
}
const personNm = pi => nmId(ref.p.id[pi]);
/* ---- descriptions: IMDb's free data has none, so 📝 looks one up online (TMDB, or TVMaze for shows without a key) ---- */
const descs = new Map();    /* IMDb title id -> description, or '' when none was found (this session) */
async function fetchDesc(tt, series) {
