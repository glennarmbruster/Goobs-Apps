    <form id="onForm" novalidate><div class="field"><label for="onQ">Title</label><input id="onQ" type="search" value="${esc(onl.q)}" autocomplete="off" autocapitalize="words"${off ? ' disabled' : ''}></div>
    <button type="submit" class="btn primary block" style="margin-top:10px" id="onGo"${off ? ' disabled' : ''}>Search</button></form>
    <div id="onRes">${onl.results.length ? onlineRowsHTML() : ''}</div>
    <div id="onUnm">${unmatchedHTML()}</div>
    <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-k="cancel">Close</button></div>`);
  const dlg = $('#dlg');
  $('[data-k="cancel"]', dlg).onclick = () => dlg.close();
  $('#onForm', dlg).addEventListener('submit', e => { e.preventDefault(); runOnlineSearch(); });
  wireRows(); wireUnmatched();
  const q = $('#onQ', dlg); if (q && !off && !onl.results.length && cleanName(onl.q).length >= 2) runOnlineSearch(); else if (q && !q.value) q.focus();
}
function onlineRowsHTML() {
  return `<div style="margin-top:12px">${onl.results.map((r, i) => `<button type="button" class="orow" data-i="${i}"><div class="ot">${esc(r.name)}${r.year ? ` <span class="muted">(${r.year})</span>` : ''}<span class="badge acc">${r.kind === 'series' ? 'TV' : 'Movie'}</span><span class="badge">${SRC_LABEL[r.source]}</span></div>${r.overview ? `<div class="ov">${esc(r.overview)}</div>` : ''}</button>`).join('')}</div>`;
}
/* Adding a title always starts with an online search; adding it unmatched is the fallback once a search has run (or you're offline). */
function unmatchedHTML() {
  if (!onl.add || !(onl.searched || offlineMsg())) return '';
  const name = cleanName(($('#onQ') || {}).value || onl.q);
  const none = onl.searched && !onl.results.length;
  return `<div style="margin-top:12px"><button type="button" class="btn ${none || offlineMsg() ? 'primary' : ''} block" data-k="unmatched" style="white-space:normal;height:auto;min-height:44px;line-height:1.3;padding:10px 14px">${name ? `Add “${esc(name)}” without a match` : 'Add without a match'}</button>
    <p class="hint" style="margin:6px 2px 0">${none || offlineMsg() ? 'Adds it with just the details you type. You can fetch its cast online later.' : 'Not in the list? Add it with just the details you type.'}</p></div>`;
}
function wireUnmatched() {
  const b = $('#onUnm [data-k="unmatched"]'); if (!b) return;
  b.onclick = () => { const name = cleanName(($('#onQ') || {}).value || onl.q); $('#dlg').close(); setTimeout(() => titleDialog(null, { name }), 0); };
}
function wireRows() { $$('#onRes .orow').forEach(b => { b.onclick = () => loadDetails(onl.results[+b.dataset.i].extId, false); }); }
async function runOnlineSearch() {
  const q = $('#onQ'); onl.q = q.value; const res = $('#onRes');
  const off = offlineMsg(); if (off) { res.innerHTML = `<div class="note bad">${esc(off)}</div>`; return; }
  res.innerHTML = '<p class="muted" style="margin-top:12px">Searching…</p>'; $('#onGo').disabled = true;
  try {
    onl.results = await searchOnline(onl.q);
    res.innerHTML = onl.results.length ? onlineRowsHTML() : `<div class="note">Nothing found. Try fewer words${state.settings.tmdbKey ? '' : ', or add a free TMDB key in Backup → Online lookup to search movies'}.</div>`;
    wireRows();
  } catch (e) { onl.results = []; res.innerHTML = `<div class="note bad">${esc(e.message)}</div>`; }
  onl.searched = true;
  const u = $('#onUnm'); if (u) { u.innerHTML = unmatchedHTML(); wireUnmatched(); }
  const go = $('#onGo'); if (go) go.disabled = false;
}
async function loadDetails(extId, direct) {
  const off = offlineMsg();
  onl.back = direct ? null : 'results';
  onlineBody('<p class="muted">Loading cast and crew…</p>');
  let d;
  try { if (off) throw new Error(off); d = await fetchDetails(extId); }
  catch (e) {
    onlineBody(`<h2>Couldn’t load that</h2><div class="note bad">${esc(e.message)}</div><div class="dlg-actions"><span class="spacer"></span>${direct ? '' : '<button type="button" class="btn" data-k="back">Back</button>'}<button type="button" class="btn ghost" data-k="cancel">Close</button></div>`);
    $('[data-k="cancel"]').onclick = () => $('#dlg').close(); const bk = $('[data-k="back"]'); if (bk) bk.onclick = onlineSearchView; return;
  }
  onl.details = d; onlinePreview();
}
function onlinePreview() {
  const d = onl.details, att = onl.attach, t = att ? titleById(att) : null;
  onlineBody(`<form id="onPrev" novalidate><h2>${esc(d.name)}${d.year ? ` <span class="muted">(${d.year})</span>` : ''}</h2>
    <div class="muted" style="font-size:14px;margin:4px 0 8px">${d.kind === 'series' ? 'TV series' : 'Movie'} · ${SRC_LABEL[d.source]}${d.genres.length ? ' · ' + esc(d.genres.join(', ')) : ''}</div>
    ${d.overview ? `<p class="hint" style="margin:0 0 8px">${esc(d.overview)}</p>` : ''}
    ${d.trailer ? `<p style="margin:0 0 8px"><a href="${esc(ytWatch(d.trailer))}" target="_blank" rel="noopener noreferrer">▶ Watch trailer</a></p>` : ''}
    <div class="note" id="onCounts"></div>
    <div class="stack" style="gap:10px;margin-top:8px">
    <div class="field"><label for="onCount">Cast to add</label><select id="onCount" name="count"><option value="10">Top 10</option><option value="25" selected>Top 25</option><option value="all">All (${d.cast.length})</option></select></div>
    ${att ? '' : `<div class="field"><label for="onStatus">Status</label><select id="onStatus" name="status">${STATUSES.map(([k, l]) => `<option value="${k}"${k === 'want' ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label for="onRating">Rating (optional)</label><select id="onRating" name="rating">${RATING_OPTS.map(([v, l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>`}</div>
    <div class="dlg-err" id="onErr" role="alert"></div>
    <div class="dlg-actions"><button type="button" class="btn" data-k="back">${onl.back ? 'Back' : 'Cancel'}</button><span class="spacer"></span><button type="submit" class="btn primary">${att ? 'Add cast to “' + esc(t ? t.name : '') + '”' : 'Add to log'}</button></div></form>`);
  const dlg = $('#dlg'), cnt = $('#onCount'), box = $('#onCounts');
  const upd = () => {
    const c = selectCredits(d, cnt.value), n = r => c.filter(x => x.role === r).length;
    box.textContent = `Will add: ${plural(n('actor'), 'cast member')}` + [['director', 'director'], ['creator', 'creator'], ['writer', 'writer']].filter(([r]) => n(r)).map(([r, w]) => ' · ' + plural(n(r), w)).join('');
  };
  cnt.addEventListener('change', upd); upd();
  $('[data-k="back"]', dlg).onclick = () => { if (onl.back) onlineSearchView(); else dlg.close(); };
  $('#onPrev', dlg).addEventListener('submit', e => {
    e.preventDefault();
    const count = cnt.value;
    if (att) {
      const r = attachOnline(att, d, count);
      if (r.error) { $('#onErr').textContent = r.error; return; }
      dlg.close(); const c = r.plan.counts; toast(c.newCredits || c.filled ? `Added ${plural(c.newCredits, 'new credit')}${c.newPeople ? ` (${plural(c.newPeople, 'new person', 'new people')})` : ''}` : 'Nothing new to add; this title already has them.'); return;
    }
    const r = addOnlineTitle(d, { count, status: $('#onStatus').value, rating: normRating($('#onRating').value) });
    if (r.error) { $('#onErr').textContent = r.error; return; }
    dlg.close(); nav(() => { ui.titleId = r.title.id; ui.personId = null; });
    toast(`Added “${r.title.name}” with ${plural(r.plan.counts.newCredits, 'credit')}`);
  });
}

/* ---- backup / restore ---- */
async function doExport() {
  const pass = ($('#bkPass') || {}).value || '', pass2 = ($('#bkPass2') || {}).value || '';
  if (pass) {
    if (pass.length < 8) return toast('Use at least 8 characters for the passphrase.');
    if (pass !== pass2) return toast('The two passphrases don’t match.');
  }
  const btn = $('[data-action="export"]'); if (btn) btn.disabled = true;
  try {
    const text = await Backup.build({ appId: APP_ID, schema: SCHEMA, data: exportData(!!($('#bkKey') || {}).checked), passphrase: pass || null });
    const r = await deliverFile(`goobs-watchlog-backup-${todayISO()}${pass ? '-encrypted' : ''}.json`, text, 'application/json');
    if (r !== 'cancelled') {
      state.meta.lastBackup = new Date().toISOString();
      await persist({ touch: false });
      render();
      toast(r === 'shared' ? 'Backup shared' : 'Backup saved to your downloads');
    }
  } catch (e) { toast('Backup failed: ' + e.message); }
  finally { const b2 = $('[data-action="export"]'); if (b2) b2.disabled = false; }
}
async function restoreFromText(text) {
  let parsed;
  try { parsed = await Backup.parse(text, { appId: APP_ID, schema: SCHEMA }); }
  catch (e) { await msgBox('Can’t restore that file', e.message); return false; }
  if (!parsed) return false;
  const { data, dropped } = normalizeData(parsed.data);
  if (!data.titles.length && !data.people.length) { await msgBox('Nothing to restore', 'That backup has no titles or people in it.'); return false; }
  const hasLocal = hasAnyData();
  const sum = `${plural(data.titles.length, 'title')}, ${plural(data.people.length, 'person')}, ${plural(data.credits.length, 'credit')}`;
  const when = parsed.exportedAt ? ` Backup made ${fmtDateTime(parsed.exportedAt)}.` : '';
  const skipped = dropped ? ` ${plural(dropped, 'unreadable item')} will be skipped.` : '';
  const body = `<p>${esc(sum + '.' + when + skipped)}</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps everything here for the backup. <b>Merge</b> adds what isn’t here yet.</p>' : '');
  const choice = await askDialog({
    title: 'Restore this backup?', body,
    buttons: hasLocal
      ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }]
      : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }]
  });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    for (const k of DATA_KEYS) state[k] = data[k];
    if (data.settings.tmdbKey) state.settings.tmdbKey = data.settings.tmdbKey;
    state.meta.lastBackup = ts; state.meta.lastChange = ts; Object.assign(ui, DETAIL0); ui.stack = [];
    await persist({ touch: false });
    render(); toast(`Restored ${sum}`); return true;
  }
  if (choice === 'merge') {
    const before = state.titles.length + state.people.length + state.credits.length;
    const merged = {};
    for (const k of DATA_KEYS) { const ids = new Set(state[k].map(x => x.id)); merged[k] = [...state[k], ...data[k].filter(x => !ids.has(x.id))]; }
    const n = normalizeData(merged).data;
    for (const k of DATA_KEYS) state[k] = n[k];
    if (!state.settings.tmdbKey && data.settings.tmdbKey) state.settings.tmdbKey = data.settings.tmdbKey;
    await persist(); render(); toast(`Merged in ${plural(state.titles.length + state.people.length + state.credits.length - before, 'item')}`); return true;
  }
  return false;
}
async function doRestore() {
  const f = await pickFile(); if (!f) return;
  let text;
  try { text = await readFileText(f); } catch { await msgBox('Couldn’t read that file', 'Try choosing it again.'); return; }
  await restoreFromText(text);
}
async function doWipe() {
  if (!(await confirmBox('Erase everything?', 'This permanently deletes all titles, people and credits on this device, and the movie database. Make a backup first if you might want them.', 'Erase everything'))) return;
  state = defaultState(); Object.assign(ui, DETAIL0); ui.stack = [];
  filmo = {}; filmoDirty = true; await saveFilmo(); await clearRef();
  await persist({ touch: false });
  render(); toast('Everything erased');
}
function saveKey() {
  const v = cleanName($('#tmdbKey').value).replace(/\s/g, '').slice(0, 600);
  state.settings.tmdbKey = v; persist(); toast(v ? 'TMDB key saved' : 'TMDB key removed');
}
async function testKey() {
  const res = $('#testRes'), v = cleanName($('#tmdbKey').value).replace(/\s/g, '');
  if (v !== state.settings.tmdbKey) { state.settings.tmdbKey = v; persist(); }
  const show = (ok, msg) => { res.classList.remove('hide', 'bad'); if (!ok) res.classList.add('bad'); res.textContent = (ok ? 'OK: ' : 'Failed: ') + msg; };
  const off = offlineMsg(); if (off) return show(false, off);
  res.classList.remove('hide', 'bad'); res.textContent = 'Testing…';
  try { show(true, await testOnline()); } catch (e) { show(false, e.message); }
}
async function doCsv(copy) {
  if (!state.titles.length) return toast('Nothing to export yet.');
  const csv = titlesCsv(state);
  if (copy) {
    try { await navigator.clipboard.writeText(csv.replace(/^\ufeff/, '')); toast('CSV copied'); }
    catch { toast('Couldn’t copy; use Save / share instead.'); }
    return;
  }
  const r = await deliverFile(`watchlog-titles-${todayISO()}.csv`, csv, 'text/csv');
  if (r !== 'cancelled') toast(r === 'shared' ? 'CSV shared' : `CSV saved: ${plural(state.titles.length, 'title')}`);
}

/* ---- wiring ---- */
view.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'add-title': onlineDialog({ add: true }); break;
    case 'seg': ui.logSeg = el.dataset.v; render(); break;
    case 'open-title': openTitle(id); break;
    case 'open-person': openPerson(id); break;
    case 'q-start': setStatus(id, 'watching'); break;
    case 'q-want': setStatus(id, 'want'); break;
    case 'q-drop': setStatus(id, 'dropped'); break;
    case 'q-watched': { setStatus(id, 'watched'); const t = titleById(id); toast('Marked watched', t && !t.rating ? { label: 'Rate it', fn: () => rateDialog(id) } : undefined); break; }
    case 'q-ep': { const t = titleById(id); if (t && t.kind === 'series') { if (!t.currentSeason) t.currentSeason = 1; t.currentEpisode++; if (t.status === 'want') t.status = 'watching'; commit(); } break; }
    case 'q-again': { const t = titleById(id); if (t) { t.rewatchCount++; t.status = 'watched'; t.watchedOn = todayISO(); commit(); toast('Logged another watch'); } break; }
    case 'rate': rateDialog(id); break;
    case 'pick': pickDialog(); break;
    case 'set-status': setStatus(ui.titleId, el.dataset.s); break;
    case 'edit-title': titleDialog(id); break;
    case 'del-title': delTitle(id); break;
    case 'add-person': addPersonDialog(); break;
    case 'bulk': bulkDialog(); break;
    case 'fetch-cast': { const t = titleById(id); if (t) onlineDialog(t.externalId ? { attach: id, extId: t.externalId } : { attach: id, q: t.name }); break; }
    case 'save-key': saveKey(); break;
    case 'test-key': testKey(); break;
    case 'edit-credit': creditDialog(id); break;
    case 'seen-here': seenHere(); break;
    case 'filmo-refresh': runFilmoJob(topCast(id), { force: true }).then(r => { if (r && r.busy) toast('Already looking something up.'); }); paintFilmo(); break;
    case 'filmo-person': { const p = personById(id); if (p) runFilmoJob([p], { force: true }); break; }
    case 'filmo-all': backfillFilmo(); break;
    case 'filmo-add': { const x = el.dataset.x; if (!extIdOk(x)) break; const ex = state.titles.find(t => t.externalId === x); if (ex) openTitle(ex.id); else onlineDialog({ extId: x }); break; }
    case 'edit-person': personDialog(id); break;
    case 'del-person': delPerson(id); break;
    case 'add-p': personDialog(); break;
    case 'tf': ui.tf[el.dataset.g] = el.dataset.v; render(); break;
    case 'dir': ui.tf.dir = ui.tf.dir === 'asc' ? 'desc' : 'asc'; render(); break;
    case 'conn-tab': ui.conn.tab = el.dataset.v; render(); break;
    case 'export': doExport(); break;
    case 'restore': doRestore(); break;
    case 'csv': doCsv(false); break;
    case 'csv-copy': doCsv(true); break;
    case 'wipe': doWipe(); break;
    case 'install': runInstall(); break;
    case 'open-rt': openRefTitle(el.dataset.i); break;
    case 'who': {   /* a title in your log -> its database cast, on the season you're watching */
      const t = titleById(id), ti = t && ref ? logRef().byTitle.get(t.id) : null; if (ti == null) break;
      openRefTitle(ref.t.id[ti], t.kind === 'series' && t.status === 'watching' ? t.currentSeason || 0 : 0); break;
    }
    case 'rt-season': ui.refSeason = +el.dataset.v || 0; $$('[data-action="rt-season"]').forEach(b => b.setAttribute('aria-pressed', String(b === el))); paintCast(); break;
    case 'cast-photos': if (ui.refT != null) lookUpPhotos(castPhotoIds(refTById(ui.refT))); break;
    case 'photo': lookUpPhotos([el.dataset.nm]); break;
    case 'rt-desc': if (ui.refT != null) lookUpDesc(refTById(ui.refT)); break;
    case 'open-rp': openRefPerson(el.dataset.i); break;
    case 'rt-add': {
      if (!ref || ui.refT == null) break;
      const r = addRefTitle(refTById(ui.refT), el.dataset.s);
      if (r.existed) { openTitle(r.title.id); break; }
      persist(); nav(() => { ui.titleId = r.title.id; });
      toast(`Added “${r.title.name}” with ${plural(r.plan.counts.newCredits, 'credit')}`);
      break;
    }
    case 'rt-cast': {
      const t = titleById(id), ti = t && ref ? logRef().byTitle.get(t.id) : null; if (ti == null) break;
      if (!t.imdb) t.imdb = ttId(ref.t.id[ti]);
      const plan = addRefCastTo(t.id, ti); toast(`Added ${plural(plan.counts.newCredits, 'credit')}`);
      break;
    }
    case 'ref-import': doRefImport(); break;
    case 'ref-remove': doRefRemove(); break;
    case 'ref-retry': guardClear(); refBlocked = false; refErr = ''; ensureRef(); render(); break;
  }
});
view.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[role=button]')) { e.preventDefault(); e.target.click(); } });
view.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { ui.tf.q = t.value; $('#tres').innerHTML = titlesResultHTML(); }
  else if (t.id === 'castq') { ui.castq = t.value; clearTimeout(ui.castT); ui.castT = setTimeout(paintCast, 150); }
  else if (t.id === 'pq') { ui.pq = t.value; $('#pres').innerHTML = peopleListHTML(); }
  else if (t.id in { ca: 1, cb: 1, cpa: 1, cpb: 1, cw: 1, cs: 1 }) {
    const key = { ca: 'a', cb: 'b', cpa: 'pa', cpb: 'pb', cw: 'w', cs: 's' }[t.id]; ui.conn[key] = t.value;
    /* "Who's that?" also scans every character in the movie database: wait for a pause in typing */
    clearTimeout(ui.connT);
    if (t.id === 'cw' && ref) ui.connT = setTimeout(() => { const c = $('#cres'); if (c) c.innerHTML = connResultHTML(); }, 250);
    else $('#cres').innerHTML = connResultHTML();
  }
});
view.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'tfRating') { ui.tf.rating = t.value; render(); }
  else if (t.id === 'tfSort') { ui.tf.sort = t.value; render(); }
});
$('#addBtn').onclick = () => { if (ui.tab === 'people') personDialog(); else onlineDialog({ add: true }); };
$('header.top').addEventListener('click', e => { const b = e.target.closest('#backLink'); if (b) { e.preventDefault(); goBack(); } });
$$('nav.tabs button').forEach(b => { b.onclick = () => go(b.dataset.tab); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dialog[open]') && !(document.activeElement && document.activeElement.matches('input,textarea,select'))) render(); });

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const raw = await idbGet(db, 'state');
      if (raw) {
        try { state = loadState(JSON.parse(raw)); }
        catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged — a copy was kept aside.'); }
      }
    } catch (e) { console.error(e); db = null; }
    if (db) { try { const fr = await idbGet(db, 'filmo'); if (fr) filmo = normFilmo(JSON.parse(fr)); } catch (e) { console.error(e); filmo = {}; } }
    if (db) { try { const ri = await idbGet(db, 'refInfo'); if (ri) refInfo = normRefInfo(JSON.parse(ri)); } catch (e) { console.error(e); refInfo = null; } }
  }
  rev++;
  render();
  if (refInfo) setTimeout(ensureRef, 300);
})();
</script>
