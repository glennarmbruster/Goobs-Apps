<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}

.pad{padding:14px 16px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}

.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}

.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}

.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}

.chips{display:flex;gap:8px;flex-wrap:wrap}

.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */

nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}

nav.tabs [aria-current="page"]{color:var(--accent)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}

.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);

function formDialog({ title, intro = '', fields, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extra = [], onClose, grid = '' }) {

const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);

  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { encrypted: true, kdf: 'PBKDF2-SHA256', iterations, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('Wrong passphrase, or the file is damaged.'); }
}

      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },

}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');
    let data;
    if (env.encrypted) {
      if (!(window.crypto && crypto.subtle)) throw new Error('Encrypted backups need a secure (https) connection.');
      if (!(env.iterations >= 1000 && env.iterations <= 2000000) || typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.data !== 'string')

      data = await promptDecrypt(env);
      if (data === null) return null;
    } else data = env.data;
    if (!data || typeof data !== 'object') throw new Error('The backup contains no data.');
    return { data, exportedAt: typeof env.exportedAt === 'string' ? env.exportedAt : null, schemaVersion: env.schemaVersion };
  }
};

}

/* ---- food-safety rules (kept deliberately simple; not a pasteurization table) ----
   R1 non-fish, bath < 130 F: do not hold beyond 4 hours (window max capped at 240 min).
   R2 beef / lamb / pork, bath < 135 F: total time at temperature >= heat-up + 1 h (window min raised).
   R3 chicken, bath < 150 F: same +1 h rule, plus a note that 150 F or higher is recommended for pasteurization within the time shown.
   Fish (salmon) is exempt: its window is heat-up + 45 min. */
const SAFE_PLUS_MIN = 60, HOLD_CAP_MIN = 240;

  if (group === 'fish') return s;
  if (bathF < 130) { s.capMin = HOLD_CAP_MIN; s.notes.push('Below 130°F, holding longer than 4 hours is not recommended.'); }
  if ((group === 'beef' || group === 'lamb' || group === 'pork') && bathF < 135) { s.plusMin = SAFE_PLUS_MIN; s.notes.push('Below 135°F the center needs time to pasteurize: total time at temperature is at least heat-up + 1 hour.'); }
  if (group === 'chicken' && bathF < 150) { s.plusMin = SAFE_PLUS_MIN; s.notes.push('Chicken: 150°F or higher is recommended for pasteurization within the time shown. Below 150°F it needs heat-up + 1 hour at least.'); }
  return s;
}

/* ---- the plan ---- */
function planCook(inp, equipment) {
  const cut = CUTS[inp && inp.cut];
  if (!cut) return { ok: false, error: 'Pick a cut.' };
  const thick = inp.thick;
  if (!isNum(thick) || thick < 0.25 || thick > 4) return { ok: false, error: 'Thickness must be between 0.25 and 4 inches.' };
  if (!START[inp.start]) return { ok: false, error: 'Pick a starting state.' };
  if (!FINISH[inp.finish]) return { ok: false, error: 'Pick a finish.' };
  if (!EQUIP[equipment]) equipment = 'apo';
  const d = donenessFor(inp.cut, inp.doneness), targetF = d[2];
  const sear = searPlan(inp.finish, thick, equipment);
  const finishMin = Math.ceil(sear.totalSec / 60) + (inp.finish === 'none' ? 0 : 3) + sear.restMin;
  const out = { ok: true, cutKey: inp.cut, cutLabel: cut.label, donenessKey: d[0], donenessLabel: d[1], targetF, equipment, startKey: inp.start, thick, finishKey: inp.finish, sear, finishMin, notes: [], warns: [], mode: equipment === 'oven' ? 'oven' : 'bath' };
  if (inp.start === 'frozen') out.notes.push('Cooking from frozen: heat-up includes an extra 50% for thawing. Thawing in the fridge first is quicker overall.');
  if (equipment === 'oven') {
    const t = ovenMin(thick, inp.start, targetF);
    out.setTempF = OVEN_F; out.pullF = targetF - OVEN_PULL_BELOW;
    out.heatRawMin = t; out.heatMin = t;
    out.window = { min: Math.max(5, ceil5(t)), max: Math.max(5, ceil5(t)) + 15 };
    out.notes.push(`Oven only: roast at ${OVEN_F}°F on a rack over a sheet pan and pull at ${out.pullF}°F on a probe thermometer; the sear lifts it to about ${targetF}°F. The time is a rough guide: trust the probe.`);
    return out;
  }
  const raw = heatUpMin(thick, inp.start, targetF);
  const eff = equipment === 'apo' ? raw * APO_FACTOR : raw;
  const safe = safetyFor(cut.group, targetF);
  let min = ceil5(eff), max;
  if (!cut.tender) min = Math.max(min, cut.minMin);
  if (safe.plusMin) min = Math.max(min, ceil5(eff + safe.plusMin));
  if (min < 5) min = 5;
  if (cut.maxBeyond != null) max = ceil5(eff) + cut.maxBeyond; else max = cut.maxMin;
  if (safe.capMin != null) max = Math.min(max, safe.capMin);
  if (max < min) { if (safe.capMin != null && min > safe.capMin) out.warns.push('A thick cut at this temperature needs more than 4 hours. Thaw it first, slice it thinner or pick a higher temperature.'); max = min; }
  out.heatRawMin = raw; out.heatMin = eff; out.setTempF = targetF;
  out.window = { min, max };
  out.warns.push(...safe.notes);
  if (equipment === 'apo') out.notes.push('Anova steam mode: set the temperature to the bath temperature, 100% humidity. Preheat 5–10 minutes, then cook. A real oven runs about 10% slower than a water bath, and that is included in the times shown.');
  if (equipment === 'circ') out.notes.push('Bag the meat with the air pressed out (water-displacement or vacuum) and make sure it is fully submerged.');
  if (!cut.tender) out.notes.push(`Tough cut: the long hold (${fmtDur(cut.minMin)} to ${fmtDur(cut.maxMin)}) is what tenderizes it. Longer is softer, not drier.`);
  if (inp.cut === 'chickenbreast' && targetF < 160) out.notes.push('Texture: lower temperatures give a softer, silkier chicken breast; 160°F is the firm, traditional texture.');
  if (inp.cut === 'salmon') out.notes.push('Fish cooks fast: take it out within the window and handle gently.');
  return out;
}

/* ---- clock times ---- */
const parseHHMM = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(str(s).trim()); if (!m || +m[1] > 23 || +m[2] > 59) return null; return +m[1] * 60 + +m[2]; };
function fmtClock(mins) {
  const m = ((Math.round(mins) % 1440) + 1440) % 1440, h = Math.floor(m / 60), mm = m % 60;
  return `${h % 12 || 12}:${pad(mm)} ${h < 12 ? 'AM' : 'PM'}`;
}
/* serve time -> when to start the cook. Steak is lifted from the bath finishMin before serving. */
function clockPlan(mealHHMM, winMin, winMax, finishMin) {
  const m = parseHHMM(mealHHMM);
  if (m == null) return null;
  const out = m - finishMin;
  const mk = x => ({ text: fmtClock(x), dayShift: Math.floor(x / 1440) });
  return { serve: mk(m), outOfBathBy: mk(out), startLatest: mk(out - winMin), startEarliest: mk(out - winMax) };
}

  if (!db) return '<div class="banner bad">This browser isn’t allowing storage (private mode?). Changes won’t survive closing the app — use Backup.</div>';
  return '';
}
const starsHTML = n => `<span class="stars" aria-label="${n} of 5 stars">${'★'.repeat(n)}${'☆'.repeat(5 - n)}</span>`;
const opt = (v, label, cur) => `<option value="${esc(v)}"${String(v) === String(cur) ? ' selected' : ''}>${esc(label)}</option>`;
const thickDisplay = (inch, lu) => (lu === 'cm' ? nz(r1(inToCm(inch))) : nz(inch));

/* the recipe being shown for a saved recipe at n servings */
function displayRecipe(r, n) {
  n = n || r.servings;
  if (r.plan && n !== r.servings) {
    const card = buildRecipe({ ...r.plan, servings: n }, { ...state.settings, equipment: r.plan.equipment });
    if (card.ok) return { title: r.title, servings: n, ingredients: card.ingredients.map(i => i.text), steps: card.steps, notes: [], timing: card.timing, kcal: card.kcal.perServing, equipmentLabel: card.equipmentLabel, scaledNote: '' };
  }
  const f = n / r.servings;
  return { title: r.title, servings: n, ingredients: n === r.servings ? r.ingredients : r.ingredients.map(l => scaleLine(l, f)), steps: r.steps, notes: r.notes ? r.notes.split('\n') : [], timing: [], kcal: r.kcal, equipmentLabel: r.plan ? EQUIP[r.plan.equipment] : '', scaledNote: n !== r.servings ? 'Ingredient amounts are scaled. Amounts written inside the steps are not.' : '' };
}

function currentCard() { return buildRecipe(state.plan, state.settings); }

function renderPlan() {
  const p = state.plan, S = state.settings, tu = S.tempUnit, lu = S.lenUnit;

  const best = bestFor(state.log, p.cut);

  let html = storageBannerHTML() + `<div class="stack"><section class="card pad"><h3>Plan a cook</h3><div class="fields2" style="margin-top:10px">`
    + f('Cut', `<select id="p_cut" data-plan="cut">${CUT_KEYS.map(k => opt(k, CUTS[k].label, p.cut)).join('')}</select>`)
    + f('Doneness', `<select id="p_doneness" data-plan="doneness">${donenessList(p.cut).map(d => opt(d[0], `${d[1]} (${fmtTemp(d[2], tu)})`, p.doneness)).join('')}</select>`)
    + f(`Thickness (${lu})`, `<input id="p_thick" data-plan="thick" type="number" inputmode="decimal" step="${lu === 'cm' ? 0.5 : 0.25}" min="${lu === 'cm' ? 0.6 : 0.25}" max="${lu === 'cm' ? 10 : 4}" value="${thickDisplay(p.thick, lu)}">`)
    + f('Starting from', `<select id="p_start" data-plan="start">${Object.entries(START).map(([k, v]) => opt(k, v.label, p.start)).join('')}</select>`)
    + f('Finish', `<select id="p_finish" data-plan="finish">${Object.entries(FINISH).map(([k, v]) => opt(k, v.label, p.finish)).join('')}</select>`)
    + f('Servings', `<div class="stepper"><button type="button" data-action="serv" data-d="-1" aria-label="Fewer servings">−</button><b id="p_servings">${p.servings}</b><button type="button" data-action="serv" data-d="1" aria-label="More servings">+</button></div>`)
    + f('Style', `<select id="p_style" data-plan="style">${STYLES.map(s => opt(s.key, s.name, p.style)).join('')}</select>`, 'wide')
    + f('Serve at (optional)', `<input id="p_meal" data-plan="meal" type="time" value="${esc(p.meal)}">`, 'wide')
    + `</div>`
    + `<div class="chips" style="margin-top:12px"><button type="button" class="chip" data-action="lowcal" aria-pressed="${p.lowCal}">Low-calorie version</button></div>`
    + (best ? `<div class="best" id="bestLine"><b>Best so far for ${esc(CUTS[p.cut].label)}:</b> ${esc(bestLine(best, tu))} <span class="muted">(${esc(fmtDate(best.date, false))})</span></div>` : '')

  if (!card.ok) return html + `<div class="banner bad">${esc(card.error)}</div></div>`;
  const pl = card.plan, oven = pl.mode === 'oven';
  html += `<section class="card pad" id="planOut"><div class="fine">${esc(EQUIP[card.equipment])}</div>`
    + `<div class="bigtemp" id="bathTemp">${esc(fmtTemp(pl.setTempF, tu))}</div>`
    + `<div class="bigsub">${oven ? `Oven temperature. Pull at ${esc(fmtTemp(pl.pullF, tu))} on a probe` : `Bath temperature for ${esc(pl.donenessLabel.toLowerCase())} (center ${esc(fmtTemp(pl.targetF, tu))})`}</div>`
    + `<div class="tiles3"><div class="tile"><div class="lbl">${oven ? 'Roast' : 'Heat-up'}</div><div class="val" id="heatUp">${esc(fmtDur(oven ? pl.window.min : Math.ceil(pl.heatMin)))}</div></div>`
    + `<div class="tile"><div class="lbl">${oven ? 'Check by' : 'Hold window'}</div><div class="val" id="window">${esc(oven ? fmtDur(pl.window.max) : fmtDur(pl.window.min) + ' – ' + fmtDur(pl.window.max))}</div></div>`
    + `<div class="tile"><div class="lbl">Finish</div><div class="val">${pl.sear.secPerSide ? pl.sear.secPerSide + ' s/side' : 'None'}</div></div></div>`;
  for (const w of pl.warns) html += `<div class="safe">${esc(w)}</div>`;
  if (pl.notes.length) html += `<ul class="notes">${pl.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`;
  html += `</section>`;
  const cp = p.meal ? clockPlan(p.meal, pl.window.min, pl.window.max, pl.finishMin) : null;
  if (cp) html += `<section class="card pad" id="clockCard"><h3>Timing for ${esc(cp.serve.text)}</h3><div class="kv"><span>Start by (latest)</span><span id="startBy">${esc(clockText(cp.startLatest))}</span></div><div class="kv"><span>Start no earlier than</span><span>${esc(clockText(cp.startEarliest))}</span></div><div class="kv"><span>Out of the ${oven ? 'oven' : 'bath'} by</span><span>${esc(clockText(cp.outOfBathBy))}</span></div><div class="kv"><span>Ready at</span><span id="readyAt">${esc(clockText(cp.serve))}</span></div></section>`;

    + `</section>`;
  const sv = card.kcal.saves;
  html += `<section class="card pad" id="recipeCard"><h3>${esc(card.title)}</h3>`
    + `<p class="muted" id="kcalLine" style="margin-top:4px">About ${card.kcal.perServing} kcal per serving (approximate)${sv != null ? `. <b>Saves about ${sv} kcal/serving</b>` : ''}.</p>`
    + (p.lowCal ? '' : '')
    + `<h3 style="margin-top:12px">Ingredients</h3><ul class="ings">${card.ingredients.map(i => `<li>${esc(i.text)}</li>`).join('')}</ul>`

    + `<h3 style="margin-top:12px">Timing</h3><ul class="notes">${card.timing.map(t => `<li>${esc(t)}</li>`).join('')}</ul>`;
  const lean = leanSuggestion(p.style, p.cut);
  if (lean) html += `<p class="fine" id="leanLine">Going with ${esc(lean.label)} instead of ${esc(CUTS[p.cut].label)} would save about ${lean.saves} more kcal per serving.</p>`;
  html += `<div class="btnrow"><button type="button" class="btn primary" data-action="save-plan">Save to Recipes</button><button type="button" class="btn" data-action="copy-plan">Copy as text</button><button type="button" class="btn" data-action="cook-plan">Cook mode</button><button type="button" class="btn" data-action="log-plan">Log this cook</button></div></section></div>`;
  return html;
}

function recipeRows() {
  const q = ui.q.trim().toLowerCase();
  let list = state.recipes.slice();
  if (ui.fav) list = list.filter(r => r.favorite);
  if (q) list = list.filter(r => [r.title, r.notes, r.tags.join(' '), r.ingredients.join(' ')].join('\n').toLowerCase().includes(q));
  list.sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0) || b.createdAt.localeCompare(a.createdAt));
  if (!list.length) return `<div class="empty"><h2>No matches</h2><p>Try a different search.</p></div>`;
  return `<div class="card"><ul class="list">${list.map(r => `<li class="row" role="button" tabindex="0" data-action="open-recipe" data-id="${esc(r.id)}"><div class="row-main"><div class="row-title">${r.favorite ? '★ ' : ''}${esc(r.title)}</div><div class="row-sub">Serves ${r.servings}${r.kcal ? ' · ' + r.kcal + ' kcal' : ''}${r.source === 'plan' ? ' · from Plan' : ''}${r.tags.length ? ' · ' + esc(r.tags.join(', ')) : ''}</div></div></li>`).join('')}</ul></div>`;

/* =====================================================================
   COOKING TEMPS: instant safe temps (USDA) next to what cooks recommend, with the "why" behind each.
   Safe numbers: FoodSafety.gov "Safe Minimum Internal Temperatures" (USDA/FSIS/FDA).
   Time-at-temperature holds: USDA FSIS time-temperature tables (poultry, 7-log Salmonella; 10% fat column)
   and the FSIS / FDA Food Code roast-beef table. Recommended numbers are common culinary practice.
   ===================================================================== */
const TEMP_GROUPS = [['beef', 'Beef, lamb & veal'], ['pork', 'Pork'], ['poultry', 'Poultry'], ['game', 'Game'], ['fish', 'Fish'], ['shell', 'Shellfish'], ['other', 'Eggs & leftovers']];
/* Equivalent "same kill" holds. 165°F (poultry) and 145°F + rest (whole beef) are the instant versions. */
const HOLD_POULTRY = [[165, 'under 10 sec', 'under 10 sec'], [160, '16 sec', '27 sec'], [155, '52 sec', '1.3 min'], [150, '3.5 min', '4.3 min'], [145, '11.3 min', '12.4 min'], [140, '32 min', '31.5 min']];
const HOLD_BEEF = [[145, '4 min'], [140, '12 min'], [135, '36 min'], [130, '112 min']];
const WHY = {
  whole: ['Why the middle can be pink', 'On an intact steak, chop or roast, bacteria live on the outside surface. The inside of a whole muscle is essentially sterile. Searing or roasting the outside kills what is there, so the center can stay pink. USDA’s 145°F with a 3-minute rest is a conservative one-size number; a properly seared rare or medium-rare steak is safe.'],
  mech: ['One exception', 'Steaks labeled “mechanically tenderized” or “needle tenderized” (common in some grocery and restaurant beef) have had blades push surface bacteria into the middle. Cook those to at least 145°F.'],
  ground: ['Why ground meat is different', 'Grinding mixes the outside surface, where bacteria such as E. coli O157:H7 live, all through the meat. The middle is no longer protected, so ground meat needs to reach the safe temperature all the way through, even when a steak from the same animal is fine pink. Color is not a test: a burger can brown before it is safe. Use a thermometer.'],
  time: ['Safety is temperature AND time', 'The instant safe temps are USDA’s numbers: the point where bacteria die within seconds. Lower temperatures kill the same bacteria, just more slowly. USDA’s own food-processing tables list how long each temperature must be held for the same kill (table below). 165°F is not the only safe temperature for chicken. It is the temperature where it is safe instantly.'],
  timeHow: ['Held properly, it is just as safe', 'Chicken held at 150°F for 3.5 minutes has had the same bacteria kill as chicken that hit 165°F. It is not “almost as safe”: it is the same result, for everyone. To hold it, pull the meat at the lower temperature, rest it covered and leave the probe in to confirm it stays at or above that temperature for the listed time. Sous vide makes this exact: the food sits at the set temperature far longer than the table requires.'],
  dark: ['Why dark meat goes hotter than “safe”', 'Thighs, legs and wings are safe at 165°F but still a bit chewy there. Their connective tissue melts between about 175°F and 190°F, which makes them tender and juicy. Going higher is about texture, not safety.'],
  lowslow: ['Why 195–205°F', 'Tough cuts are safe much lower, but their collagen needs time around 195–205°F to turn into gelatin so the meat pulls apart or slices tender. This is about texture, not safety. Probe-tender (slides in like butter) matters more than the exact number.'],
  pork: ['Why pork can be a little pink', 'USDA lowered whole-cut pork from 160°F to 145°F with a 3-minute rest in 2011. Trichinella has been all but eliminated from U.S. commercial pork, and it dies at 137°F anyway. A blush of pink at 145°F is normal and safe.'],
  fish: ['About fish', 'USDA says 145°F or until the flesh flakes. Most cooks stop well below that because fish dries out fast. The main concern with undercooked fish is parasites, not surface bacteria. Fish that was commercially frozen (FDA guidance: −4°F for 7 days) has had parasites killed, and farm-raised salmon is low-risk. Buy from a reputable source and keep it cold.'],
  shell: ['About shrimp, lobster, crab and scallops', 'USDA gives no number for these: cook until the flesh is pearly or white and opaque. They overcook quickly and turn rubbery, so take them off as soon as they are opaque.'],

      const base = r ? { ...r } : { source: 'manual', createdAt: new Date().toISOString() };
      const keepSteps = r && !edited ? r.steps : stp;
      const n = normRecipe({ ...base, title: v.title, servings: Math.round(sv), tags: v.tags.split(','), favorite: v.favorite, ingredients: ing, steps: keepSteps, notes: v.notes, source: r && !edited ? r.source : 'manual', plan: r && !edited ? r.plan : null });
      if (!n) return 'Give the recipe a title.';
      if (r) state.recipes[state.recipes.indexOf(r)] = n; else state.recipes.push(n);
      ui.recipe = n.id; ui.scale = null; ui.tab = 'recipes';
      commit(); toast(r ? 'Recipe updated' : 'Recipe added');
    }
  });
}
function logDialog(id, pre = {}) {
  const e = id ? state.log.find(x => x.id === id) : null;
  const S = state.settings, tu = S.tempUnit, lu = S.lenUnit;
  const src = e || pre;
  formDialog({
    title: e ? 'Edit cook' : 'Log a cook', grid: 'fields2',
    fields: [
      { name: 'date', label: 'Date', type: 'date', value: src.date || todayISO() },
      { name: 'cut', label: 'Cut', type: 'select', options: CUT_KEYS.map(k => [k, CUTS[k].label]), value: src.cut || state.plan.cut },
      { name: 'thick', label: `Thickness (${lu})`, type: 'number', value: isNum(src.thick) ? thickDisplay(src.thick, lu) : '' },
      { name: 'bath', label: `Bath temp (°${tu})`, type: 'number', value: isNum(src.bathF) ? nz(tu === 'C' ? r1(fToC(src.bathF)) : r1(src.bathF)) : '' },
      { name: 'time', label: 'Time used (e.g. 2h, 90 min)', value: isNum(src.mins) ? fmtDurShort(src.mins) : '' },
      { name: 'stars', label: 'Result', type: 'select', options: [[5, '5 stars'], [4, '4 stars'], [3, '3 stars'], [2, '2 stars'], [1, '1 star']], value: src.stars || 4 },
      { name: 'recipe', label: 'Recipe', type: 'select', options: [['', 'None'], ...state.recipes.map(r => [r.id, r.title])], value: src.recipeId || '' },
      { name: 'notes', label: 'What I’d change', type: 'textarea', value: src.notes || '' }
    ],
    onSubmit: v => {
      if (!isISO(v.date)) return 'Pick a date.';
      let thick = null, bathF = null, mins = null;
      if (v.thick.trim() !== '') { const x = numIn(v.thick, 0, 1000); thick = x == null ? null : lenToIn(x, lu); if (thick == null || thick < 0.25 || thick > 4) return `Thickness must be between ${lu === 'cm' ? '0.6 and 10 cm' : '0.25 and 4 in'}.`; }
      if (v.bath.trim() !== '') { const x = numIn(v.bath, 0, 500); bathF = x == null ? null : tempToF(x, tu); if (bathF == null || bathF < 90 || bathF > 212) return 'Bath temperature looks wrong.'; }
      if (v.time.trim() !== '') { mins = parseDuration(v.time); if (mins == null) return 'Time: try 2h, 90 min or 1:30.'; }
      const rec = state.recipes.find(r => r.id === v.recipe);
      const n = normLog({ ...(e || {}), id: e ? e.id : uid(), date: v.date, cut: v.cut, thick, bathF, mins, stars: +v.stars, notes: v.notes, recipeId: rec ? rec.id : '', recipeTitle: rec ? rec.title : e && e.recipeId === v.recipe ? e.recipeTitle : '', createdAt: e ? e.createdAt : new Date().toISOString() });
      if (!n) return 'Check the fields and try again.';
      if (e) state.log[state.log.indexOf(e)] = n; else state.log.push(n);
      commit(); toast(e ? 'Entry updated' : 'Cook logged');
    },
    onDelete: e ? async () => {
      if (!(await confirmBox('Delete this entry?', 'This cook log entry will be removed.'))) return false;
      state.log = state.log.filter(x => x.id !== e.id); commit(); toast('Entry deleted'); return true;
    } : null
  });
}
function timerDialog() {
  formDialog({
    title: 'New timer', fields: [{ name: 'label', label: 'Name', value: '', placeholder: 'Steaks resting' }, { name: 'time', label: 'Time (e.g. 5 min, 1:30)', value: '', required: true }],
    submitLabel: 'Start',
    onSubmit: v => { const m = parseDuration(v.time); if (m == null) return 'Time: try 5 min, 90 min or 1:30.'; startTimer(v.label, m * 60); }
  });
}

/* =====================================================================
   Actions
   ===================================================================== */
function startCook(title, steps, ings) {
  if (!steps.length) return toast('This recipe has no steps to cook.');
  ui.cook = { title, steps, ings, i: 0 }; render(); window.scrollTo(0, 0);
}
function savePlanRecipe() {
  const card = currentCard(); if (!card.ok) return;
  const n = normRecipe({
    title: card.title, servings: card.servings, ingredients: card.ingredients.map(i => i.text), steps: card.steps,
    notes: [...card.timing, ...card.notes].join('\n'), tags: [CUTS[state.plan.cut].label, styleOf(state.plan.style).name], source: 'plan',
    plan: { ...state.plan, equipment: card.equipment }, kcal: card.kcal.perServing
  });
  state.recipes.push(n); persist();
  toast('Saved to Recipes', { label: 'Open', fn: () => { ui.tab = 'recipes'; ui.recipe = n.id; ui.scale = null; render(); } });
  render();
}
function setPlan(key, val) {
  const p = { ...state.plan };
  if (key === 'thick') {
    const x = numIn(val, 0, 1000), inch = x == null ? null : lenToIn(x, state.settings.lenUnit);
    if (inch == null || inch < 0.25 || inch > 4) { toast(`Thickness must be between ${state.settings.lenUnit === 'cm' ? '0.6 and 10 cm' : '0.25 and 4 inches'}.`); return render(); }
    p.thick = state.settings.lenUnit === 'in' ? Math.round(inch * 4) / 4 : Math.round(inch * 1000) / 1000;
  } else if (key === 'servings') p.servings = val;
  else p[key] = val;
  state.plan = normPlan(p, state.settings.servings);
  commit();
}
function setSetting(key, val) {
  const s = { ...state.settings, [key]: val };
  const old = state.settings.servings;
  state.settings = normSettings(s);
  if (key === 'servings' && state.settings.servings !== old) state.plan = normPlan({ ...state.plan, servings: state.settings.servings }, state.settings.servings);
  commit();
}

async function doExport() {
  const pass = ($('#bkPass') || {}).value || '', pass2 = ($('#bkPass2') || {}).value || '';
  if (pass) {
    if (pass.length < 8) return toast('Use at least 8 characters for the passphrase.');
    if (pass !== pass2) return toast('The two passphrases don’t match.');
  }
  const btn = $('[data-action="export"]'); if (btn) btn.disabled = true;
  try {
    const text = await Backup.build({ appId: APP_ID, schema: SCHEMA, data: exportData(), passphrase: pass || null });
    const r = await deliverFile(`goobs-sousvide-backup-${todayISO()}${pass ? '-encrypted' : ''}.json`, text, 'application/json');
    if (r !== 'cancelled') {
      state.meta.lastBackup = new Date().toISOString();
      await persist({ touch: false });
      render();
      toast(r === 'shared' ? 'Backup shared' : 'Backup saved to your downloads');
    }
  } catch (e) { toast('Backup failed: ' + e.message); }
  finally { const b2 = $('[data-action="export"]'); if (b2) b2.disabled = false; }
}
async function restoreFromText(text) {
  let parsed;
  try { parsed = await Backup.parse(text, { appId: APP_ID, schema: SCHEMA }); }
  catch (e) { await msgBox('Can’t restore that file', e.message); return false; }
  if (!parsed) return false;
  const { data, dropped } = normalizeData(parsed.data);
  if (!data.recipes.length && !data.log.length && isDefaultData(data)) { await msgBox('Nothing to restore', 'That backup has no data in it.'); return false; }
  const hasLocal = hasAnyData();
  const sum = `${plural(data.recipes.length, 'recipe')}, ${plural(data.log.length, 'cook log entry').replace('entrys', 'entries')}`;
  const when = parsed.exportedAt ? ` Backup made ${fmtDateTime(parsed.exportedAt)}.` : '';
  const skipped = dropped ? ` ${plural(dropped, 'unreadable item')} will be skipped.` : '';
  const body = `<p>${esc(sum + '.' + when + skipped)}</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps everything here for the backup. <b>Merge</b> adds what isn’t here yet and keeps your current settings.</p>' : '');
  const choice = await askDialog({
    title: 'Restore this backup?', body,
    buttons: hasLocal
      ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }]
      : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }]
  });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    for (const k of DATA_KEYS) state[k] = data[k];
    state.meta.lastBackup = ts; state.meta.lastChange = ts;
    ui.recipe = null; ui.cook = null;
    await persist({ touch: false });
    render(); toast(`Restored ${sum}`); return true;
  }
  if (choice === 'merge') {
    const merged = { settings: state.settings, plan: state.plan }; let added = 0;
    for (const k of ['recipes', 'log']) { const ids = new Set(state[k].map(x => x.id)); merged[k] = [...state[k]]; for (const x of data[k]) if (!ids.has(x.id)) { merged[k].push(x); added++; } }
    const n = normalizeData(merged).data;
    for (const k of DATA_KEYS) state[k] = n[k];
    await persist(); render(); toast(`Merged in ${plural(added, 'item')}`); return true;
  }
  return false;
}
async function doRestore() {
  const f = await pickFile(); if (!f) return;
  let text;
  try { text = await readFileText(f); } catch { await msgBox('Couldn’t read that file', 'Try choosing it again.'); return; }
  await restoreFromText(text);
}
async function doWipe() {
  if (!(await confirmBox('Erase everything?', 'This permanently deletes all recipes, cook log entries and settings on this device.', 'Erase everything'))) return;
  state = defaultState(); ui.recipe = null; ui.cook = null;
  await persist({ touch: false });
  render(); toast('Everything erased');
}

/* ---- wiring ---- */
view.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'serv': setPlan('servings', clamp(state.plan.servings + (+el.dataset.d), 1, 20)); break;
    case 'lowcal': setPlan('lowCal', !state.plan.lowCal); break;
    case 'save-plan': savePlanRecipe(); break;
    case 'copy-plan': { const c = currentCard(); if (c.ok) copyOrShow(recipeText(c)); break; }
    case 'cook-plan': { const c = currentCard(); if (c.ok) startCook(c.title, c.steps, c.ingredients.map(i => i.text)); break; }
    case 'log-plan': { const c = currentCard(); if (c.ok) logDialog(null, { cut: state.plan.cut, thick: state.plan.thick, bathF: c.plan.mode === 'bath' ? c.plan.targetF : null, mins: c.plan.window.min }); break; }
    case 'new-recipe': recipeDialog(); break;
    case 'open-recipe': ui.recipe = id; ui.scale = null; render(); window.scrollTo(0, 0); break;
    case 'close-recipe': ui.recipe = null; ui.scale = null; render(); break;
    case 'fav-filter': ui.fav = !ui.fav; render(); break;
    case 'fav': { const r = state.recipes.find(x => x.id === ui.recipe); if (r) { r.favorite = !r.favorite; commit(); } break; }
    case 'rscale': { const r = state.recipes.find(x => x.id === ui.recipe); if (r) { ui.scale = clamp((ui.scale || r.servings) + (+el.dataset.d), 1, 100); render(); } break; }
    case 'edit-recipe': recipeDialog(ui.recipe); break;
    case 'del-recipe': {
      const r = state.recipes.find(x => x.id === ui.recipe); if (!r) break;
      if (!(await confirmBox('Delete this recipe?', `“${r.title}” will be removed.`))) break;
      state.recipes = state.recipes.filter(x => x.id !== r.id); ui.recipe = null; ui.scale = null; commit(); toast('Recipe deleted'); break;
    }
    case 'copy-recipe': {
      const r = state.recipes.find(x => x.id === ui.recipe); if (!r) break;
      const d = displayRecipe(r, ui.scale || r.servings);
      copyOrShow(recipeText({ title: d.title, equipmentLabel: d.equipmentLabel || 'Any', servings: d.servings, ingredients: d.ingredients, steps: d.steps, timing: d.timing, notes: d.notes, kcal: { perServing: d.kcal } })); break;
    }
    case 'cook-recipe': { const r = state.recipes.find(x => x.id === ui.recipe); if (r) { const d = displayRecipe(r, ui.scale || r.servings); startCook(d.title, d.steps, d.ingredients); } break; }
    case 'new-log': logDialog(); break;
    case 'edit-log': logDialog(id); break;
    case 'cut-filter': ui.cutFilter = el.dataset.v; render(); break;
    case 'exit-cook': ui.cook = null; render(); break;
    case 'cook-prev': if (ui.cook && ui.cook.i > 0) { ui.cook.i--; render(); window.scrollTo(0, 0); } break;
    case 'cook-next': if (ui.cook) { if (ui.cook.i < ui.cook.steps.length - 1) { ui.cook.i++; render(); window.scrollTo(0, 0); } else { ui.cook = null; render(); } } break;
    case 'step-timer': { const s = ui.cook.steps[ui.cook.i]; startTimer(s.title || `Step ${ui.cook.i + 1}`, +el.dataset.secs); break; }
    case 'custom-timer': timerDialog(); break;
    case 'temp-group': ui.tg = el.dataset.v; render(); break;
    case 'temp-sv': if (CUTS[el.dataset.v]) { setPlan('cut', el.dataset.v); go('plan'); } break;
    case 'export': doExport(); break;
    case 'restore': doRestore(); break;
    case 'wipe': doWipe(); break;
    case 'install': runInstall(); break;
  }
});
view.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.row[role=button]')) { e.preventDefault(); e.target.click(); } });
view.addEventListener('change', e => {
  const pl = e.target.closest('[data-plan]');
  if (pl) { const k = pl.dataset.plan; setPlan(k, pl.value); return; }
  const st = e.target.closest('[data-set]');
  if (st) { const k = st.dataset.set; setSetting(k, k === 'servings' ? numIn(st.value, 1, 20) : st.value); }
});
view.addEventListener('input', e => {
  if (e.target.id === 'tq') { ui.tq = e.target.value; const l = $('#tlist'); if (l) l.innerHTML = tempsListHTML(tempMatches(), state.settings.tempUnit === 'C' ? 'C' : 'F', ''); return; }
  if (e.target.id === 'q') { ui.q = e.target.value; const l = $('#rlist'); if (l) l.innerHTML = recipeRows(); }
});
$('#addBtn').onclick = () => { if (ui.tab === 'recipes') recipeDialog(); else if (ui.tab === 'log') logDialog(); };
$$('nav.tabs button').forEach(b => { b.onclick = () => go(b.dataset.tab); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dialog[open]')) { render(); renderTimers(); ensureTick(); } });

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const raw = await idbGet(db, 'state');
      if (raw) {
        try { state = loadState(JSON.parse(raw)); }
        catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged — a copy was kept aside.'); }
      }
    } catch (e) { console.error(e); db = null; }
  }
  render();
})();
</script>
