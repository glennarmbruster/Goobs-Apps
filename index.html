<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a" id="metaThemeColor">
<title>Goobs Apps</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<script>
(function() {
  try {
    var saved = localStorage.getItem('goobs-launcher-theme') || 'Phone';
    document.documentElement.setAttribute('data-theme', saved);
    var isDark = saved === 'Dark' ||
      (saved === 'Phone' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('is-dark', isDark);
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #f1f5f9;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --text: #0f172a;
  --muted: #475569;
  --border: #cbd5e1;
  --accent: #0e7490;
  --header-bg: #0f172a;
  --header-text: #ffffff;
  --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html.is-dark {
  --bg: #0b1220;
  --surface: #131d31;
  --surface-2: #19253d;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --border: #263552;
  --accent: #38bdf8;
  --header-bg: #090e1a;
  --header-text: #f8fafc;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.32);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  overflow-x: hidden;
}
.header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--header-bg);
  color: var(--header-text);
  padding: calc(12px + var(--safe-top)) 16px 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}
.header-inner {
  max-width: 1560px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.01em;
}
.theme-sel {
  background: rgba(255,255,255,0.14);
  color: var(--header-text);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 600;
  min-height: 36px;
}
.theme-sel option { color: #0f172a; background: #ffffff; }

.wrap {
  max-width: 1560px;
  margin: 0 auto;
  padding: 14px 16px calc(28px + var(--safe-bottom));
}
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
  align-items: center;
}
.search-input {
  flex: 1 1 240px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
  min-height: 44px;
}
.cat-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  max-width: 100%;
  padding-bottom: 2px;
}
.chip {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  min-height: 36px;
  white-space: nowrap;
}
.chip.active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}
html.is-dark .chip.active { color: #082f49; }

.section-title {
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin: 18px 0 10px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.app-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 13px 12px;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-height: 92px;
  transition: transform 0.12s ease, border-color 0.12s ease;
}
.app-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.app-top {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
}
.app-icon {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  overflow: hidden;
}
.app-name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}
.app-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.35;
}

@media (min-width: 700px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
}
@media (min-width: 1000px) {
  .wrap { padding: 20px 24px 40px; }
  .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
  .app-card { padding: 15px 14px; min-height: 102px; }
}
@media (min-width: 1440px) {
  .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="title">🚀 Goobs Apps</div>
    <select class="theme-sel" id="themeSelect" aria-label="Theme">
      <option value="Phone">Theme: Phone</option>
      <option value="Light">Theme: Light</option>
      <option value="Dark">Theme: Dark</option>
    </select>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <input class="search-input" id="searchInput" type="search" placeholder="Search apps… ( / )">
    <div class="cat-row" id="catRow">
      <button class="chip active" data-cat="all">All</button>
      <button class="chip" data-cat="travel">Travel &amp; Local</button>
      <button class="chip" data-cat="kitchen">Kitchen &amp; Health</button>
      <button class="chip" data-cat="home">Home &amp; Money</button>
      <button class="chip" data-cat="media">Media &amp; Work</button>
    </div>
  </div>

  <div id="gridContainer"></div>
</main>

<script>
(function() {
  'use strict';

  const APPS = [
    // Travel & Local
    { slug: 'travel', name: 'Planner', desc: 'Trips, itineraries & cruise countdowns', emoji: '✈️', group: 'travel', tags: ['travel'] },
    { slug: 'houston', name: 'Houston Events', desc: 'Concerts, comedy, festivals & day trips', emoji: '🤠', group: 'travel', tags: ['travel'] },
    { slug: 'occasions', name: 'Occasions', desc: 'Birthdays, anniversaries & gift ideas', emoji: '🎁', group: 'travel', tags: ['travel', 'home'] },

    // Kitchen & Health
    { slug: 'recipes', name: 'Goobs Recipes', desc: 'Personal cookbook & JSON recipe cards', emoji: '📖', group: 'kitchen', tags: ['kitchen'] },
    { slug: 'sousvide', name: 'Cooking Temps', desc: 'APO, sous vide & smoker temp guide', emoji: '🌡️', group: 'kitchen', tags: ['kitchen'] },
    { slug: 'grocery', name: 'Grocery List', desc: 'Shared shopping list & pantry staples', emoji: '🛒', group: 'kitchen', tags: ['kitchen', 'home'] },
    { slug: 'calories', name: 'Calorie Lookup', desc: 'Cruise menu & meal calorie tracker', emoji: '🥗', group: 'kitchen', tags: ['kitchen', 'travel'] },
    { slug: 'health', name: 'Health Log', desc: 'Vitals, weight & wellness readings', emoji: '❤️', group: 'kitchen', tags: ['kitchen'] },

    // Home & Money
    { slug: 'todo', name: 'To-Do', desc: 'Shared household tasks & reminders', emoji: '✅', group: 'home', tags: ['home'] },
    { slug: 'pool', name: 'Pool Log', desc: 'Friendswood pool water chemistry tracker', emoji: '🏊', group: 'home', tags: ['home'] },
    { slug: 'house', name: 'House', desc: 'Home maintenance, filters & warranties', emoji: '🏠', group: 'home', tags: ['home'] },
    { slug: 'household', name: 'Household', desc: 'Family info, contacts & home docs', emoji: '🏡', group: 'home', tags: ['home'] },
    { slug: 'inventory', name: 'Inventory', desc: 'Home gear, serial numbers & storage', emoji: '📦', group: 'home', tags: ['home'] },
    { slug: 'storage', name: 'Storage', desc: 'Bins, attic & garage location finder', emoji: '🗄️', group: 'home', tags: ['home'] },
    { slug: 'bills', name: 'Bill Reminders', desc: 'Monthly due dates & autopay tracker', emoji: '🧾', group: 'home', tags: ['home'] },
    { slug: 'money', name: 'Money & Budget', desc: 'Spending plan & retirement milestones', emoji: '💵', group: 'home', tags: ['home'] },

    // Media, Work & Tools
    { slug: 'watchlog', name: 'Watch Log', desc: 'TV shows, seasons & episode progress', emoji: '📺', group: 'media', tags: ['media'] },
    { slug: 'movies', name: 'Movies', desc: 'Movie watchlist & ratings', emoji: '🎬', group: 'media', tags: ['media'] },
    { slug: 'sports', name: 'Sports', desc: 'Schedules, teams & game trackers', emoji: '🏈', group: 'media', tags: ['media'] },
    { slug: 'worklog', name: 'Work Log', desc: 'Shift notes, tasks & change log', emoji: '💼', group: 'media', tags: ['media'] },
    { slug: 'va', name: 'VA Benefits', desc: 'VA reference & pay calculator', emoji: '🎖️', group: 'media', tags: ['media', 'home'] },
    { slug: 'backup', name: 'Back Up All Apps', desc: 'Export & verify all Goobs Apps data', emoji: '💾', group: 'media', tags: ['media', 'home'] }
  ];

  const GROUP_LABELS = {
    travel: 'Travel & Local',
    kitchen: 'Kitchen & Health',
    home: 'Home & Money',
    media: 'Media, Work & Utilities'
  };

  let activeCat = 'all';
  let query = '';

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function render() {
    const container = document.getElementById('gridContainer');
    const filtered = APPS.filter((a) => {
      if (activeCat !== 'all' && !a.tags.includes(activeCat)) return false;
      if (query) {
        const hay = (a.name + ' ' + a.desc + ' ' + a.slug).toLowerCase();
        if (!hay.includes(query)) return false;
      }
      return true;
    });

    if (!filtered.length) {
      container.innerHTML = '<p style="color:var(--muted); text-align:center; padding:24px 0;">No matching apps found.</p>';
      return;
    }

    const order = ['travel', 'kitchen', 'home', 'media'];
    container.innerHTML = order.map((grp) => {
      const items = filtered.filter((a) => a.group === grp);
      if (!items.length) return '';
      return `
        <div class="section-title">${esc(GROUP_LABELS[grp])}</div>
        <div class="grid">
          ${items.map((a) => `
            <a class="app-card" href="./${esc(a.slug)}/">
              <div class="app-top">
                <div class="app-icon">${a.emoji}</div>
                <span class="app-name">${esc(a.name)}</span>
              </div>
              <span class="app-desc">${esc(a.desc)}</span>
            </a>
          `).join('')}
        </div>
      `;
    }).join('');
  }

  document.getElementById('catRow').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    document.querySelectorAll('#catRow .chip').forEach((c) => c.classList.toggle('active', c === btn));
    render();
  });

  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    } else if (e.key === 'Escape' && document.activeElement === searchInput) {
      searchInput.value = '';
      query = '';
      searchInput.blur();
      render();
    }
  });

  const themeSelect = document.getElementById('themeSelect');
  themeSelect.value = localStorage.getItem('goobs-launcher-theme') || 'Phone';
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    const isDark = t === 'Dark' || (t === 'Phone' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('is-dark', isDark);
  }
  themeSelect.addEventListener('change', () => {
    localStorage.setItem('goobs-launcher-theme', themeSelect.value);
    applyTheme(themeSelect.value);
  });
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if ((localStorage.getItem('goobs-launcher-theme') || 'Phone') === 'Phone') applyTheme('Phone');
    });
  }

  render();
})();
</script>
</body>
</html>
