<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Houston Events</title>
<meta name="description" content="Houston-area concerts, theater, comedy, festivals, markets and more, collected automatically. Pick favorites to share with each other.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f2f8f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Houston Events">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--bg:#f2f8f7;--accent:#0b7f74;--accent-ink:#fff;--accent-soft:#d3efeb;--line:#d9e4e1;--soft:#e5eeec}
@media (prefers-color-scheme:dark){:root{--bg:#0c1413;--card:#14201e;--line:#22342f;--soft:#1a2a27;--accent:#2dd4bf;--accent-ink:#04201c;--accent-soft:#103430}}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
header.top .wrap{flex-wrap:nowrap}
header.top .btn.small{flex:none}
header.top .syncbadge{min-height:36px}
header.top h1{white-space:normal;font-size:18px;line-height:1.1}
header.top .wrap{gap:8px}
.demobar{background:var(--bad-soft);color:var(--bad);border-top:2px solid var(--bad);border-bottom:2px solid var(--bad);padding:8px 16px;text-align:center;font-weight:800;font-size:14px;line-height:1.3}
.demobar span{display:block;font-weight:600;font-size:12px}
.views{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0 8px;background:var(--soft);padding:4px;border-radius:14px}
.views button{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 2px;border-radius:10px;cursor:pointer;min-width:0}
.views button[aria-selected="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.statusline{appearance:none;border:0;background:none;font:inherit;font-size:13px;color:var(--muted);padding:6px 0;text-align:left;cursor:pointer;min-height:36px;width:100%}
.statusline u{text-decoration:underline}
.vtitle{font-weight:800;font-size:17px;margin:6px 2px 2px}
.vsub{font-size:13px;color:var(--muted);margin:0 2px 8px}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chiprow .chip{flex:none}
.fsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
.fsum .cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.dayh{position:sticky;top:var(--hh,58px);z-index:3;background:var(--bg);padding:10px 4px 6px;margin-top:6px;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line)}
.ev{padding:14px 16px;margin:10px 0}
.ev.faded{opacity:.72}
.ev-top{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ev-title{font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere;margin:0}
.ev.canceled .ev-title{text-decoration:line-through}
.ev .cat{flex:none;margin-left:0;font-size:12px}
.ev-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ev-badges .badge{margin-left:0;white-space:normal}
.ev-when{font-weight:700;margin-top:8px}
.ev-where{color:var(--ink);margin-top:2px;overflow-wrap:anywhere}
.ev-price{margin-top:4px;font-weight:600}
.ev-price.none{color:var(--muted);font-weight:500}
.ev-desc{margin:8px 0 0;font-size:14px;color:var(--muted);cursor:pointer;overflow-wrap:anywhere}
.ev-desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev-src{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ev-src .btn{white-space:normal;text-align:center;height:auto;padding-top:6px;padding-bottom:6px}
.ev-checked{font-size:12px;color:var(--muted);margin-top:6px}
.picks{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:6px;margin-top:12px}
.picks .btn{padding:0 4px;font-size:13px;min-width:0;white-space:normal;line-height:1.15;text-align:center}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.nop[aria-pressed="true"]{background:var(--soft);border-color:var(--line);color:var(--ink)}
.ev-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ev-act .btn{flex:1;min-width:120px}
.othr{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.othr .badge{margin-left:0}
.more{margin:14px 0}
.hiddenline{font-size:14px;color:var(--muted);text-align:center;margin:14px 0}
.hiddenline button{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;padding:8px;cursor:pointer;min-height:36px}
.addbtn{margin:4px 0 10px}
.menubtn{flex:none;min-width:36px;padding:0 8px;font-size:20px;line-height:1}
.series{margin-top:8px}
.occs{margin-top:8px;border-top:1px solid var(--line)}
.occ{padding:10px 0;border-bottom:1px solid var(--line)}
.occ-when{font-weight:700}
.occ-st{font-size:12px;font-weight:700;color:var(--warn)}
.picks.sm{margin-top:8px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.rg input{min-width:0;padding:10px 8px}
.scope{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.sig{font-size:13px;color:var(--muted);margin:2px 2px 10px}
.sig button{font:inherit;font-size:13px;font-weight:700;color:var(--accent);background:none;border:0;padding:6px 2px;cursor:pointer;min-height:36px}
.srcrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.srcrow:first-child{border-top:0}
.srcrow .nm{font-weight:700}
.srcrow .dt{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.set-form h3{margin-top:6px}
.set-form .chips{margin:8px 0 4px}
.set-form .seclbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-top:10px}
.set-form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set-form select{margin-top:4px}
@media print{header.top,nav,.picks,.ev-act{display:none}}
</style>

<body>
<div id="app"></div>
<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);
}

/* ---- dialogs ---- */
if (!$('#dlg')) document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg"></dialog><dialog id="ask"></dialog>');
{
  const dlg = $('#dlg'); let down = false;
  dlg.addEventListener('pointerdown', e => { down = e.target === dlg; });
  dlg.addEventListener('click', e => { if (e.target === dlg && down) dlg.close(); });
}

function fieldHTML(f) {
  const id = 'f_' + f.name, v = f.value ?? '';
  if (f.type === 'checkbox')
    return `<div class="field check"><input type="checkbox" id="${id}" name="${f.name}"${f.value ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label></div>`;
  let ctl;
  if (f.type === 'select') {
    ctl = `<select id="${id}" name="${f.name}">${f.options.map(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];

/* formDialog: fields -> values. onSubmit(values) may return an error string (keeps dialog open).

function formDialog({ title, intro = '', fields, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extra = [], onClose, grid = '' }) {
  const dlg = $('#dlg');
  const body = grid ? `<div class="${grid}">${fields.map(fieldHTML).join('')}</div>` : fields.map(fieldHTML).join('');
  dlg.innerHTML = `<form class="dlg-form" novalidate>

      ${onDelete ? `<button type="button" class="btn danger" data-k="del">${esc(deleteLabel)}</button>` : ''}

  const form = $('form', dlg), err = $('.dlg-err', dlg);

    err.textContent = '';

  $$('[data-x]', dlg).forEach(b => { b.onclick = () => extra[+b.dataset.x].onClick(collect()); });
  dlg.onclose = () => { dlg.onclose = null; if (onClose) onClose(); };

}

/* ---- backup: optional AES-GCM passphrase encryption (Web Crypto, PBKDF2-SHA256) ---- */
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptPayload(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const iterations = 250000;
  const key = await deriveKey(pass, salt, iterations);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { encrypted: true, kdf: 'PBKDF2-SHA256', iterations, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('Wrong passphrase, or the file is damaged.'); }
}
function promptDecrypt(env) {
  return new Promise(resolve => {
    let result = null;
    formDialog({
      title: 'Encrypted backup', intro: 'Enter the passphrase you chose when you made this backup.',
      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },
      onClose: () => resolve(result)
    });
  });
}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');
    let data;
    if (env.encrypted) {
      if (!(window.crypto && crypto.subtle)) throw new Error('Encrypted backups need a secure (https) connection.');
      if (!(env.iterations >= 1000 && env.iterations <= 2000000) || typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.data !== 'string')
        throw new Error('The encrypted backup is damaged.');
      data = await promptDecrypt(env);
      if (data === null) return null;
    } else data = env.data;
    if (!data || typeof data !== 'object') throw new Error('The backup contains no data.');
    return { data, exportedAt: typeof env.exportedAt === 'string' ? env.exportedAt : null, schemaVersion: env.schemaVersion };
  }
};

async function deliverFile(filename, text, mime = 'application/json') {
  const file = new File([text], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; /* otherwise fall back to a download */ }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  return 'downloaded';
}

/* nag banner: only when there is data and no recent backup */
function backupNag(meta, hasData) {
  if (!hasData) return null;
  if (!meta.lastBackup) return 'You have data but no backup yet. Make one so you can restore it if this device loses it.';
  const age = (Date.now() - Date.parse(meta.lastBackup)) / 86400000;
  const changed = meta.lastChange && Date.parse(meta.lastChange) > Date.parse(meta.lastBackup) + 1000;
  if (changed && age >= 7) return `Your last backup was ${Math.floor(age)} days ago and you’ve made changes since.`;
  return null;
}

   The app always works from its own on-device copy. This layer pushes local changes
   (per item, last write wins) and merges in changes made on the other phone.
   The Firebase calls live in firebaseBackend() only; everything else is plain logic. */
const SYNC_CONFIG = {
  apiKey: 'AIzaSyCztAn5kfhZ1yLjvia17D0dEsnDBvFzuKA',

async function firebaseBackend() {
  const [appM, authM, fsM] = await Promise.all([
    import(SYNC_SDK + 'firebase-app.js'), import(SYNC_SDK + 'firebase-auth.js'), import(SYNC_SDK + 'firebase-firestore.js')

    onAuth: cb => authM.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email || '' } : null)),
    signIn: (email, pw) => authM.signInWithEmailAndPassword(auth, email, pw),
    signOut: () => authM.signOut(auth),
    watch: (coll, onDocs, onErr) => fsM.onSnapshot(fsM.collection(fs, coll),
      snap => { if (!snap.metadata.fromCache) onDocs(snap.docs.map(d => ({ id: d.id, data: d.data() }))); },   // ignore cache-only snapshots: an empty one would look like "everything was deleted"
      onErr),
    // Last write wins: skip the write when the stored copy is newer than this change.
    // First-time uploads (ts 0) never overwrite a copy that already exists.
    write: op => {
      const ref = fsM.doc(fs, op.coll, op.id);
      return fsM.runTransaction(fs, async tx => {
        const cur = await tx.get(ref);

const Sync = (() => {
  const ACK_MS = 120000;
  let model = null, db = null, dbKey = 'sync', backend = null, user = null, state0 = 'off';
  let st = { v: 1, enabled: false, joined: false, seen: {}, outbox: {}, order: {} };
  let unsubs = [], remote = {}, ready = {}, flushing = false, retryTimer = null, retries = 0, lastTs = 0, lastN = 0, denied = false, errored = false;
  const acked = new Map(), listeners = [];

  const canon = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)) ? Object.fromEntries(Object.keys(x).sort().map(y => [y, x[y]])) : x);
  const nextTs = () => (lastTs = Math.max(Date.now(), lastTs + 1));
  const nextN = () => (lastN = Math.max(Date.now() * 1000, lastN + 1));
  const keyOf = (c, id) => c + '/' + id;
  const pending = () => Object.keys(st.outbox).length;
  const emit = () => { for (const f of listeners) try { f(); } catch (e) { console.error(e); } };
  let saveChain = Promise.resolve();
  function save() { if (!db) return; const s = JSON.stringify(st); saveChain = saveChain.then(() => idbPut(db, dbKey, s)).catch(e => console.error(e)); }

  function status() {
    if (!model) return 'off';
    if (state0 === 'unavailable') return 'unavailable';
    if (!user) return backend ? 'signed-out' : 'connecting';
    if (denied) return 'denied';
    if (errored) return 'error';
    if (!model.colls.every(c => ready[c])) return 'connecting';
    return pending() ? 'syncing' : 'live';
  }

  /* what changed on this device since we last synced -> queue it */
  function localDiff() {
    if (!st.enabled || !model) return;
    const present = new Set(); let dirty = false;
    for (const e of model.toEntities()) {
      const k = keyOf(e.coll, e.id); present.add(k);
      const j = canon(e.data);
      if (st.seen[k] === j) continue;
      st.seen[k] = j;
      if (!(k in st.order)) st.order[k] = nextN();
      st.outbox[k] = { op: 'set', coll: e.coll, id: e.id, data: JSON.parse(j), ts: st.joined ? nextTs() : 0, n: st.order[k] };
      dirty = true;
    }
    for (const k of Object.keys(st.seen)) {
      if (present.has(k)) continue;
      delete st.seen[k];
      const i = k.indexOf('/');
      st.outbox[k] = { op: 'del', coll: k.slice(0, i), id: k.slice(i + 1), ts: st.joined ? nextTs() : 0 };
      dirty = true;
    }

  function reconcile() {
    if (!model || !user || !model.colls.every(c => ready[c])) return;
    localDiff();

    model.colls.forEach(c => { out[c] = []; });
    for (const c of model.colls) for (const d of remote[c] || []) {
      const k = keyOf(c, d.id), op = st.outbox[k], u = d.data._u || 0, a = acked.get(k);
      remoteKeys.add(k);

      if (op) delete st.outbox[k];
      if (a && a.op === 'del' && now - a.at < ACK_MS && u <= a.ts) continue;   // our delete just landed; the list is a moment behind
      const { _u, _n, ...data } = d.data;

    }
    for (const e of model.toEntities()) {
      const k = keyOf(e.coll, e.id);
      if (remoteKeys.has(k)) continue;
      const op = st.outbox[k], a = acked.get(k);
      if ((op && op.op === 'set') || (a && a.op === 'set' && now - a.at < ACK_MS)) out[e.coll].push({ id: e.id, data: e.data, n: st.order[k] || 0 });
      // otherwise it was deleted on the other phone: leave it out
    }
    for (const [k, a] of acked) if (now - a.at >= ACK_MS || (a.op === 'set') === remoteKeys.has(k)) acked.delete(k);

    for (const c of model.colls) for (const o of out[c]) inOut.add(keyOf(c, o.id));
    const seen = {};
    for (const e of model.toEntities()) { const k = keyOf(e.coll, e.id); if (inOut.has(k)) seen[k] = canon(e.data); }

  return {
    /* the app gives us: db (IndexedDB handle), key, and a model { colls, toEntities(), apply(map) } */
    async start({ db: d, key, model: m }) {

    },
    touch() { if (!st.enabled) return; localDiff(); flush(); emit(); },
    onChange(f) { listeners.push(f); },
    status, pending, enabled: () => st.enabled, user: () => user,
    async signIn(email, pw) { if (!backend) throw Object.assign(new Error('offline'), { code: 'auth/network-request-failed' }); await backend.signIn(email, pw); },
    async signOut() { if (backend) await backend.signOut(); }
  };
})();

    if (!okLat(lat) || !okLon(lon)) return paint('Couldn’t read your location. Kept “' + keep + '”.');
    setStart({ preset: 'geo', lat: Math.round(lat * 10000) / 10000, lon: Math.round(lon * 10000) / 10000, label: 'My location' }); paint();
  }, err => paint(err && err.code === 1 ? 'Location is turned off for this app, so I kept “' + keep + '”. You can pick a starting place above.' : 'Couldn’t get your location, so I kept “' + keep + '”.'), { timeout: 10000, maximumAge: 600000 });
}

/* ---------------- events added by hand ---------------- */
function rebuildAndCommit() { rebuildAll(); commit(); }
function customDialog(c) {
  const live = () => Object.values(state.custom).filter(x => !x.deleted).length;
  formDialog({
    title: c ? 'Edit event' : 'Add an event', intro: Sync.user() || (syncOn()) ? 'Both of you will see this event.' : 'Saved on this phone. It is shared once you sign in.',
    fields: [
      { name: 'title', label: 'Title', required: true, value: c && c.title },
      { name: 'date', label: 'Date', type: 'date', required: true, value: c && c.date },
      { name: 'time', label: 'Start time (optional)', type: 'time', value: c ? c.time : '' },
      { name: 'endDate', label: 'End date (optional, for more than one day)', type: 'date', value: c ? c.endDate : '' },
      { name: 'place', label: 'Venue or place', value: c && c.place },
      { name: 'city', label: 'City', value: c && c.city },
      { name: 'cat', label: 'Category', type: 'select', options: CATS.map(([i, l]) => [i, l]), value: c ? c.cat : 'other' },
      { name: 'free', label: 'Free', type: 'checkbox', value: !!(c && c.free) },
      { name: 'priceText', label: 'Price (optional)', value: c && c.priceText, placeholder: 'e.g. $25 or $20–$40' },
      { name: 'url', label: 'Details link (optional)', value: c && c.url, capitalize: 'none', placeholder: 'https://example.com/tickets' },
      { name: 'notes', label: 'Notes (optional)', type: 'textarea', value: c && c.notes }
    ],
    submitLabel: c ? 'Save' : 'Add event',
    onSubmit: v => {
      const title = flat(v.title, 200); if (!title) return 'Give the event a title.';
      if (!isISO(v.date)) return 'Pick a date.';
      if (v.endDate && (!isISO(v.endDate) || v.endDate < v.date)) return 'The end date can’t be before the start date.';
      const url = v.url.trim() ? safeUrl(v.url) : ''; if (v.url.trim() && !url) return 'The details link must start with http or https.';
      if (!c && live() >= CUSTOM_MAX) return `You can add up to ${CUSTOM_MAX} events.`;
      const rec = normCustom({ id: c ? c.id : 'm' + uid(), title, date: v.date, time: v.time, endDate: v.endDate, place: v.place, city: v.city, cat: v.cat, priceText: v.free ? '' : v.priceText, free: v.free, url, notes: v.notes,
        createdBy: c ? c.createdBy : currentWho(), updatedAt: Math.max(nowMs(), c ? (c.updatedAt || 0) + 1 : 0), deleted: false });
      if (!rec) return 'Check the title and date.';
      state.custom[rec.id] = rec; rebuildAndCommit();
      toast(feed.mode === 'demo' ? 'Saved. It will show once real listings are loaded.' : c ? 'Event saved' : 'Event added');
    }
  });
}
async function customMenu(id) {
  const c = state.custom[id]; if (!c || c.deleted) return;
  const r = await askDialog({ title: c.title, buttons: [{ label: 'Cancel', value: 'cancel' }, { label: 'Delete', value: 'delete', kind: 'danger' }, { label: 'Edit', value: 'edit', kind: 'primary' }] });
  if (r === 'edit') return customDialog(c);
  if (r === 'delete') {
    if (!(await confirmBox(`Delete “${c.title}”?`, syncOn() ? 'It will be removed for both of you.' : 'It will be removed from this phone.', 'Delete event'))) return;
    const cur = state.custom[id]; if (!cur) return;
    cur.deleted = true; cur.updatedAt = nowMs(); rebuildAndCommit(); toast('Event deleted');
  }
}

/* ---------------- calendar + planner actions ---------------- */
async function doIcs(id) {
  const e = feed.byId.get(id) || (state.picks[id] && state.picks[id].snapshot.start ? eventFromSnap(id, state.picks[id].snapshot) : null);
  if (!e) return toast('That event isn’t available any more.');
  const r = await deliverFile(`houston-${slug(e.title)}.ics`, buildICS([e]), 'text/calendar');
  if (r !== 'cancelled') toast(r === 'shared' ? 'Calendar file shared' : 'Calendar file saved to your downloads');
}
async function doExportGoing() {
  const list = savedEntries('going', 'mine').list.filter(x => x.mine === 'going' && !x.past).map(x => x.e);
  if (!list.length) return toast('Nothing marked Going yet.');
  const r = await deliverFile(`houston-going-${centralDay(nowMs())}.ics`, buildICS(list), 'text/calendar');
  if (r !== 'cancelled') toast(r === 'shared' ? 'Calendar file shared' : 'Calendar file saved to your downloads');
}

/* ---------------- backup / restore ---------------- */
async function doExport() {
  const pass = ($('#bkPass') || {}).value || '', pass2 = ($('#bkPass2') || {}).value || '';
  if (pass) {
    if (pass.length < 8) return toast('Use at least 8 characters for the passphrase.');
    if (pass !== pass2) return toast('The two passphrases don’t match.');
  }
  const btn = $('[data-action="export"]'); if (btn) btn.disabled = true;
  try {
    const text = await Backup.build({ appId: APP_ID, schema: SCHEMA, data: exportData(), passphrase: pass || null });
    const r = await deliverFile(`goobs-houston-backup-${todayISO()}${pass ? '-encrypted' : ''}.json`, text, 'application/json');
    if (r !== 'cancelled') {
      state.meta.lastBackup = new Date().toISOString();
      await persist({ touch: false });
      render();
      toast(r === 'shared' ? 'Backup shared' : 'Backup saved to your downloads');
    }
  } catch (e) { toast('Backup failed: ' + e.message); }
  finally { const b2 = $('[data-action="export"]'); if (b2) b2.disabled = false; }
}
async function restoreFromText(text) {
  let parsed;
  try { parsed = await Backup.parse(text, { appId: APP_ID, schema: SCHEMA }); }
  catch (e) { await msgBox('Can’t restore that file', e.message); return false; }
  if (!parsed) return false;
  const { data, dropped } = normalizeData(parsed.data);
  const nb = Object.keys(data.picks).length, nc = Object.keys(data.custom).length, liveC = Object.values(state.custom).filter(c => !c.deleted).length, hasLocal = Object.keys(state.picks).length > 0 || liveC > 0;
  const sum = `${plural(nb, 'pick')}, ${plural(nc, 'added event')} and your settings`;
  const when = parsed.exportedAt ? ` Backup made ${fmtDateTime(parsed.exportedAt)}.` : '';
  const skipped = dropped ? ` ${plural(dropped, 'unreadable entry')} will be skipped.` : '';
  const body = `<p>${esc(sum + '.' + when + skipped)}</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps your picks and settings for the backup. <b>Merge</b> adds picks that aren’t here yet and keeps your settings.</p>' : '')
    + (syncOn() ? '<p class="warn">Your picks are shared, so this also changes your shared picks.</p>' : '');
  const choice = await askDialog({
    title: 'Restore this backup?', body,
    buttons: hasLocal
      ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }]
      : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }]
  });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    state.picks = data.picks; state.prefs = data.prefs; state.meta.lastBackup = ts; state.meta.lastChange = ts;
    for (const c of Object.values(state.custom)) if (!data.custom[c.id] && !c.deleted) { c.deleted = true; c.updatedAt = nowMs(); }
    for (const c of Object.values(data.custom)) state.custom[c.id] = { ...c, updatedAt: nowMs() };
    rebuildAll();
    await persist({ touch: false });
    committing = true; try { Sync.touch(); } finally { committing = false; }
    location.hash = '#/'; render(); toast(`Restored ${sum}`); return true;
  }
  if (choice === 'merge') {
    let n = 0;
    for (const [id, p] of Object.entries(data.picks)) { const cur = state.picks[id]; if (!cur || p.updatedAt > cur.updatedAt) { if (!cur) n++; state.picks[id] = p; } }
    let nc2 = 0; for (const c of Object.values(data.custom)) if (!state.custom[c.id]) { state.custom[c.id] = { ...c, updatedAt: nowMs() }; nc2++; }
    rebuildAll(); commit(); toast(`Merged in ${plural(n, 'pick')}` + (nc2 ? ` and ${plural(nc2, 'event')}` : '')); return true;
  }
  return false;
}
async function doRestore() {
  const f = await pickFile(); if (!f) return;
  let text;
  try { text = await readFileText(f); } catch { await msgBox('Couldn’t read that file', 'Try choosing it again.'); return; }
  await restoreFromText(text);
}
async function doWipe() {
  if (!(await confirmBox('Erase your picks and settings?', 'This deletes your picks and the events you added, and resets your settings. Make a backup first if you might want them.' + sharedNote() + (syncOn() ? ' Events you added are removed for both of you.' : ''), 'Erase'))) return;
  const who = state.meta.who, others = state.others, custom = state.custom;
  for (const c of Object.values(custom)) if (!c.deleted) { c.deleted = true; c.updatedAt = nowMs(); }
  state = defaultState(); state.meta.who = who; state.others = others; state.custom = custom; rebuildAll();
  await persist({ touch: false });
  committing = true; try { Sync.touch(); } finally { committing = false; }
  location.hash = '#/'; render(); toast('Erased');
}

/* ---------------- events ---------------- */
function handleAction(a, el) {
  if (a.startsWith('sync-')) return syncAction(a);
  const id = el.dataset.id, v = el.dataset.v;
  switch (a) {
    case 'view': ui.view = v; ui.limit = CHUNK; return render();
    case 'more': ui.limit += CHUNK; return render();
    case 'settings': return openSettings();
    case 'sources': return askDialog({ title: 'Where listings come from', body: `<p class="muted">${esc(updatedLine())}</p>` + sourcesHTML(), buttons: [{ label: 'OK', value: true, kind: 'primary' }] });
    case 'qi': toggleInterest(v); return render();
    case 'qfree': state.prefs.price = state.prefs.price === 'free' ? 'any' : 'free'; savePrefs(); return render();
    case 'qdist': state.prefs.maxMiles = state.prefs.maxMiles === +v ? 0 : +v; savePrefs(); return render();
    case 'reset-filters': resetFilters(); return render();
    case 'pick': return setPick(id, el.dataset.status);
    case 'expand': if (ui.expanded.has(id)) ui.expanded.delete(id); else ui.expanded.add(id); el.classList.toggle('clamp', !ui.expanded.has(id)); return;
    case 'ics': return doIcs(id);
    case 'export-going': return doExportGoing();
    case 'saved-tab': ui.savedTab = v; return render();
    case 'scope': ui.savedScope = v; return render();
    case 'show-past': ui.showPast = true; return render();
    case 'add-event': return customDialog(null);
    case 'custom-menu': return customMenu(id);
    case 'series': { const sid = el.dataset.sid; if (ui.openSeries.has(sid)) ui.openSeries.delete(sid); else ui.openSeries.add(sid); return render(); }
    case 'export': return doExport();
    case 'restore': return doRestore();
    case 'wipe': return doWipe();
    case 'install': return runInstall();
  }
}
app.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const el = e.target.closest('[data-action]');
  if (!el) return;
  handleAction(el.dataset.action, el);
});
app.addEventListener('change', e => {
  if (e.target.id === 'rgFrom' || e.target.id === 'rgTo') {
    ui.range = { from: ($('#rgFrom', app) || {}).value || '', to: ($('#rgTo', app) || {}).value || '' }; ui.limit = CHUNK; render();
  }
});
window.addEventListener('hashchange', render);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (nowMs() - feed.fetchedAt > 600000) refreshFeed().catch(e => console.error(e)); else renderIfSafe(); } });
window.addEventListener('online', () => { refreshFeed().catch(e => console.error(e)); });

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const raw = await idbGet(db, 'state');
      if (raw) {
        try { state = loadState(JSON.parse(raw)); }
        catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged — a copy was kept aside.'); }
      }
    } catch (e) { console.error(e); db = null; }
  }
  Sync.onChange(() => {
    const u = Sync.user(), w = u ? whoFromEmail(u.email) : '';
    if (w && state.meta.who !== w) { state.meta.who = w; persist({ touch: false }); }
    renderIfSafe();
  });
  render();
  Sync.start({ db, key: 'sync', model: syncModel }).catch(e => console.error(e));
  try { await refreshFeed(); } catch (e) { console.error(e); feed.loaded = true; render(); }
  /* the service worker may answer with a saved copy first and refresh it in the background: look again shortly after */
  if (navigator.serviceWorker && navigator.serviceWorker.controller) setTimeout(() => { refreshFeed().catch(() => {}); }, 2500);
})();
</script>
