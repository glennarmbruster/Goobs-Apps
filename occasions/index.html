<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Occasions</title>
<meta name="description" content="Birthdays, anniversaries and events with countdowns, plus gift ideas and sizes per person. Data stays on your device.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fbf4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Occasions">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--bg:#fbf4f7;--accent:#be185d;--accent-soft:#fce7f1}
@media (prefers-color-scheme:dark){:root{--bg:#0e1311;--accent:#f472b6;--accent-ink:#2d0518;--accent-soft:#3a1428}}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.row .btn{flex:none}
.card.list{overflow:hidden}
.dt{flex:none;width:46px;text-align:center;border-radius:10px;background:var(--soft);padding:4px 0}
.dt .m{font-size:11px;text-transform:uppercase;font-weight:700;color:var(--muted);letter-spacing:.04em}
.dt .d{font-size:20px;font-weight:700;line-height:1.1}
.row.today{background:var(--accent-soft)}
.row.today .dt{background:var(--card)}
.fields3{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:10px}
.rangebar{display:flex;gap:8px;align-items:center;margin:22px 4px 8px}
.rangebar .lbl{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;flex:1}
.toolbar{display:flex;gap:8px;align-items:center;margin:14px 0 4px}
.toolbar .grow{flex:1;min-width:0}
.toolbar select{min-height:40px;padding:6px 10px}
.yr{display:flex;gap:8px;align-items:center;margin:14px 0 4px}
.yr .y{font-weight:700;font-size:18px;min-width:64px;text-align:center}
.kv{display:grid;grid-template-columns:minmax(90px,36%) 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--muted);font-size:13px;font-weight:600;padding-top:1px}
.kv dd{margin:0;overflow-wrap:anywhere}
.person-head{display:flex;gap:8px;align-items:center;margin:12px 0 0}
.person-head .btn{flex:none}
.giftlink{font-size:13px;margin-left:6px}
.sp{height:6px}
textarea.tall{min-height:130px}
@media print{
  header.top,nav.tabs,.toast,dialog,.noprint,.btn{display:none!important}
  html,body{background:#fff!important;color:#000!important;padding:0!important}
  .card{box-shadow:none;border-color:#999}
}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="grow"><h1 id="title">Upcoming</h1><div class="sub" id="sub"></div></div><button type="button" class="btn small primary hide" id="addBtn">+ Add</button></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="upcoming"><span class="ico">🎂</span>Upcoming</button>
  <button type="button" data-tab="people"><span class="ico">👥</span>People</button>
  <button type="button" data-tab="gifts"><span class="ico">🎁</span>Gifts</button>
  <button type="button" data-tab="backup"><span class="ico">💾</span>Backup</button>
</div></nav>
<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);
}

/* ---- dialogs ---- */
if (!$('#dlg')) document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg"></dialog><dialog id="ask"></dialog>');
{
  const dlg = $('#dlg'); let down = false;
  dlg.addEventListener('pointerdown', e => { down = e.target === dlg; });
  dlg.addEventListener('click', e => { if (e.target === dlg && down) dlg.close(); });
}

function fieldHTML(f) {
  const id = 'f_' + f.name, v = f.value ?? '';
  if (f.type === 'checkbox')
    return `<div class="field check"><input type="checkbox" id="${id}" name="${f.name}"${f.value ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label></div>`;
  let ctl;
  if (f.type === 'select') {
    ctl = `<select id="${id}" name="${f.name}">${f.options.map(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    ctl = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
  } else {
    const t = f.type || 'text';
    const extra = t === 'number' ? ` inputmode="decimal" step="${f.step || 'any'}"` : '';
    ctl = `<input id="${id}" name="${f.name}" type="${t}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}"${extra}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''} autocomplete="${f.autocomplete || 'off'}" autocapitalize="${f.capitalize || (t === 'email' || t === 'password' ? 'none' : 'sentences')}">`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

/* formDialog: fields -> values. onSubmit(values) may return an error string (keeps dialog open).
   onDelete() may return true to close. extra: [{label, kind, onClick}] extra buttons. */
function formDialog({ title, intro = '', fields, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extra = [], onClose, grid = '' }) {
  const dlg = $('#dlg');
  const body = grid ? `<div class="${grid}">${fields.map(fieldHTML).join('')}</div>` : fields.map(fieldHTML).join('');
  dlg.innerHTML = `<form class="dlg-form" novalidate>
    <h2>${esc(title)}</h2>${intro ? `<p class="muted">${esc(intro)}</p>` : ''}${body}
    <div class="dlg-err" role="alert"></div>
    <div class="dlg-actions">
      ${onDelete ? `<button type="button" class="btn danger" data-k="del">${esc(deleteLabel)}</button>` : ''}
      ${extra.map((x, i) => `<button type="button" class="btn ${x.kind || ''}" data-x="${i}">${esc(x.label)}</button>`).join('')}
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-k="cancel">Cancel</button>
      <button type="submit" class="btn primary">${esc(submitLabel)}</button>
    </div></form>`;
  const form = $('form', dlg), err = $('.dlg-err', dlg);
  const collect = () => {
    const vals = {};
    for (const f of fields) { const el = form.elements[f.name]; vals[f.name] = f.type === 'checkbox' ? el.checked : el.value; }
    return vals;
  };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const vals = collect();
    for (const f of fields) if (f.required && !String(vals[f.name]).trim()) { err.textContent = `${f.label} is required.`; return; }
    err.textContent = '';
    let msg;
    try { msg = await onSubmit(vals); } catch (ex) { msg = ex.message || 'Something went wrong.'; }
    if (msg) err.textContent = msg; else dlg.close();
  });
  $('[data-k="cancel"]', dlg).onclick = () => dlg.close();
  if (onDelete) $('[data-k="del"]', dlg).onclick = async () => { if (await onDelete()) dlg.close(); };
  $$('[data-x]', dlg).forEach(b => { b.onclick = () => extra[+b.dataset.x].onClick(collect()); });
  dlg.onclose = () => { dlg.onclose = null; if (onClose) onClose(); };
  dlg.showModal();
  const first = form.querySelector('input:not([type=checkbox]),textarea');
  if (first && !first.value) first.focus(); // new-item forms open ready to type; edit forms don't pop the keyboard
}

function askDialog({ title, body = '', buttons }) {
  return new Promise(resolve => {
    const d = $('#ask'); let done = false;
    d.innerHTML = `<div class="dlg-form"><h2>${esc(title)}</h2>${body ? `<div class="ask-body">${body}</div>` : ''}

const Backup = {

    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };

/* ---- import: name, MM/DD[/YYYY], relationship ---- */
function parseImport(text) {
  const rows = [], errors = [];
  str(text).split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith('#')) return;
    const parts = line.split(/\t|,/).map(s => s.trim().replace(/^"(.*)"$/, '$1'));
    const name = parts[0].slice(0, 100);
    if (!name) return errors.push({ line: i + 1, why: 'no name' });
    if (parts.length < 2 || !parts[1]) return errors.push({ line: i + 1, why: 'no date' });
    let m, d, y = 0, r;
    if ((r = /^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{4}))?$/.exec(parts[1]))) { m = +r[1]; d = +r[2]; y = r[3] ? +r[3] : 0; }
    else if ((r = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(parts[1]))) { y = +r[1]; m = +r[2]; d = +r[3]; }
    else return errors.push({ line: i + 1, why: 'date must be MM/DD or MM/DD/YYYY' });
    if (!validMD(m, d)) return errors.push({ line: i + 1, why: 'not a real date' });
    if (y && (y < 1900 || y > thisYear() || (m === 2 && d === 29 && !isLeap(y)))) return errors.push({ line: i + 1, why: 'bad year' });
    rows.push({ name, bMonth: m, bDay: d, bYear: y, relationship: parts.slice(2).join(', ').slice(0, 60) });
  });
  return { rows, errors };
}
function importDialog() {
  const show = text => {
    const { rows, errors } = parseImport(text);
    const el = $('#dlg .dlg-err');
    el.textContent = errors.length ? `${plural(rows.length, 'line')} OK. Skipped: ` + errors.slice(0, 5).map(x => `line ${x.line} (${x.why})`).join('; ') + (errors.length > 5 ? ` and ${errors.length - 5} more` : '') : (rows.length ? `${plural(rows.length, 'line')} ready to import.` : '');
    return { rows, errors };
  };
  formDialog({
    title: 'Import people', intro: 'One person per line: name, MM/DD or MM/DD/YYYY, relationship. People already here with the same name and birthday are skipped.',
    fields: [{ name: 'text', label: 'Paste lines', type: 'textarea', placeholder: 'Cindy, 03/14/1971, wife\nBryan, 08/02/2001, son\nDana Reyes, 11/30, coworker', required: true }],
    submitLabel: 'Import',
    extra: [{ label: 'Check', onClick: v => show(v.text) }],
    onSubmit: v => {
      const { rows, errors } = parseImport(v.text);
      if (!rows.length) return errors.length ? `Nothing to import. ${errors[0] ? `Line ${errors[0].line}: ${errors[0].why}.` : ''}` : 'Nothing to import.';
      let added = 0, dup = 0, over = 0;
      for (const r of rows) {
        if (state.people.some(p => p.name.toLowerCase() === r.name.toLowerCase() && p.bMonth === r.bMonth && p.bDay === r.bDay)) { dup++; continue; }
        if (state.people.length >= MAX_PEOPLE) { over++; continue; }
        state.people.push(normPerson(r)); added++;
      }
      commit();
      toast(`Imported ${nPeople(added)}` + (dup ? `, ${dup} already here` : '') + (errors.length ? `, ${errors.length} skipped` : '') + (over ? `, ${over} over the limit` : ''));
    }
  });
  const t = $('#f_text'); if (t) { t.classList.add('tall'); t.addEventListener('input', () => { $('#dlg .dlg-err').textContent = ''; }); }
}

/* ---- text / CSV ---- */
function upcomingText(days = 30) {
  const t = todayISO(), list = genOcc(t, addDays(t, days)).filter(o => !isDone(o));
  const head = `Upcoming ${days} days (from ${fmtDate(t)})`;
  if (!list.length) return head + '\nNothing coming up.';
  return head + '\n' + list.map(o => {
    const det = occDetail(o).filter(x => x !== 'observed Feb 28');
    return `${fmtDate(o.date)} (${when(daysBetween(t, o.date))}): ${o.title}${det.length ? ' — ' + det.join(', ') : ''}`;
  }).join('\n');
}
async function copyText(text, what) {
  try { await navigator.clipboard.writeText(text); toast(`${what} copied`); return; } catch { /* fall through to manual copy */ }
  await askDialog({ title: `Copy ${what.toLowerCase()}`, body: `<textarea readonly rows="8" id="copyArea">${esc(text)}</textarea>`, buttons: [{ label: 'Done', value: true, kind: 'primary' }] });
}
const flatDetails = a => a.map(d => (d.v ? `${d.k}: ${d.v}` : d.k)).join('; ');
async function doCsv(which) {

    if (!state.people.length) return toast('No people to export yet.');
    rows = [['Name', 'Relationship', 'Birthday', 'Archived', 'Sizes & preferences', 'Notes'], ...[...state.people].sort(sortName).map(p =>
      [p.name, p.relationship, p.bMonth ? `${pad(p.bMonth)}/${pad(p.bDay)}${p.bYear ? '/' + p.bYear : ''}` : '', p.archived ? 'yes' : '', flatDetails(p.details), p.notes.replace(/\s*\n\s*/g, ' ')])];
    name = 'occasions-people';

    rows = [['Person', 'Gift', 'Status', 'Occasion', 'Year', 'Price', 'Link', 'Notes'], ...[...state.gifts].sort((a, b) => b.year - a.year || (personById(a.personId)?.name || '').localeCompare(personById(b.personId)?.name || '') || a.title.localeCompare(b.title)).map(g =>
      [personById(g.personId)?.name || '', g.title, STATUS_LABEL[g.status], occLabel(g), g.year, g.price ? g.price.toFixed(2) : '', g.url, g.notes.replace(/\s*\n\s*/g, ' ')])];
    name = 'occasions-gifts';

  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');

const emptyHTML = () => `<div class="empty"><div class="big">🎂</div><h2>Nothing here yet</h2>

function occRow(o, today) {
  const diff = daysBetween(today, o.date), done = isDone(o), dd = parseISO(o.date);
  const urgent = !done && diff >= 0 && diff <= o.lead;
  const cls = done ? 'ok' : diff < 0 ? 'bad' : urgent ? 'warn' : '';
  const bits = occDetail(o), g = giftSummary(o);
  const sub = [...bits, g].filter(Boolean).map(esc).join(' · ');
  const cd = done ? '✓ done' : when(diff);
  return `<li class="row ${done ? 'faded' : ''} ${diff === 0 && !done ? 'today' : ''}" data-action="open-occ" data-kind="${o.kind}" data-id="${esc(o.refId)}">
    <div class="dt"><div class="m">${esc(MONTHS[dd.getMonth()])}</div><div class="d">${dd.getDate()}</div></div>
    <div class="row-main"><div class="row-title">${esc(o.title)}</div>
    <div class="row-sub">${sub ? sub + ' · ' : ''}<span class="${cls}" style="font-weight:600">${esc(cd)}</span></div></div>
    <button type="button" class="btn small ${done ? '' : 'primary'}" data-action="done" data-key="${esc(o.key)}" aria-label="${done ? 'Undo done for' : 'Mark done:'} ${esc(o.title)}">${done ? 'Undo' : 'Done'}</button></li>`;
}
function renderUpcoming() {
  if (!state.people.length && !state.events.length) return storageBannerHTML() + emptyHTML();
  const today = todayISO(), range = state.settings.range;
  const all = genOcc(addDays(today, -GRACE_DAYS), addDays(today, Math.max(range, 30)));
  const df = o => daysBetween(today, o.date);
  const missed = all.filter(o => df(o) < 0 && !isDone(o));
  const todayL = all.filter(o => df(o) === 0), week = all.filter(o => df(o) >= 1 && df(o) <= 7);
  const later = all.filter(o => df(o) > 7 && df(o) <= range);
  const n30 = all.filter(o => df(o) >= 0 && df(o) <= 30 && !isDone(o)).length;
  const open = a => a.filter(o => !isDone(o)).length;
  const list = (arr) => `<ul class="card list">${arr.map(o => occRow(o, today)).join('')}</ul>`;
  const sec = (title, arr) => arr.length ? `<div class="sec-h"><span>${title}</span></div>${list(arr)}` : '';
  const groups = new Map();
  for (const o of later) { const k = o.date.slice(0, 7); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); }
  let laterHTML = '';
  for (const [ym, arr] of groups) {
    const label = parseISO(ym + '-01').toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    laterHTML += `<div class="sec-h"><span>${esc(label)}</span></div>${list(arr)}`;
  }
  return storageBannerHTML() + `
    <div class="tiles">
      <div class="card tile"><div class="lbl">Today</div><div class="val num ${open(todayL) ? 'warn' : ''}">${open(todayL)}</div></div>
      <div class="card tile"><div class="lbl">Next 7 days</div><div class="val num">${open(week)}</div></div>
      <div class="card tile"><div class="lbl">Next 30 days</div><div class="val num">${n30}</div></div>
    </div>
    ${sec('Passed, not marked done', missed)}
    ${sec('Today', todayL)}
    ${sec('Next 7 days', week)}
    ${!todayL.length && !week.length && !missed.length ? '<div class="card pad muted" style="margin-top:14px">Nothing in the next 7 days.</div>' : ''}
    <div class="rangebar"><span class="lbl">Later</span><div class="chips" role="group" aria-label="Range">${RANGES.map(r => `<button type="button" class="chip" aria-pressed="${r === range}" data-action="range" data-v="${r}">${r} days</button>`).join('')}</div></div>
    ${laterHTML || `<div class="card pad muted">Nothing else in the next ${range} days.</div>`}
    <p style="margin-top:14px"><button type="button" class="btn block" data-action="copy30">Copy next 30 days as text</button></p>`;
}
function personRow(p) {
  const nb = nextBirthday(p), id = esc(p.id);
  const sub = [p.relationship, nb ? `${mdLabel(p.bMonth, p.bDay)}${nb.age ? ` · turns ${nb.age}` : ''} · ${when(nb.diff)}` : 'no birthday'].filter(Boolean).map(esc).join(' · ');

function eventRow(e) {
  const t = todayISO(); let date;
  if (e.recurring) { date = obsDate(e.month, e.day, +t.slice(0, 4)); if (date < t) date = obsDate(e.month, e.day, +t.slice(0, 4) + 1); }
  else date = obsDateExact(e.month, e.day, e.year);
  const diff = daysBetween(t, date), p = e.personId && personById(e.personId);
  const sub = [e.recurring ? 'Every year' : 'One time', `${fmtDate(date)} · ${diff >= 0 ? when(diff) : 'past'}`, p && p.name].filter(Boolean).map(esc).join(' · ');
  return `<li class="row ${!e.recurring && diff < 0 ? 'faded' : ''}" data-action="edit-event" data-id="${esc(e.id)}"><div class="row-main"><div class="row-title">${esc(e.title)}</div><div class="row-sub">${sub}</div></div></li>`;
}
function renderPeople() {

    ${arch.length ? `<div class="sec-h"><span>Archived (${arch.length})</span></div><ul class="card list">${arch.map(personRow).join('')}</ul>` : ''}`;
}
const giftSort = (a, b) => STATUSES.findIndex(s => s[0] === a.status) - STATUSES.findIndex(s => s[0] === b.status) || a.title.localeCompare(b.title);
function giftRow(g, showPerson) {
  const p = personById(g.personId), occ = occLabel(g);
  const sub = [showPerson && p ? p.name : '', [occ, g.year].filter(Boolean).join(' '), g.price ? money(g.price) : ''].filter(Boolean).map(esc).join(' · ');
  const nx = NEXT_STATUS[g.status];
  return `<li class="row ${g.status === 'given' ? 'faded' : ''}" data-action="edit-gift" data-id="${esc(g.id)}"><div class="row-main"><div class="row-title">${esc(g.title)}<span class="badge ${g.status === 'idea' ? '' : g.status === 'given' ? 'ok' : 'acc'}">${esc(STATUS_LABEL[g.status])}</span>${aLink(g.url)}</div>
    <div class="row-sub">${sub}${g.notes ? `${sub ? ' · ' : ''}${esc(g.notes.slice(0, 80))}` : ''}</div></div>
    ${nx ? `<button type="button" class="btn small" data-action="adv" data-id="${esc(g.id)}">${esc(STATUS_LABEL[nx])}</button>` : ''}</li>`;
}
function renderPerson(id) {
  const p = personById(id);
  if (!p) { personView = null; return renderPeople(); }
  const t = todayISO(), nb = nextBirthday(p, t);
  const gifts = state.gifts.filter(g => g.personId === p.id);
  const open = gifts.filter(g => g.status !== 'given').sort(giftSort), given = gifts.filter(g => g.status === 'given').sort((a, b) => b.year - a.year || a.title.localeCompare(b.title));
  const spent = y => gifts.filter(g => g.year === y && g.status !== 'idea').reduce((s, g) => s + g.price, 0);
  const y = thisYear(), evs = state.events.filter(e => e.personId === p.id);
  const byYear = new Map();
  for (const g of given) { if (!byYear.has(g.year)) byYear.set(g.year, []); byYear.get(g.year).push(g); }
  const bd = nb ? `${mdLabel(p.bMonth, p.bDay)}${p.bYear ? `, ${p.bYear}` : ''} · ${nb.age ? `turns ${nb.age} ` : ''}${when(nb.diff)}` : 'No birthday set';
  return storageBannerHTML() + `
    <div class="person-head noprint"><button type="button" class="btn small" data-action="back">‹ People</button><span class="grow" style="flex:1"></span><button type="button" class="btn small" data-action="print">Print</button><button type="button" class="btn small" data-action="edit-person" data-id="${esc(p.id)}">Edit</button></div>
    <section class="card pad" style="margin-top:12px"><h3>${esc(p.name)}${p.archived ? '<span class="badge">Archived</span>' : ''}</h3>
      <p class="muted" style="margin-top:4px">${esc([p.relationship, bd].filter(Boolean).join(' · '))}</p>
      ${p.notes ? `<p style="white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px">${esc(p.notes)}</p>` : ''}</section>
    <div class="sec-h"><span>Sizes & preferences</span><button type="button" class="btn small noprint" data-action="edit-details" data-id="${esc(p.id)}">Edit</button></div>
    <section class="card pad">${p.details.length ? `<dl class="kv">${p.details.map(d => `<dt>${esc(d.k)}</dt><dd>${esc(d.v) || '<span class="muted">—</span>'}</dd>`).join('')}</dl>` : '<span class="muted">None yet. Add shirt, shoe and ring sizes, favorites, allergies, gift-card places.</span>'}</section>
    <div class="sec-h"><span>Gift ideas & planned</span><span class="noprint"><button type="button" class="btn small primary" data-action="quick-gift" data-id="${esc(p.id)}">+ Gift idea</button></span></div>
    ${open.length ? `<ul class="card list">${open.map(g => giftRow(g, false)).join('')}</ul>` : '<div class="card pad muted">No open gift ideas.</div>'}
    <p class="hint" style="margin:6px 4px">Spent on ${esc(p.name)} in ${y}: ${money(spent(y))}${p.budget ? ` of ${money(p.budget)} budget` : ''}.</p>
    <div class="sec-h"><span>Gift history</span><span class="noprint"><button type="button" class="btn small" data-action="past-gift" data-id="${esc(p.id)}">+ Past gift</button></span></div>
    ${given.length ? [...byYear].map(([yr, arr]) => `<div class="hint" style="margin:8px 4px 4px;font-weight:700">${yr}</div><ul class="card list">${arr.map(g => giftRow(g, false)).join('')}</ul>`).join('') : '<div class="card pad muted">Nothing given yet. Add past gifts so you don’t repeat them.</div>'}
    ${evs.length ? `<div class="sec-h"><span>Occasions</span></div><ul class="card list">${evs.map(eventRow).join('')}</ul>` : ''}
    <p class="noprint" style="margin-top:14px"><button type="button" class="btn block" data-action="add-event-for" data-id="${esc(p.id)}">+ Occasion for ${esc(p.name)}</button></p>`;
}
function renderGifts() {
  if (!state.people.length) return storageBannerHTML() + emptyHTML();
  const inScope = g => (!gYear || g.year === gYear) && (!gPerson || g.personId === gPerson);
  const scoped = state.gifts.filter(inScope);
  const spent = scoped.filter(g => g.status !== 'idea').reduce((s, g) => s + g.price, 0), planned = scoped.filter(g => g.status === 'idea').reduce((s, g) => s + g.price, 0);
  const shown = scoped.filter(g => gStatus === 'all' || (gStatus === 'open' ? g.status !== 'given' : g.status === 'given'));
  const byP = new Map();
  for (const g of shown) { if (!byP.has(g.personId)) byP.set(g.personId, []); byP.get(g.personId).push(g); }
  const people = [...byP.keys()].map(personById).filter(Boolean).sort(sortName);
  const bud = state.settings.budget, over = bud && gYear && !gPerson && spent > bud;
  let body = '';
  for (const p of people) {
    const arr = byP.get(p.id).sort(giftSort);
    const ps = scoped.filter(g => g.personId === p.id && g.status !== 'idea').reduce((s, g) => s + g.price, 0);
    body += `<div class="sec-h"><span>${esc(p.name)}</span><span class="num">${money(ps)}${gYear && p.budget ? ` / ${money(p.budget)}` : ''}</span></div><ul class="card list">${arr.map(g => giftRow(g, false)).join('')}</ul>`;
  }
  const opts = [['', 'Everyone'], ...[...state.people].sort(sortName).map(p => [p.id, p.name])];
  return storageBannerHTML() + `
    <div class="yr"><button type="button" class="btn small" data-action="gyear" data-v="-1" aria-label="Previous year">‹</button><span class="y num">${gYear || 'All'}</span><button type="button" class="btn small" data-action="gyear" data-v="1" aria-label="Next year" ${gYear ? '' : 'disabled'}>›</button>
      <button type="button" class="chip" aria-pressed="${!gYear}" data-action="gyear" data-v="0">All years</button></div>
    <div class="toolbar"><select id="gPerson" aria-label="Person" class="grow">${opts.map(([v, l]) => `<option value="${esc(v)}"${v === gPerson ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="tiles" style="grid-template-columns:1fr 1fr 1fr">
      <div class="card tile"><div class="lbl">Spent</div><div class="val num ${over ? 'bad' : ''}">${money(spent)}</div></div>
      <div class="card tile"><div class="lbl">Ideas (est.)</div><div class="val num">${money(planned)}</div></div>
      <div class="card tile" data-action="budget" style="cursor:pointer"><div class="lbl">${bud && gYear && !gPerson ? 'Left of ' + money(bud) : 'Budget'}</div><div class="val num ${over ? 'bad' : ''}">${bud && gYear && !gPerson ? money(bud - spent) : bud ? money(bud) : 'Set'}</div></div>
    </div>
    ${bud && gYear && !gPerson ? `<div class="bar ${over ? 'over' : ''}" style="margin:-4px 0 10px"><i style="width:${Math.min(100, Math.round(spent / bud * 100))}%"></i></div>` : ''}
    <div class="chips" role="group" aria-label="Status filter">${[['open', 'Open'], ['given', 'Given'], ['all', 'All']].map(([v, l]) => `<button type="button" class="chip" aria-pressed="${gStatus === v}" data-action="gstat" data-v="${v}">${l}</button>`).join('')}</div>
    ${body || `<div class="card pad muted" style="margin-top:14px">${state.gifts.length ? 'No gifts match these filters.' : 'No gifts yet. Tap + Add, or open a person to add ideas and past gifts.'}</div>`}`;
}
function renderBackup() {
  const last = state.meta.lastBackup ? `Last backup: ${esc(fmtDateTime(state.meta.lastBackup))}.` : 'No backup made yet.';
  const canEncrypt = !!(window.crypto && crypto.subtle);
  return storageBannerHTML() + installCardHTML() + `<div class="stack">
    <section class="card pad"><h3>Back up</h3>
      <p class="muted">${last}</p>
      <p>Saves one file with all people, occasions and gifts. On iPhone it opens the share sheet — save it to Files or OneDrive. <b>Never put this file in your GitHub repo.</b></p>
      ${canEncrypt ? `<div class="field"><label for="bkPass">Passphrase (optional — encrypts the file)</label><input id="bkPass" type="password" autocomplete="new-password"></div>
      <div class="field" style="margin-top:8px"><label for="bkPass2">Repeat passphrase</label><input id="bkPass2" type="password" autocomplete="new-password"></div>
      <p class="hint">If you set one, the file can’t be opened without it — not even by me.</p>` : ''}
      <button type="button" class="btn primary block" style="margin-top:12px" data-action="export">Back up now</button></section>
    <section class="card pad"><h3>Restore</h3><p>Pick a backup file made by this app. You’ll choose whether to replace what’s here or merge it in.</p>
      <button type="button" class="btn block" data-action="restore">Choose backup file…</button></section>
    <section class="card pad"><h3>Import & export</h3><p>Import people from pasted lines, or export to Excel or text.</p>
      <div class="stack" style="margin-top:8px">
      <button type="button" class="btn block" data-action="import">Import people (paste lines)</button>
      <button type="button" class="btn block" data-action="csv-people">Export people (CSV)</button>
      <button type="button" class="btn block" data-action="csv-gifts">Export gifts (CSV)</button>
      <button type="button" class="btn block" data-action="copy30">Copy next 30 days as text</button></div></section>
    <section class="card pad"><h3>Danger zone</h3><p>Erases all people, occasions and gifts on this device.</p>
      <button type="button" class="btn danger block" data-action="wipe">Erase everything on this device</button></section>
    <p class="hint" style="text-align:center">Your data lives only on this device. Nothing is sent anywhere. There are no notifications; open the app to see what’s coming.</p></div>`;
}
const TITLES = { upcoming: 'Upcoming', people: 'People', gifts: 'Gifts', backup: 'Backup & restore' };
function render() {
  const y = window.scrollY;
  view.innerHTML = { upcoming: renderUpcoming, people: renderPeople, gifts: renderGifts, backup: renderBackup }[tab]();
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const pv = tab === 'people' && personView && personById(personView);
  const add = $('#addBtn');
  add.classList.toggle('hide', tab === 'backup');
  add.textContent = pv ? '+ Gift' : { upcoming: '+ Occasion', people: '+ Person', gifts: '+ Gift' }[tab] || '+ Add';
  $('#title').textContent = pv ? pv.name : TITLES[tab];
  $('#sub').textContent = pv ? pv.relationship : new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  window.scrollTo(0, y);
}
function go(t) { tab = t; personView = null; render(); window.scrollTo(0, 0); }

/* ---- backup / restore ---- */
async function doExport() {
  const pass = ($('#bkPass') || {}).value || '', pass2 = ($('#bkPass2') || {}).value || '';
  if (pass) {
    if (pass.length < 8) return toast('Use at least 8 characters for the passphrase.');
    if (pass !== pass2) return toast('The two passphrases don’t match.');
  }
  const btn = $('[data-action="export"]'); if (btn) btn.disabled = true;
  try {
    const text = await Backup.build({ appId: APP_ID, schema: SCHEMA, data: exportData(), passphrase: pass || null });
    const r = await deliverFile(`goobs-occasions-backup-${todayISO()}${pass ? '-encrypted' : ''}.json`, text, 'application/json');
    if (r !== 'cancelled') {
      state.meta.lastBackup = new Date().toISOString();
      await persist({ touch: false });
      render();
      toast(r === 'shared' ? 'Backup shared' : 'Backup saved to your downloads');
    }
  } catch (e) { toast('Backup failed: ' + e.message); }
  finally { const b2 = $('[data-action="export"]'); if (b2) b2.disabled = false; }
}
async function restoreFromText(text) {
  let parsed;
  try { parsed = await Backup.parse(text, { appId: APP_ID, schema: SCHEMA }); }
  catch (e) { await msgBox('Can’t restore that file', e.message); return false; }
  if (!parsed) return false;
  const { data, dropped } = normalizeData(parsed.data);
  if (!data.people.length && !data.events.length && !data.gifts.length) { await msgBox('Nothing to restore', 'That backup has no people, occasions or gifts in it.'); return false; }
  const hasLocal = state.people.length > 0 || state.events.length > 0 || state.gifts.length > 0;
  const sum = `${nPeople(data.people.length)}, ${plural(data.events.length, 'occasion')} and ${plural(data.gifts.length, 'gift')}`;
  const whenS = parsed.exportedAt ? ` Backup made ${fmtDateTime(parsed.exportedAt)}.` : '';
  const skipped = dropped ? ` ${plural(dropped, 'unreadable item')} will be skipped.` : '';
  const body = `<p>${esc(sum + '.' + whenS + skipped)}</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps everything here for the backup. <b>Merge</b> adds what isn’t here yet and keeps the rest.</p>' : '');
  const choice = await askDialog({
    title: 'Restore this backup?', body,
    buttons: hasLocal
      ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }]
      : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }]
  });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    Object.assign(state, data);
    state.meta.lastBackup = ts; state.meta.lastChange = ts; personView = null;
    await persist({ touch: false });
    render(); toast(`Restored ${sum}`); return true;
  }
  if (choice === 'merge') {
    const pids = new Set(state.people.map(p => p.id)), eids = new Set(state.events.map(e => e.id)), gids = new Set(state.gifts.map(g => g.id));
    let np = 0, ne = 0, ng = 0;
    for (const p of data.people) if (!pids.has(p.id) && state.people.length < MAX_PEOPLE) { state.people.push(p); pids.add(p.id); np++; }
    for (const e of data.events) if (!eids.has(e.id) && state.events.length < MAX_EVENTS) { state.events.push(e.personId && !pids.has(e.personId) ? { ...e, personId: '' } : e); ne++; }
    for (const g of data.gifts) if (!gids.has(g.id) && pids.has(g.personId) && state.gifts.length < MAX_GIFTS) { state.gifts.push(g); ng++; }
    state.done = normDone({ ...state.done, ...data.done });
    await persist(); render(); toast(`Merged in ${nPeople(np)}, ${plural(ne, 'occasion')} and ${plural(ng, 'gift')}`); return true;
  }
  return false;
}
async function doRestore() {
  const f = await pickFile(); if (!f) return;
  let text;
  try { text = await readFileText(f); } catch { await msgBox('Couldn’t read that file', 'Try choosing it again.'); return; }
  await restoreFromText(text);
}
async function doWipe() {
  if (!(await confirmBox('Erase everything?', 'This permanently deletes all people, occasions and gifts on this device. Make a backup first if you might want them.', 'Erase everything'))) return;
  state = defaultState(); personView = null;
  await persist({ touch: false });
  render(); toast('Everything erased');
}

/* ---- wiring ---- */
view.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'add-person': personDialog(); break;
    case 'edit-person': personDialog(id); break;
    case 'edit-details': detailsDialog(id); break;
    case 'open-person': personView = id; render(); window.scrollTo(0, 0); break;
    case 'back': personView = null; render(); window.scrollTo(0, 0); break;
    case 'open-occ': if (el.dataset.kind === 'birthday') { tab = 'people'; personView = id; render(); window.scrollTo(0, 0); } else eventDialog(id); break;
    case 'add-event': eventDialog(); break;
    case 'add-event-for': eventDialog(null, { personId: id }); break;
    case 'edit-event': eventDialog(id); break;
    case 'done': toggleDone(el.dataset.key); break;
    case 'range': state.settings.range = +el.dataset.v; commit(); break;
    case 'quick-gift': { const p = personById(id), nb = p && nextBirthday(p); giftDialog(null, { personId: id, occasion: nb ? 'birthday' : '', year: nb ? nb.year : thisYear() }); break; }
    case 'past-gift': giftDialog(null, { personId: id, status: 'given', occasion: 'birthday', year: thisYear() - 1 }); break;
    case 'edit-gift': giftDialog(id); break;
    case 'adv': { const g = giftById(id); if (g) advanceGift(g); break; }
    case 'gyear': { const v = +el.dataset.v; gYear = v === 0 ? 0 : (gYear || thisYear()) + v; render(); break; }
    case 'gstat': gStatus = el.dataset.v; render(); break;
    case 'budget': budgetDialog(); break;
    case 'import': importDialog(); break;
    case 'csv-people': doCsv('people'); break;
    case 'csv-gifts': doCsv('gifts'); break;
    case 'copy30': copyText(upcomingText(30), 'Upcoming 30 days'); break;
    case 'print': window.print(); break;
    case 'export': doExport(); break;
    case 'restore': doRestore(); break;
    case 'wipe': doWipe(); break;
    case 'install': runInstall(); break;
  }
});
view.addEventListener('change', e => { if (e.target.id === 'gPerson') { gPerson = e.target.value; render(); } });
$('#addBtn').onclick = () => {
  if (tab === 'upcoming') eventDialog();
  else if (tab === 'people') { if (personView) giftDialog(null, { personId: personView }); else personDialog(); }
  else if (tab === 'gifts') giftDialog(null, { personId: gPerson, year: gYear || thisYear() });
};
$$('nav.tabs button').forEach(b => { b.onclick = () => go(b.dataset.tab); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dialog[open]')) render(); });

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const raw = await idbGet(db, 'state');
      if (raw) {
        try { state = loadState(JSON.parse(raw)); }
        catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged — a copy was kept aside.'); }
      }
    } catch (e) { console.error(e); db = null; }
  }
  render();
})();
</script>
</body>
</html>
