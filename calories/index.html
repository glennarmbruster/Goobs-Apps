<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calorie Lookup</title>
<meta name="description" content="Calories and full nutrition for almost any food, drink, liquor, condiment or fast-food item, with steak by grade (select, choice, prime, wagyu). USDA data.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f1f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calorie Lookup">

<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--bg:#f1f7f4;--accent:#047857;--accent-ink:#fff;--accent-soft:#d5f0e4;--line:#dbe6e0;--soft:#e8f0ec}
@media (prefers-color-scheme:dark){:root{--bg:#0c1512;--card:#14201b;--line:#25352e;--soft:#1a2923;--accent:#5fd3a5;--accent-ink:#04291b;--accent-soft:#163a2d}}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.search{margin-top:14px}
.search input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.fine{font-size:13px;color:var(--muted)}
.scroll-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll-chips::-webkit-scrollbar{display:none}
.scroll-chips .chip{flex:none;white-space:nowrap}
.row .kc{font-weight:800;white-space:nowrap;text-align:right;font-size:17px}
.row .kc small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.portion{display:flex;gap:8px;align-items:center;margin-top:12px}
.portion input{width:84px;font:inherit;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.portion select{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.bigcal{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.bigcal b{font-size:44px;line-height:1;letter-spacing:-.02em}
.bigcal span{color:var(--muted);font-weight:600}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.macros div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.macros b{display:block;font-size:20px}
.macros span{font-size:12px;color:var(--muted)}
.mbar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:10px;background:var(--soft)}
.mbar i{display:block;height:100%}
.mbar .p{background:#3b82f6}.mbar .c{background:#f59e0b}.mbar .f{background:#ef4444}.mbar .a{background:#a855f7}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.nf{width:100%;border-collapse:collapse;font-size:15px}
.nf td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.nf tr:first-child td{border-top:0}
.nf td.v{text-align:right;white-space:nowrap;font-weight:600}
.nf td.dv{text-align:right;width:56px;white-space:nowrap;color:var(--muted);font-size:13px;padding-left:8px}
.nf tr.main td:first-child{font-weight:700}
.nf tr.sub td:first-child{padding-left:16px;color:var(--muted)}
.nf tr.thick td{border-top:3px solid var(--ink)}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.src{font-size:12px;color:var(--muted);margin-top:4px}
.star{border:0;background:none;font-size:26px;line-height:1;padding:4px 6px;cursor:pointer;color:var(--muted);min-height:44px;min-width:44px}
.star[aria-pressed="true"]{color:#f59e0b}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-weight:700;font-size:14px;padding:8px 6px;border-radius:9px;color:var(--muted);cursor:pointer;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stbl{width:100%;border-collapse:collapse;font-size:15px}
.stbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:6px 4px;font-weight:700}
.stbl th:first-child{text-align:left}
.stbl td{padding:11px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.stbl td:first-child{text-align:left;white-space:normal;font-weight:700}
.stbl td.k{font-weight:800;font-size:17px}
.stbl tr{cursor:pointer}
.stbl td small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.gbar{height:6px;border-radius:999px;background:var(--accent);margin-top:5px;opacity:.75}
.orow{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;padding:11px 14px;cursor:pointer}
.orow:first-child{border-top:0}
.mealbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:#fff;background:var(--accent);border:0;border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow)}
.mealbtn b{display:block;font-size:18px}.mealbtn span{font-size:13px;opacity:.9}.mealbtn .big{font-size:30px}
.crit{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.crit button{display:flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:15px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
.crit button .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.crit button[aria-checked="true"]{border-color:var(--accent);background:var(--soft)}
.crit button[aria-checked="true"] .box{background:var(--accent);border-color:var(--accent);color:#fff}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer}
.mrow:first-child{border-top:0}
.mrow .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.mrow[aria-checked="true"] .dot{border-color:var(--accent)}
.mrow[aria-checked="true"] .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.mrow .mm{flex:1;min-width:0}.mrow .mt{font-weight:700}.mrow .ms{font-size:13px;color:var(--muted)}.mrow .ms b{color:var(--ink)}
.mrow .info{flex:none;border:0;background:none;color:var(--accent);font:inherit;font-weight:700;font-size:13px;padding:8px 4px;cursor:pointer;min-height:40px}
.mtot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.mtot div{background:var(--soft);border-radius:12px;padding:10px 6px;text-align:center}.mtot b{display:block;font-size:19px}.mtot span{font-size:12px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:8px 0;cursor:pointer;min-height:40px}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.keyrow{display:flex;gap:8px;margin-top:8px}
.keyrow input{flex:1;min-width:0;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="grow"><h1 id="title">Calorie Lookup</h1><div class="sub" id="sub"></div></div></div></header>
<main class="wrap" id="view"><div class="loading">Loading foods…</div></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="foods"><span class="ico">🔎</span>Foods</button>
  <button type="button" data-tab="steak"><span class="ico">🥩</span>Steak</button>
  <button type="button" data-tab="drinks"><span class="ico">🍸</span>Drinks</button>
  <button type="button" data-tab="cruise"><span class="ico">🚢</span>Cruise</button>
  <button type="button" data-tab="saved"><span class="ico">⭐</span>Saved</button>
</div></nav>
<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

function fieldHTML(f) {
  const id = 'f_' + f.name, v = f.value ?? '';
  if (f.type === 'checkbox')
    return `<div class="field check"><input type="checkbox" id="${id}" name="${f.name}"${f.value ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label></div>`;
  let ctl;
  if (f.type === 'select') {
    ctl = `<select id="${id}" name="${f.name}">${f.options.map(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    ctl = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
  } else {
    const t = f.type || 'text';
    const extra = t === 'number' ? ` inputmode="decimal" step="${f.step || 'any'}"` : '';
    ctl = `<input id="${id}" name="${f.name}" type="${t}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}"${extra}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''} autocomplete="${f.autocomplete || 'off'}" autocapitalize="${f.capitalize || (t === 'email' || t === 'password' ? 'none' : 'sentences')}">`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

/* formDialog: fields -> values. onSubmit(values) may return an error string (keeps dialog open).
   onDelete() may return true to close. extra: [{label, kind, onClick}] extra buttons. */
function formDialog({ title, intro = '', fields, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extra = [], onClose, grid = '' }) {
  const dlg = $('#dlg');
  const body = grid ? `<div class="${grid}">${fields.map(fieldHTML).join('')}</div>` : fields.map(fieldHTML).join('');
  dlg.innerHTML = `<form class="dlg-form" novalidate>
    <h2>${esc(title)}</h2>${intro ? `<p class="muted">${esc(intro)}</p>` : ''}${body}
    <div class="dlg-err" role="alert"></div>
    <div class="dlg-actions">
      ${onDelete ? `<button type="button" class="btn danger" data-k="del">${esc(deleteLabel)}</button>` : ''}
      ${extra.map((x, i) => `<button type="button" class="btn ${x.kind || ''}" data-x="${i}">${esc(x.label)}</button>`).join('')}
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-k="cancel">Cancel</button>
      <button type="submit" class="btn primary">${esc(submitLabel)}</button>
    </div></form>`;
  const form = $('form', dlg), err = $('.dlg-err', dlg);
  const collect = () => {
    const vals = {};
    for (const f of fields) { const el = form.elements[f.name]; vals[f.name] = f.type === 'checkbox' ? el.checked : el.value; }
    return vals;
  };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const vals = collect();
    for (const f of fields) if (f.required && !String(vals[f.name]).trim()) { err.textContent = `${f.label} is required.`; return; }
    err.textContent = '';
    let msg;
    try { msg = await onSubmit(vals); } catch (ex) { msg = ex.message || 'Something went wrong.'; }
    if (msg) err.textContent = msg; else dlg.close();
  });
  $('[data-k="cancel"]', dlg).onclick = () => dlg.close();
  if (onDelete) $('[data-k="del"]', dlg).onclick = async () => { if (await onDelete()) dlg.close(); };
  $$('[data-x]', dlg).forEach(b => { b.onclick = () => extra[+b.dataset.x].onClick(collect()); });
  dlg.onclose = () => { dlg.onclose = null; if (onClose) onClose(); };
  dlg.showModal();
  const first = form.querySelector('input:not([type=checkbox]),textarea');
  if (first && !first.value) first.focus(); // new-item forms open ready to type; edit forms don't pop the keyboard
}

/* ---- backup: optional AES-GCM passphrase encryption (Web Crypto, PBKDF2-SHA256) ---- */
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptPayload(obj, pass) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const iterations = 250000;
  const key = await deriveKey(pass, salt, iterations);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { encrypted: true, kdf: 'PBKDF2-SHA256', iterations, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('Wrong passphrase, or the file is damaged.'); }
}
function promptDecrypt(env) {
  return new Promise(resolve => {
    let result = null;
    formDialog({
      title: 'Encrypted backup', intro: 'Enter the passphrase you chose when you made this backup.',
      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },
      onClose: () => resolve(result)
    });
  });
}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');
    let data;
    if (env.encrypted) {
      if (!(window.crypto && crypto.subtle)) throw new Error('Encrypted backups need a secure (https) connection.');
      if (!(env.iterations >= 1000 && env.iterations <= 2000000) || typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.data !== 'string')
        throw new Error('The encrypted backup is damaged.');
      data = await promptDecrypt(env);
      if (data === null) return null;
    } else data = env.data;
    if (!data || typeof data !== 'object') throw new Error('The backup contains no data.');
    return { data, exportedAt: typeof env.exportedAt === 'string' ? env.exportedAt : null, schemaVersion: env.schemaVersion };
  }
};

/* share sheet when the platform supports sharing files (iPhone), otherwise a normal download */
async function deliverFile(filename, text, mime = 'application/json') {
  const file = new File([text], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; /* otherwise fall back to a download */ }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  return 'downloaded';
}
function pickFile(accept = '.json,application/json') {
  return new Promise(resolve => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = accept; i.style.display = 'none';
    document.body.appendChild(i);
    let done = false;
    const fin = f => { if (done) return; done = true; i.remove(); resolve(f); };
    i.addEventListener('change', () => fin((i.files && i.files[0]) || null));
    i.addEventListener('cancel', () => fin(null));
    i.click();
  });
}
const readFileText = f => (f.text ? f.text() : new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(f); }));

/* nag banner: only when there is data and no recent backup */
function backupNag(meta, hasData) {
  if (!hasData) return null;
  if (!meta.lastBackup) return 'You have data but no backup yet. Make one so you can restore it if this device loses it.';
  const age = (Date.now() - Date.parse(meta.lastBackup)) / 86400000;
  const changed = meta.lastChange && Date.parse(meta.lastChange) > Date.parse(meta.lastBackup) + 1000;
  if (changed && age >= 7) return `Your last backup was ${Math.floor(age)} days ago and you’ve made changes since.`;
  return null;
}

}

/* one row per family (e.g. all the rib eye trims and grades), keeping the best-ranked member */
function collapse(arr) { const seen = new Set(), out = []; for (const f of arr) { const k = isLocalId(f.id) ? 'f' + f.fam : f.id; if (seen.has(k)) continue; seen.add(k); out.push(f); } return out; }
const QUICK = [['', 'All'], ['@chain:McDonald\'s', 'McDonald’s'], ['@chain:Wendy\'s', 'Wendy’s'], ['@chain:Burger King', 'Burger King'], ['@rest', 'Restaurants & fast food'], ['@cond', 'Condiments'], ['@booze', 'Beer, wine & liquor']];
function groupList() {
  if (ui.grp.startsWith('@chain:')) { const c = ui.grp.slice(7); return FOODS.filter(f => f.src === 'menu' && f.mf === c); }

  if (ui.grp === '@cond') return FOODS.filter(isCondiment);

}
function foodsBody() {
  if (ui.q.trim()) {

    const head = `<p class="fine" style="margin:10px 4px 6px">${r.length} ${r.length === 1 ? 'match' : 'matches'} on this phone${lastFix ? ' (closest spelling)' : ''}</p>`;
    const cut = steakCutFor(ui.q);
    return (cut ? `<button type="button" class="card pad" data-action="to-steak" data-v="${cut}" style="display:block;width:100%;text-align:left;font:inherit;color:inherit;margin-top:10px;cursor:pointer"><b>🥩 Compare ${esc(DATA.steak[cut].label.toLowerCase())} by grade</b><div class="fine">Select, choice, prime${['ribeye', 'strip', 'filet'].includes(cut) ? ' and wagyu' : ''}, cooked or raw, any weight →</div></button>` : '') + (r.length ? head + listHTML(r.slice(0, 60)) : `<div class="empty" style="padding:24px 10px"><p>Nothing on this phone matches “${esc(ui.q)}”.</p><p class="fine">Try the USDA online search below, or a simpler word. It’s also been added to <b>Saved › Searched, not found</b>.</p></div>`) + `<div id="online">${onlineHTML()}</div>`;

/* ---------- food detail ---------- */
function renderFood() {
  const f = byId.get(ui.id);
  if (!ui.portion || ui.portion.id !== f.id) { const [u, n] = defaultPortion(f); ui.portion = { id: f.id, u, n }; }
  const opts = portionOptions(f);
  if (!opts.some(o => o[0] === ui.portion.u)) ui.portion.u = opts[0][0];
  const chain = chainOf(f), fast = (isLocalId(f.id) && FASTGROUPS().includes(f.g)) || (f.src === 'fndds' && styleOf(f) !== 'home') || !!chain;
  const src = f.src === 'fdc'
    ? `USDA FoodData Central (${esc(DT_LABEL[f.dt] || f.dt)}), food #${esc(String(f.id).slice(4))}.${f.dt === 'Branded' ? ' Numbers come from the product label as reported to USDA.' : ''}`
    : f.src === 'menu' ? `Official nutrition information from ${esc(f.mf)}, retrieved October 2026.`

      ${styleSwitch(f)}

      <div id="facts">${factsHTML(f)}</div></section>
    ${f.note ? `<section class="card pad"><p class="note" style="margin:0">${esc(f.note)}</p></section>` : ''}

    <p class="src">${src} %DV = percent of the FDA Daily Value for a 2,000-calorie diet.</p>

/* home vs restaurant vs fast food versions of the same dish */
const styleOf = m => { const v = (m.vr || '') + ' ' + m.n; return /restaurant/i.test(v) ? 'rest' : /fast food/i.test(v) ? 'fast' : /^Restaurant, /.test(m.n) ? 'rest' : 'home'; };
function styleSwitch(f) {
  const fam = famOf(f); if (fam.length < 2) return '';
  const by = {}; for (const m of fam) { const st = styleOf(m); if (!by[st]) by[st] = m; }
  if (!by.rest && !by.fast) return '';
  const cur = styleOf(f), lab = { home: 'Home / store', rest: 'Restaurant', fast: 'Fast food' };
  return `<div class="seg" id="style" style="margin-top:12px">${['home', 'rest', 'fast'].filter(k => by[k]).map(k => `<button type="button" data-action="style" data-id="${by[k].id}" aria-pressed="${cur === k}">${lab[k]}</button>`).join('')}</div>`;
}
const kindLabel = m => m.src === 'menu' ? (m.vr || titleOf(m)) : (prettyVar(m.vr) || (m.src === 'fndds' ? 'USDA survey' : 'standard')) + (famOf(m).some(o => o !== m && prettyVar(o.vr) === prettyVar(m.vr)) ? ` (${m.src === 'fndds' ? 'USDA survey' : 'USDA SR28'})` : '');

  const k = kcalOf(f, g), P = amt(f, 'pro', g), C = amt(f, 'carb', g), F = amt(f, 'fat', g), A = alcoholG(f, g);

  const rows = LABEL.map(([key, label, unit, st]) => { const x = amt(f, key, g); return x == null && st === 'sub' ? '' : `<tr class="${st}"><td>${label}</td><td class="v">${fmtN(x, unit)}</td><td class="dv">${dv(key, x)}</td></tr>`; }).join('');

    ${A ? `<p class="note" style="margin:12px 0 0" id="alc">Alcohol: about ${fmtN(A, 'g')} (${stdDrinks(A)}).${f.alc == null && (!f.v || f.v.alc == null) ? ' Estimated from the calories not explained by protein, carbs and fat.' : ''}</p>` : ''}

/* ---------- steak ---------- */
const GRADE = { select: ['Select', 'Least marbling'], choice: ['Choice', 'Most supermarket steak'], all: ['All grades', 'USDA average'], prime: ['Prime', 'Most marbling of USDA grades'], wagyu45: ['Wagyu, marble 4–5', 'Australian, raw only'], wagyu9: ['Wagyu, marble 9', 'Australian, raw only'] };
const GORDER = ['select', 'choice', 'all', 'prime', 'wagyu45', 'wagyu9'];
function renderSteak() {
  const S = DATA.steak, cut = S[ui.cut] ? ui.cut : 'ribeye', c = S[cut], ground = cut === 'ground';
  const oz = isNum(+ui.oz) && +ui.oz > 0 ? +ui.oz : 8, g = oz * 28.3495;
  /* "Menu weight" is the raw weight restaurants list; you eat it cooked. Cooked values are scaled to the cooked weight that
     raw piece becomes, from USDA's own raw/cooked pair for the same cut and grade (protein is kept in cooking). */
  const menu = !ui.cooked, fat = ui.lean ? 'lo' : 'lf';
  const idOf = r => r[r.length - 1];
  const twin = (r, st) => c.rows.find(x => (ground ? x[0] === r[0] && x[1] === st : x[0] === r[0] && x[1] === r[1] && x[2] === st));
  const yieldOf = r => { const raw = twin(r, 'raw'), ck = twin(r, 'cooked'); const a = raw && byId.get(idOf(raw)), b = ck && byId.get(idOf(ck)); return a && b && a.v.pro && b.v.pro ? Math.min(0.95, Math.max(0.55, a.v.pro / b.v.pro)) : null; };
  const line = (label, sub, id, gg) => { const f = byId.get(id); if (!f) return ''; const k = kcalOf(f, gg); return { k, html: (max) => `<tr data-action="open-steak" data-id="${id}" data-oz="${+(gg / 28.3495).toFixed(1)}"><td>${esc(label)}<small>${esc(sub)}</small><div class="gbar" style="width:${Math.max(6, Math.round(k / max * 100))}%"></div></td><td class="k">${k}</td><td>${fmtN(amt(f, 'pro', gg), 'g')}</td><td>${fmtN(amt(f, 'fat', gg), 'g')}</td></tr>` }; };
  const base = c.rows.filter(r => ground ? r[1] === 'cooked' : r[1] === fat && r[2] === 'cooked');
  const rawOnlyRows = c.rows.filter(r => (ground ? r[1] === 'raw' : r[1] === fat && r[2] === 'raw') && !twin(r, 'cooked'));
  const cookedSub = (r, y) => menu ? `≈${fmtN(oz * y)} oz once cooked` : '';
  const build = r => { const y = menu ? yieldOf(r) || 0.75 : 1; const s = cookedSub(r, y);
    return ground ? line(r[0] + ' ground beef', ['patty, broiled', s].filter(Boolean).join(' · '), idOf(r), g * y) : line(GRADE[r[0]][0], [GRADE[r[0]][1], s].filter(Boolean).join(' · '), idOf(r), g * y); };
  const lines = (ground ? base : base.sort((a, b) => GORDER.indexOf(a[0]) - GORDER.indexOf(b[0]))).map(build);
  const rawLines = rawOnlyRows.sort((a, b) => GORDER.indexOf(a[0]) - GORDER.indexOf(b[0])).map(r => line(ground ? r[0] + ' ground beef' : GRADE[r[0]][0], 'raw values at raw weight (USDA has no cooked values)', idOf(r), g));
  const all = [...lines, ...rawLines].filter(Boolean), max = Math.max(1, ...all.map(x => x.k || 0));
  const state = 'cooked';
  return `<div class="stack">
    <div class="scroll-chips" style="padding-top:2px">${Object.keys(S).map(k => `<button type="button" class="chip" data-action="cut" data-v="${k}" aria-pressed="${k === cut}">${esc(S[k].label)}</button>`).join('')}</div>
    <section class="card pad">
      <div class="seg"><button type="button" data-action="st-cooked" data-v="0" aria-pressed="${!ui.cooked}">Menu weight (raw)</button><button type="button" data-action="st-cooked" data-v="1" aria-pressed="${ui.cooked}">Cooked weight</button></div>
      ${ground ? '' : `<div class="seg" style="margin-top:8px"><button type="button" data-action="st-lean" data-v="0" aria-pressed="${!ui.lean}">Eat the fat</button><button type="button" data-action="st-lean" data-v="1" aria-pressed="${ui.lean}">Lean only</button></div>`}
      <div class="portion"><input id="soz" type="number" inputmode="decimal" min="0" step="any" value="${esc(oz)}" aria-label="Ounces"><span style="font-weight:600">${ui.cooked ? 'oz on the plate, cooked' : 'oz as listed on a menu (raw)'}</span></div>
    </section>
    <section class="card pad"><h3 style="margin:0 0 2px">${esc(c.label)}${ground ? ' by lean %' : ' by grade'}</h3>${c.note ? `<p class="fine" style="margin:0 0 6px">${esc(c.note)}</p>` : ''}
      ${lines.filter(Boolean).length ? `<table class="stbl" id="stbl"><thead><tr><th>${ground ? 'Blend' : 'Grade'}</th><th>Cal</th><th>Protein</th><th>Fat</th></tr></thead><tbody>${lines.filter(Boolean).map(x => x.html(max)).join('')}${rawLines.filter(Boolean).map(x => x.html(max)).join('')}</tbody></table>` : `<p class="muted">USDA has no ${state} ${fat === 'lo' ? 'lean-only ' : ''}values for this cut.</p>`}
      <p class="fine" style="margin:10px 0 0">Tap a row for full nutrition. ${ground ? '' : '“Eat the fat” counts the fat cap and marbling; “Lean only” is with the visible fat trimmed off on the plate.'} ${ui.cooked ? 'These are for that many ounces of cooked meat.' : 'Menus list raw weight, so a “16 oz” steak is about 12 oz once cooked; the numbers are for the cooked steak you actually eat.'}</p></section>
    <section class="card pad"><p class="fine" style="margin:0">Grades: <b>Select</b> has the least marbling, <b>Choice</b> is most supermarket steak, <b>Prime</b> has the most marbling of the USDA grades. USDA’s <b>Wagyu</b> data is Australian (marble scores 4–5 and 9), raw only; Japanese A5 isn’t in USDA data. Data: USDA SR28.</p></section>
  </div>`;
}

/* ---------- drinks ---------- */

  ['Beer, seltzer & cider', 'floz', 12, [['Beer', 'Regular beer'], ['Beer, light', 'Light beer'], ['Beer, higher alcohol', 'Higher alcohol beer'], ['Hard seltzer', 'Hard seltzer'], ['Hard cider', 'Hard cider'],
    ['Alcoholic malt beverage', 'Malt beverage'], ['Alcoholic malt beverage, sweetened', 'Malt beverage, sweetened'], ['Michelada', 'Michelada'], [14004, 'Budweiser'], [14007, 'Bud Light'], [14005, 'Budweiser Select'], [14013, 'Light, low carb'], [14305, 'Non-alcoholic beer']]],

function shipOrder() {

/* ---------- Make me a meal (Cruise) ---------- */
/* each restaurant's dishes by course; every ticked box ranks the course's dishes from lowest to highest (per serving),
   the ranks are averaged, and the closest match comes first */
const COURSES = [['included', 'Comes with every entrée'], ['starter', 'Starter'], ['main', 'Main'], ['side', 'Side'], ['dessert', 'Dessert']];
const CRIT = [['kcal', 'Low calorie', 'cal'], ['fat', 'Low fat', 'g fat'], ['na', 'Low sodium', 'mg sodium']];
const courseOf = f => (DATA.course || {})[f.id] || '';
const mealVenues = () => { const sh = curShip(), fs = shipFoods(sh.name); return shipVenues(sh).filter(v => fs.some(f => f.cat === v && courseOf(f))); };
const serving = f => f.m[0] ? f.m[0][0] : 100;
const per = (f, k) => { const v = amt(f, k, serving(f)); return v == null ? null : v; };
function rankCourse(list, crit) {
  if (!crit.length) return list.slice().sort((a, b) => per(a, 'kcal') - per(b, 'kcal'));
  const span = {}; for (const k of crit) { const vs = list.map(f => per(f, k)).filter(v => v != null); span[k] = [Math.min(...vs), Math.max(...vs)]; }
  const score = f => crit.reduce((t, k) => { const v = per(f, k), [lo, hi] = span[k]; return t + (v == null ? 1 : hi > lo ? (v - lo) / (hi - lo) : 0); }, 0) / crit.length;
  return list.map(f => [score(f), f]).sort((a, b) => a[0] - b[0] || per(a[1], 'kcal') - per(b[1], 'kcal')).map(x => x[1]);
}
function mealPlan() {
  const m = ui.meal, crit = CRIT.map(c => c[0]).filter(k => m.c[k]);
  const dishes = shipFoods(curShip().name).filter(f => f.cat === m.v && courseOf(f));
  return COURSES.map(([key, label]) => {
    const list = dishes.filter(f => courseOf(f) === key);
    if (!list.length) return null;
    if (key === 'included') return { key, label, list, chosen: list };
    const ranked = rankCourse(list, crit), p = m.pick[key];
    const chosen = p === 'skip' ? [] : [ranked.find(f => f.id === p) || ranked[0]];
    return { key, label, list: ranked, chosen };
  }).filter(Boolean);
}

  const stat = (f, k, unit) => { const v = per(f, k); const t = v == null ? '—' : `${Math.round(v).toLocaleString()} ${unit}`; return m.c[k] ? `<b>${t}</b>` : t; };

      ${c.list.length > 3 ? `<button type="button" class="linkbtn" data-action="meal-more" data-course="${c.key}">${m.more[c.key] ? 'Show fewer' : `Show all ${c.list.length}`}</button>` : ''}</div>`;

  const lq = q.toLowerCase();
  if (store.misses.some(m => m.q.toLowerCase().startsWith(lq))) return;

  switch (el.dataset.action) {
    case 'open': openFood(id); break;
    case 'open-steak': openFood(id, { u: 'oz', n: +el.dataset.oz || +ui.oz || 8 }); break;
    case 'open-drink': openFood(id, { u: el.dataset.u, n: +el.dataset.n }); break;
    case 'style': { const nf = getFood(id); if (nf) { ui.id = nf.id; ui.portion = null; viewed(nf.id); render(); } break; }
    case 'grp': ui.grp = el.dataset.v; ui.q = ''; render(); break;
    case 'fav': toggleFav(id); break;
    case 'online': runOnline(); break;
    case 'onl-type': ui.onl.brands = el.dataset.v === '1'; ui.onl.results = []; ui.onl.err = ''; ui.onl.q = ''; paintOnline(); if (ui.q.trim()) runOnline(); break;
    case 'cut': ui.cut = el.dataset.v; render(); break;
    case 'venue': ui.venue = el.dataset.v; render(); break;
    case 'ship': ui.ship = el.dataset.v; ui.askShip = ''; store.ship = ui.ship; ui.venue = null; save(); render(); break;
    case 'sail-edit': e.preventDefault(); editSail(); break;
    case 'meal-open': ui.meal = { v: ui.venue && mealVenues().includes(ui.venue) ? ui.venue : (store.meal && store.meal.v) || mealVenues()[0], c: { ...((store.meal && store.meal.c) || {}) }, pick: {}, more: {} }; render(); window.scrollTo(0, 0); break;
    case 'meal-close': ui.meal = null; render(); window.scrollTo(0, 0); break;
    case 'meal-venue': ui.meal.v = el.dataset.v; ui.meal.pick = {}; ui.meal.more = {}; store.meal = { v: ui.meal.v, c: ui.meal.c }; save(); render(); break;
    case 'meal-crit': ui.meal.c[el.dataset.k] = !ui.meal.c[el.dataset.k]; ui.meal.pick = {}; store.meal = { v: ui.meal.v, c: ui.meal.c }; save(); render(); break;
    case 'meal-pick': if (e.target.closest('.info')) break; ui.meal.pick[el.dataset.course] = el.dataset.id === 'skip' ? 'skip' : parseId(el.dataset.id); render(); break;
    case 'meal-more': ui.meal.more[el.dataset.course] = !ui.meal.more[el.dataset.course]; render(); break;
    case 'to-steak': ui.cut = el.dataset.v; go('steak'); break;
    case 'st-cooked': ui.cooked = el.dataset.v === '1'; render(); break;
    case 'st-lean': ui.lean = el.dataset.v === '1'; render(); break;
    case 'miss-search': ui.tab = 'foods'; ui.id = null; ui.stack = []; ui.q = el.dataset.q; ui.grp = ''; render(); break;
    case 'miss-del': store.misses = store.misses.filter(m => m.q !== el.dataset.q); save(); render(); break;
    case 'miss-send': sendMisses(); break;
    case 'miss-clear': confirmBox('Clear the not-found list?', '', 'Clear').then(ok => { if (ok) { store.misses = []; save(); render(); } }); break;
    case 'key-save': store.key = ($('#key').value || '').trim().slice(0, 100); save(); toast(store.key ? 'Key saved' : 'Using the demo key'); render(); break;
    case 'key-clear': e.preventDefault(); store.key = ''; save(); render(); break;
  }
});
view.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button], [role=radio]')) { e.preventDefault(); e.target.click(); } });
view.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    ui.q = t.value; if (ui.q) ui.grp = '';
    $('#res').innerHTML = foodsBody(); $$('#grps .chip').forEach(c => c.setAttribute('aria-pressed', String(!ui.q && c.dataset.v === ui.grp)));
    clearTimeout(missTimer); const q = ui.q; missTimer = setTimeout(() => noteMiss(q), 1500);
  } else if (t.id === 'pn' || t.id === 'pu') {
    ui.portion.n = $('#pn').value === '' ? 0 : +$('#pn').value; ui.portion.u = $('#pu').value; $('#facts').innerHTML = factsHTML(byId.get(ui.id));
  } else if (t.id === 'soz') { ui.oz = t.value; clearTimeout(missTimer); missTimer = setTimeout(() => { const p = t.selectionStart; render(); const s = $('#soz'); if (s) { s.focus(); try { s.setSelectionRange(p, p); } catch (er) {} } }, 400); }
});
view.addEventListener('change', e => {
  if (e.target.id === 'q') { clearTimeout(missTimer); noteMiss(e.target.value); }
  if (e.target.id === 'pu') { ui.portion.u = e.target.value; $('#facts').innerHTML = factsHTML(byId.get(ui.id)); }
  if (e.target.id === 'kind') { const nf = getFood(parseId(e.target.value)); if (nf) { const keep = ui.portion && ['g', 'oz', 'lb'].includes(ui.portion.u) ? { u: ui.portion.u, n: ui.portion.n } : null; ui.id = nf.id; ui.portion = keep ? { id: nf.id, ...keep } : null; viewed(nf.id); render(); } }
});
view.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'q') { e.preventDefault(); e.target.blur(); } });
$('header.top').addEventListener('click', e => { if (e.target.closest('#backLink')) { e.preventDefault(); goBack(); } });
$$('nav.tabs button').forEach(b => { b.onclick = () => go(b.dataset.tab); });

function loadData(json) {
  DATA = json;
  DATA.nut.forEach((k, i) => { NI[k] = i; });
  FOODS = DATA.foods.map(([id, g, n, c, vs, m, mf, note, y, ci, fam, vr]) => {
    const parts = String(vs).split('|'), v = {};
    DATA.nut.forEach((k, i) => { const x = parts[i]; v[k] = x === '' || x == null ? null : +x; });
    return { id, g, n, c: c || '', v, m: m || [], mf: mf || '', note: note || '', y: !!y, cat: ci >= 0 ? DATA.cats[ci] : '', fam, vr: vr || '', ship: id >= 4000000000 ? DATA.groups[g] : '', src: id >= 4000000000 ? 'ship' : id >= 3000000000 ? 'menu' : id > 1000000 ? 'fndds' : 'sr' };
  });
  byId = new Map(FOODS.map(f => [f.id, f]));
  FAM = new Map();
  for (const f of FOODS) { if (!FAM.has(f.fam)) FAM.set(f.fam, []); FAM.get(f.fam).push(f); }
  buildIndex();
}
let FAM = new Map();
/* foods merged away (an older USDA entry replaced by the newer survey one) still resolve */
const getFood = id => byId.get(id) || (DATA && DATA.redir && byId.get(DATA.redir[id])) || null;
const famOf = f => (f && isLocalId(f.id) ? FAM.get(f.fam) || [f] : [f]);
(async function init() {
  try { db = await openDB(DB_NAME); const raw = await idbGet(db, 'state'); if (raw) { const s = JSON.parse(raw); for (const k of ['favs', 'recent', 'misses']) if (Array.isArray(s[k])) store[k] = s[k].slice(0, 300); if (typeof s.key === 'string') store.key = s.key; if (s.meal && typeof s.meal === 'object') store.meal = { v: String(s.meal.v || ''), c: { kcal: !!(s.meal.c || {}).kcal, fat: !!(s.meal.c || {}).fat, na: !!(s.meal.c || {}).na } }; if (s.online && typeof s.online === 'object') store.online = s.online; if (typeof s.ship === 'string') store.ship = s.ship; if (s.sail && typeof s.sail === 'object') for (const [k, d] of Object.entries(s.sail)) if (d && isISO(d.from) && isISO(d.to) && d.to >= d.from) store.sail[k] = { from: d.from, to: d.to }; } }
  catch (e) { console.error(e); }
  try {
    /* the offline copy of foods.json is replaced when a new version of the list ships */
    const FILEV = '0bff24a044f8';
    try { for (const k of await caches.keys()) if (k.startsWith('goobs-calories-')) { const c = await caches.open(k); for (const r of await c.keys()) { const u = new URL(r.url); if (/\/foods\.json$/.test(u.pathname) && u.searchParams.get('v') !== FILEV) await c.delete(r); } } } catch (e) {}
    const res = await fetch('foods.json?v=' + FILEV); if (!res.ok) throw new Error('HTTP ' + res.status);
    loadData(await res.json());
  } catch (e) { view.innerHTML = `<div class="empty"><div class="big">⚠️</div><h2>Couldn’t load the food list</h2><p>${esc(navigator.onLine === false ? 'Open the app once while online so it can save the food list for offline use.' : 'Try again in a moment.')}</p></div>`; return; }
  for (const [id, f] of Object.entries(store.online || {})) if (f && f.v && Array.isArray(f.m)) byId.set(id, { ...f, src: 'fdc' });
  const fix = id => { const f = getFood(id); return f ? f.id : null; };
  store.favs = [...new Set(store.favs.map(fix).filter(x => x != null))]; store.recent = [...new Set(store.recent.map(fix).filter(x => x != null))];
  fromPlanner();
  render();
})();
/* Planner hand-off: ?ship=<ship name>&from=YYYY-MM-DD&to=YYYY-MM-DD&back=1 opens the Cruise tab on that ship and keeps the
   trip's dates (on this phone only). With back=1 the top-left link goes back to the trip instead of to all apps. */
function fromPlanner() {
  let u; try { u = new URL(location.href); } catch { return; }
  const name = (u.searchParams.get('ship') || '').trim().slice(0, 60);
  if (!name) return;
  const from = u.searchParams.get('from') || '', to = u.searchParams.get('to') || '';
  if (isISO(from) && isISO(to) && to >= from) { store.sail = { ...(store.sail || {}), [name]: { from, to } }; save(); }
  ui.tab = 'cruise'; ui.id = null; ui.stack = []; ui.meal = null; ui.venue = null;
  ui.askShip = name; ui.ship = shipsHere().some(x => x.name === name) ? name : null;
  if (u.searchParams.get('back') === '1') ui.backToTrip = true;
}
