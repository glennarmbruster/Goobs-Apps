<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes</title>
<meta name="description" content="Recipes for the kitchen: scale servings, check off ingredients, step-by-step cook mode and timers.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#fbf6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161009" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recipes">

<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--bg:#fbf6f1;--accent:#c2410c;--accent-soft:#fde4d3;--line:#eadfd4;--soft:#f3e9df}
@media (prefers-color-scheme:dark){:root{--bg:#161009;--card:#211810;--line:#3a2c1f;--soft:#2b2017;--accent:#fb923c;--accent-ink:#2b1200;--accent-soft:#3d2512}}
.search{margin:14px 0 10px}
.rwrap{position:relative}
.mealbtn{position:absolute;right:12px;bottom:12px;z-index:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 12px;min-height:32px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.mealbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink,#fff);border-color:var(--accent)}
.rwrap .rcard{padding-bottom:50px}
.mealbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:7;display:flex;gap:10px;align-items:center;background:var(--accent);color:var(--accent-ink,#fff);border-radius:16px;padding:14px 16px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mealbar .go{margin-left:auto;font-weight:700}
.rcard{display:block;padding:14px 16px;text-decoration:none;color:inherit;margin-bottom:10px}
.rcard .tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rcard h2{font-size:17px;overflow-wrap:anywhere}
.rcard .meta{font-size:13px;color:var(--muted);margin-top:4px}
.star{color:#d97706;font-size:18px;line-height:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--muted);border:0;cursor:pointer;font-family:inherit}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.metarow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--soft)}
.scale{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.stepper button{width:44px;height:44px;border:0;background:var(--soft);font:inherit;font-size:22px;font-weight:700;color:var(--ink);cursor:pointer}
.stepper output{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px}
.grp{margin:16px 4px 6px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ing{display:flex;align-items:flex-start;gap:6px;padding:4px 14px 4px 2px;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing label{flex:1;display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0 10px 12px;cursor:pointer}
.ing .amt{font-weight:700;min-width:5.2em;max-width:7.5em;flex:none;font-variant-numeric:tabular-nums}
.ing .nm{flex:1;overflow-wrap:anywhere}
.ing .nt{display:block;font-size:13px;color:var(--muted)}
.ing.on .amt,.ing.on .nm{text-decoration:line-through;color:var(--muted)}
.step{display:flex;gap:12px;padding:14px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;border:0;font-size:15px;cursor:pointer;font-family:inherit}
.step.on .n{background:var(--accent);color:var(--accent-ink)}
.step.on .tx{color:var(--muted)}
.step .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.step .st{font-weight:700;display:block;margin-bottom:2px}
.amt-i{font-weight:700;color:var(--accent)}
.badtok{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:0 5px;font-weight:700}
.tbtn{margin:8px 8px 0 0}
#timerbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));z-index:8;display:flex;flex-direction:column;gap:6px;padding:0 12px;pointer-events:none}
#timerbar:empty{display:none}
.timer{pointer-events:auto;max-width:520px;width:100%;margin:0 auto;display:flex;align-items:center;gap:10px;background:#1b1410;color:#fff;border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.timer b{font-variant-numeric:tabular-nums;font-size:20px}
.timer span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.timer button{min-height:40px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-weight:700;padding:0 12px;cursor:pointer}
.timer.done{background:#b42318;animation:pulse 1s infinite}
@media (prefers-reduced-motion:reduce){.timer.done{animation:none}}
@keyframes pulse{50%{filter:brightness(1.25)}}
.cook{padding:18px 16px 170px}
header.top h1{font-size:18px;line-height:1.2;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cook .big{font-size:24px;line-height:1.4;margin:18px 0 6px}
.cook .big .amt-i{font-size:inherit}
.cookbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.cookbar .wrap{display:flex;gap:10px;padding:0}
.cookbar .btn{flex:1;min-height:56px;font-size:17px}
.notesbox{min-height:130px}
.prose{white-space:pre-wrap;overflow-wrap:anywhere}
.fld{display:flex;flex-direction:column;gap:12px}
.eqchips{display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
textarea.tall{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5}
.tokhint{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.nf{width:100%;border-collapse:collapse;font-size:15px;margin-top:6px}
.nf td{padding:7px 0;border-top:1px solid var(--line);vertical-align:top}
.nf tr:first-child td{border-top:0}
.nf td.v{text-align:right;white-space:nowrap;font-weight:600}
.nf td.dv{text-align:right;width:52px;white-space:nowrap;color:var(--muted);font-size:13px;padding-left:8px}
.nf tr.sub td:first-child{padding-left:16px;color:var(--muted)}
.nf tr.main td:first-child{font-weight:700}
.nbig{display:flex;align-items:baseline;gap:8px;margin-top:6px}.nbig b{font-size:40px;line-height:1}
.nmac{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.nmac div{background:var(--soft);border-radius:12px;padding:9px 6px;text-align:center}.nmac b{display:block;font-size:18px}.nmac span{font-size:12px;color:var(--muted)}
.nrow{display:flex;gap:10px;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.nrow:first-child{border-top:0}
.nrow .r{text-align:right;white-space:nowrap;color:var(--muted)}.nrow .r b{color:var(--ink)}
.nsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--soft);text-decoration:none;color:inherit;font-size:14px}
.nsum b{font-size:16px}.nsum .go{margin-left:auto;color:var(--accent);font-weight:700}
.tokhint code{background:var(--soft);padding:1px 6px;border-radius:6px;color:var(--ink)}
#printArea{display:none}
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;font:12pt/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#000;background:#fff}
  #printArea h1{font-size:22pt;margin:0 0 3pt}
  #printArea h2{font-size:13pt;margin:14pt 0 5pt;border-bottom:1.5pt solid #000;padding-bottom:2pt}
  #printArea .pa-sub{color:#333;margin:0 0 6pt}
  #printArea .pa-cols{columns:2;column-gap:22pt}
  #printArea .pa-ing{break-inside:avoid;margin:0 0 3pt;display:flex;gap:7pt}
  #printArea .pa-box{flex:none;width:9pt;height:9pt;border:1pt solid #000;margin-top:3pt}
  #printArea .pa-g{font-weight:700;margin:8pt 0 3pt;break-after:avoid}
  #printArea ol{margin:0;padding-left:18pt}
  #printArea li{margin:0 0 6pt;break-inside:avoid}
  #printArea .pa-foot{margin-top:16pt;color:#555;font-size:9pt}
}
.steps-help{margin:8px 0 12px;padding-left:22px;line-height:1.45}.steps-help li{margin:6px 0}
</style>

'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }

function openDB(name) {

    const r = indexedDB.open(name, 1);

    tx.objectStore('kv').put(val, key);

    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));

/* ---- backup: optional AES-GCM passphrase encryption (Web Crypto, PBKDF2-SHA256) ---- */
const b64 = buf => { let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

async function deriveKey(pass, salt, iterations) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encryptPayload(obj, pass) {

  const iterations = 250000;
  const key = await deriveKey(pass, salt, iterations);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { encrypted: true, kdf: 'PBKDF2-SHA256', iterations, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}
async function decryptPayload(env, pass) {
  const key = await deriveKey(pass, unb64(env.salt), env.iterations);
  try {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch { throw new Error('Wrong passphrase, or the file is damaged.'); }
}
function promptDecrypt(env) {
  return new Promise(resolve => {
    let result = null;
    formDialog({
      title: 'Encrypted backup', intro: 'Enter the passphrase you chose when you made this backup.',
      fields: [{ name: 'pass', label: 'Passphrase', type: 'password', required: true }], submitLabel: 'Unlock',
      onSubmit: async v => { try { result = await decryptPayload(env, v.pass); } catch (e) { return e.message; } },
      onClose: () => resolve(result)
    });
  });
}
const Backup = {
  async build({ appId, schema, data, passphrase }) {
    const head = { app: appId, schemaVersion: schema, exportedAt: new Date().toISOString() };
    if (passphrase) return JSON.stringify({ ...head, ...(await encryptPayload(data, passphrase)) });
    return JSON.stringify({ ...head, encrypted: false, data }, null, 2);
  },
  /* returns {data, exportedAt, schemaVersion}, or null if the user cancelled the passphrase prompt; throws Error with a friendly message */
  async parse(text, { appId, schema }) {
    let env;
    try { env = JSON.parse(text); } catch { throw new Error('That file isn’t a valid backup (it isn’t JSON).'); }
    if (!env || typeof env !== 'object' || env.app !== appId)
      throw new Error(env && typeof env === 'object' && env.app ? `That backup belongs to a different app (${String(env.app).slice(0, 40)}).` : 'That file isn’t a backup from this app.');
    if (!Number.isInteger(env.schemaVersion) || env.schemaVersion < 1) throw new Error('The backup is missing its version number.');
    if (env.schemaVersion > schema) throw new Error('That backup was made by a newer version of the app. Close and reopen this app to update it, then try again.');
    let data;
    if (env.encrypted) {
      if (!(window.crypto && crypto.subtle)) throw new Error('Encrypted backups need a secure (https) connection.');
      if (!(env.iterations >= 1000 && env.iterations <= 2000000) || typeof env.salt !== 'string' || typeof env.iv !== 'string' || typeof env.data !== 'string')
        throw new Error('The encrypted backup is damaged.');
      data = await promptDecrypt(env);
      if (data === null) return null;
    } else data = env.data;
    if (!data || typeof data !== 'object') throw new Error('The backup contains no data.');
    return { data, exportedAt: typeof env.exportedAt === 'string' ? env.exportedAt : null, schemaVersion: env.schemaVersion };
  }
};

/* share sheet when the platform supports sharing files (iPhone), otherwise a normal download */
async function deliverFile(filename, text, mime = 'application/json') {
  const file = new File([text], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return 'shared'; }
    catch (e) { if (e && e.name === 'AbortError') return 'cancelled'; /* otherwise fall back to a download */ }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  return 'downloaded';
}

function backupNag(meta, hasData) {

  if (!meta.lastBackup) return 'You have data but no backup yet. Make one so you can restore it if this device loses it.';
  const age = (Date.now() - Date.parse(meta.lastBackup)) / 86400000;

  const { data, dropped } = normalizeData(parsed.data);
  if (!data.recipes.length && !Object.keys(data.marks).length) { await msgBox('Nothing to restore', 'That backup has no recipes in it.'); return false; }
  const hasLocal = state.recipes.length > 0 || Object.keys(state.marks).length > 0;
  const sum = plural(data.recipes.length, 'recipe');
  const body = `<p>${esc(sum)}${dropped ? `. ${esc(plural(dropped, 'unreadable entry'))} will be skipped` : ''}.</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps what’s on this phone for the backup. <b>Merge</b> adds recipes that aren’t here yet.</p>' : '');
  const choice = await askDialog({ title: 'Restore this backup?', body, buttons: hasLocal ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }] : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }] });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    state.recipes = data.recipes; state.marks = data.marks; state.meta.lastBackup = ts; state.meta.lastChange = ts;
    await persist({ touch: false }); location.hash = '#/'; render(); toast(`Restored ${sum}`); return true;
  }
  if (choice === 'merge') {
    const have = myIds(); let n = 0;
    for (const r of data.recipes) if (!have.has(r.id) && state.recipes.length < MAX_RECIPES) { state.recipes.push(r); have.add(r.id); n++; }
    for (const [id, m] of Object.entries(data.marks)) if (!state.marks[id]) state.marks[id] = m;
    commit(); toast(`Merged in ${plural(n, 'recipe')}`); return true;
  }
  return false;
}
async function doRestore() {
  const f = await pickFile(); if (!f) return;
  let t; try { t = await readFileText(f); } catch { await msgBox('Couldn’t read that file', 'Try choosing it again.'); return; }
  await restoreFromText(t);
}
/* library file = the library's recipes that aren't hidden or replaced, plus everything of mine */
function libraryFileText() {
  const mine = myIds(), out = [];
  for (const r of LIB.recipes) if (!mine.has(r.id) && !mark(r.id).hidden) out.push(r);
  for (const r of state.recipes) out.push(r);
  out.sort((a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base' }));
  return JSON.stringify({ format: 'goobs-recipe-library', version: 1, exportedAt: new Date().toISOString(), recipes: out.map(recipeJSON) }, null, 2) + '\n';
}
async function libExport() {
  const n = allRecipes().length; if (!n) return toast('There are no recipes to export yet.');
  const r = await deliverFile('library.json', libraryFileText(), 'application/json');
  if (r !== 'cancelled') toast(r === 'shared' ? 'Library file shared' : 'Library file saved to your downloads');
}
const sameRecipe = (a, b) => JSON.stringify(recipeJSON(a)) === JSON.stringify(recipeJSON({ ...b, id: a.id }));
function libTidy() {
  let n = 0;
  state.recipes = state.recipes.filter(r => { const l = LIB.recipes.find(x => x.id === r.id); if (l && sameRecipe(l, r)) { n++; return false; } return true; });
  if (n) commit(); toast(n ? `Removed ${plural(n, 'copy', 'copies')} that are now in the library` : 'Nothing to tidy: no copies match the library yet.');
}
async function doWipe() {
  if (!(await confirmBox('Erase your recipes on this phone?', 'This deletes the recipes you added here, plus your favourites, notes and cooking log. The shared library stays. Make a backup first if you want them back.', 'Erase'))) return;
  state = defaultState(); await persist({ touch: false }); location.hash = '#/'; render(); toast('Erased');
}

/* ===================== events ===================== */
function handleAction(a, el) {
  const rt = route(), r = rt.r, id = r && r.id;
  switch (a) {
    case 'add': return addMenu();
    case 'cat': ui.cat = el.dataset.cat; return render();
    case 'export': return doExport();
    case 'restore': return doRestore();
    case 'wipe': return doWipe();
    case 'install': return runInstall();
    case 'lib-refresh': return loadLibrary().then(src => { render(); toast(LIB.error || (src === 'none' && !LIB.recipes.length ? 'There is no library file in the project yet.' : `Library has ${plural(LIB.recipes.length, 'recipe')}`)); });
    case 'lib-export': return libExport();
    case 'lib-tidy': return libTidy();
    case 'meal-toggle': return toggleMeal(el.dataset.id);
    case 'meal-clear': state.meal = []; persist(); location.hash = '#/'; return render();
    case 'meal-pick': ui.cat = el.dataset.cat; ui.q = ''; location.hash = '#/'; return render();
    case 'meal-grocery': return toGrocery(mealRecipes(), 'the meal’s ingredients');
    case 'meal-copy': return copyText(mealRecipes().map(r => recipeText(r, factorOf(r))).join('\n\n————————\n\n'), 'Meal copied as text');
    case 'unhide': setMark(el.dataset.id, { hidden: false }); return commit();
    case 'timer-x': timers = timers.filter(t => t.id !== el.dataset.id); saveTimers(); return renderTimers();
    case 'timer-add': { const t = timers.find(x => x.id === el.dataset.id); if (t) { t.end += 60000; t.total += 60; saveTimers(); renderTimers(); } return; }
    case 'timer': return startTimer(+el.dataset.s, el.dataset.label);
  }
  if (rt.name !== 'recipe' || !r) return;
  const m = mark(id), togg = (list, i) => (list.includes(i) ? list.filter(x => x !== i) : [...list, i]);
  switch (a) {
    case 'fav': setMark(id, { fav: !m.fav }); return commit();
    case 'n-whole': ui.nWhole = el.dataset.x === '1'; return render();
    case 'n-salt': setNPrefs({ salt: el.dataset.v }); return render();
    case 'n-opt': setNPrefs({ opt: !!el.checked }); return render();
    case 'more': return moreMenu(r, rt.src);
    case 'srv+': case 'srv-': { const cur = servingsOf(r), next = a === 'srv+' ? cur + (cur >= 1 ? 1 : 0.5) : Math.max(0.5, cur - (cur > 1 ? 1 : 0.5)); setMark(id, { servings: Math.abs(next - r.servings) < 1e-9 ? null : next }); return commit(); }
    case 'srv-x': { const x = +el.dataset.x, s = r.servings * x; setMark(id, { servings: Math.abs(x - 1) < 1e-9 ? null : s }); return commit(); }
    case 'ing': setMark(id, { prog: { i: togg(m.prog.i, +el.dataset.i), s: m.prog.s } }); return commit();
    case 'ing-reset': setMark(id, { prog: { i: [], s: m.prog.s } }); return commit();
    case 'step': setMark(id, { prog: { i: m.prog.i, s: togg(m.prog.s, +el.dataset.i) } }); return commit();
    case 'step-reset': setMark(id, { prog: { i: m.prog.i, s: [] } }); return commit();
    case 'grocery-add': return toGrocery([r], 'the ingredients');
    case 'meal-add': return toggleMeal(id);
    case 'copy-list': { const f = factorOf(r); return copyText(r.ingredients.map(g => ingLine(g, f)).join('\n'), 'Shopping list copied'); }
    case 'made': { const t = todayISO(); setMark(id, { made: [...m.made, t] }); commit(); return toast('Logged. Enjoy!'); }
    case 'made-undo': setMark(id, { made: m.made.slice(0, -1) }); return commit();
    case 'cook': ui.cook = { id, i: 0 }; location.hash = `#/r/${id}/cook`; return;
    case 'cook-next': ui.cook.i = Math.min(r.steps.length - 1, ui.cook.i + 1); return render();
    case 'cook-prev': ui.cook.i = Math.max(0, ui.cook.i - 1); return render();
    case 'cook-ing': { const f = factorOf(r); return askDialog({ title: `Ingredients · ${fmtNum(servingsOf(r))} ${r.servingsLabel || 'servings'}`, body: `<ul style="list-style:none;padding:0;margin:0">${r.ingredients.map(g => `<li style="padding:5px 0;border-top:1px solid var(--line)"><b>${esc(amountText(g, f))}</b> ${esc(g.name)}${g.note ? `<span class="muted">, ${esc(g.note)}</span>` : ''}</li>`).join('')}</ul>`, buttons: [{ label: 'Close', value: true, kind: 'primary' }] }); }
    case 'cook-done': return (async () => {
      const yes = await confirmBox('All done?', 'Add this to your cooking log?', 'Yes, log it', false);
      if (yes) { setMark(id, { made: [...m.made, todayISO()], prog: { i: [], s: [] } }); persist(); toast('Logged. Enjoy!'); }
      ui.cook = { id: '', i: 0 }; location.hash = `#/r/${id}/steps`;
    })();
  }
}
app.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const el = e.target.closest('[data-action]'); if (!el || el.matches('input[type=checkbox]')) return;
  handleAction(el.dataset.action, el);
});
$('#timerbar').addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (el) handleAction(el.dataset.action, el); });
app.addEventListener('change', e => {
  if (e.target.matches('input[type=checkbox][data-action]')) return handleAction(e.target.dataset.action, e.target);
  if (e.target.matches('textarea[data-note]')) { setMark(e.target.dataset.note, { note: e.target.value }); persist(); }
});
app.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; const l = $('#rlist'); if (l) l.innerHTML = cardsHTML(); }
  else if (e.target.id === 'e_ing') updateTokHint();
});
app.addEventListener('focusout', e => { if (e.target.matches && e.target.matches('textarea[data-note]')) { setMark(e.target.dataset.note, { note: e.target.value }); persist(); } });
app.addEventListener('submit', e => { if (e.target.id === 'editForm') { e.preventDefault(); saveEdit(); } });
window.addEventListener('hashchange', () => { if (route().name === 'edit') { const r = route().r; ui.editOld = r ? r.ingredients : []; ui.tokOk = false; } render(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (wakeLock === null && route().tab === 'cook') wakeOn();
  timerTick(); ensureTick();
});

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const raw = await idbGet(db, 'state');
      if (raw) { try { state = loadState(JSON.parse(raw)); } catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged — a copy was kept aside.'); } }
      const tr = await idbGet(db, 'timers');
      if (tr) { try { timers = arr(JSON.parse(tr)).filter(t => t && isNum(t.end) && typeof t.id === 'string').slice(0, 10).map(t => ({ id: t.id, label: flat(t.label, 60) || 'Timer', end: t.end, total: isNum(t.total) ? t.total : 0, fired: t.fired === true, rings: 8, last: 0 })).filter(t => Date.now() - t.end < 6 * 3600e3); } catch { timers = []; } }
    } catch (e) { console.error(e); db = null; }
  }
  { const r = route(); if (r.name === 'edit') ui.editOld = r.r ? r.r.ingredients : []; }
  render(); ensureTick();
  await loadLibrary();
  loadNutrition();
  const a = document.activeElement;
  if (route().name === 'home' && a && a.id === 'q') { const l = $('#rlist'); if (l) l.innerHTML = cardsHTML(); } else render();
})();
</script>
