<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House</title>
<meta name="description" content="Home and equipment upkeep: recurring maintenance, readings logs, warranties and vehicle dates.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f3f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="House">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f5f4ef; --card:#ffffff; --ink:#1b2420; --muted:#66736d; --line:#e2e0d6; --soft:#efede5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf0d5; --ok:#166534; --ok-soft:#dcf5e3;
  --radius:14px; --shadow:0 1px 2px rgba(16,24,20,.06),0 6px 18px rgba(16,24,20,.06);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1311; --card:#171f1c; --ink:#e7eeeb; --muted:#97a69f; --line:#27332e; --soft:#1e2824;
    --accent:#2dd4bf; --accent-ink:#06211d; --accent-soft:#12332e;
    --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f6c26b; --warn-soft:#3a2c12; --ok:#7ee2a0; --ok-soft:#14301f;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .bad{color:var(--bad)} .warn{color:var(--warn)} .ok{color:var(--ok)}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}
.pad{padding:14px 16px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}

/* header */
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
header.top .grow{flex:1;min-width:0}
header.top h1{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;min-height:44px;padding-right:6px;text-decoration:none;font-weight:600}

/* cards, tiles, lists */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.tile{padding:12px}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:700;margin-top:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 4px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sec-h .btn{text-transform:none;letter-spacing:0}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row-amt{font-weight:700;white-space:nowrap}
.row.faded{opacity:.6}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:6px}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.acc{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:10px}
.empty h2{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.banner{padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin:14px 0;display:flex;gap:10px;justify-content:space-between;align-items:center}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--bad)}

/* buttons */
.btn{white-space:nowrap;appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;min-height:36px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* bottom nav + fab */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;padding:0}
nav.tabs a,nav.tabs button{flex:1;min-height:58px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;text-decoration:none}
nav.tabs .ico{font-size:20px;line-height:1}
nav.tabs [aria-current="page"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50vw - 344px));bottom:calc(74px + env(safe-area-inset-bottom));z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.fab:active{transform:scale(.96)}

/* forms + dialogs */
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);flex:none}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field.check{display:flex;align-items:center;gap:10px}
.field.check label{margin:0;color:var(--ink);font-size:16px;font-weight:500}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
dialog{border:0;border-radius:18px;padding:0;width:calc(100vw - 24px);max-width:520px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55)}
.dlg-form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;max-height:85dvh;overflow:auto}
.dlg-form h2{font-size:19px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.dlg-actions .spacer{flex:1}
.ask-actions{justify-content:flex-end}
.dlg-err{color:var(--bad);font-size:14px}
.dlg-err:empty{display:none}
.ask-body{font-size:15px;color:var(--ink)}
.ask-body p{margin:0 0 8px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.checkgrid .field.check label{font-size:15px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#1b2420;color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100vw - 24px);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:15px}
.toast button{background:none;border:0;color:#7dd3c8;font:inherit;font-weight:700;cursor:pointer;min-height:36px}

@media (prefers-reduced-motion:no-preference){.btn,.fab{transition:transform .08s}}

.syncbadge{flex:none;white-space:nowrap;border:1px solid var(--line,#d5dbe0);background:var(--card,#fff);color:inherit;border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer;white-space:nowrap}
.syncbadge.ok{color:#15803d}.syncbadge.bad{color:#b91c1c}
.seg{display:flex;gap:8px;margin-top:6px}.seg .chip{flex:1;text-align:center}

:root{--bg:#f3f7f8;--accent:#0e7490;--accent-soft:#d3ecf2}
@media (prefers-color-scheme:dark){:root{--bg:#0e1311;--accent:#22d3ee;--accent-ink:#04222b;--accent-soft:#0e3340}}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.row .btn{flex:none}
.row-actions{display:flex;gap:6px;align-items:center;flex:none}
.tiles .val{font-size:22px}
.backlink{margin:10px 0 0}
.card.pad+.card.pad{margin-top:12px}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.vc{padding:8px 10px;border-radius:10px;background:var(--soft)}
.vc .n{font-size:12px;color:var(--muted);font-weight:600}
.vc .v{font-size:18px;font-weight:700}
.vc .d{font-size:11px;color:var(--muted)}
.vc.bad{background:var(--bad-soft)} .vc.bad .v{color:var(--bad)}
.vc.ok .v{color:var(--ok)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .band{fill:var(--ok-soft)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chart .pt{fill:var(--accent)} .chart .pt.bad{fill:var(--bad)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:10px}
.tl{list-style:none;margin:8px 0 0;padding:0 0 0 10px;border-left:2px solid var(--line)}
.tl li{padding:2px 0 6px 8px;font-size:14px;overflow-wrap:anywhere}
.wbn{margin:10px 0 0;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;background:var(--soft);color:var(--ink)}
.wbn.warn{background:var(--warn-soft);color:var(--warn)} .wbn.bad{background:var(--bad-soft);color:var(--bad)} .wbn.ok{background:var(--ok-soft);color:var(--ok)}
.kv{font-size:14px;color:var(--muted);overflow-wrap:anywhere;margin-top:4px}
.kv b{color:var(--ink);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table.ct{width:100%;border-collapse:collapse;font-size:14px}
table.ct th,table.ct td{padding:8px 10px;text-align:right;border-top:1px solid var(--line)}
table.ct th:first-child,table.ct td:first-child{text-align:left;overflow-wrap:anywhere}
table.ct thead th{border-top:0;color:var(--muted);font-size:12px}
table.ct tfoot td{font-weight:700}
textarea.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px;min-height:130px}
.pv li.err .row-sub{color:var(--bad)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="grow"><h1 id="title">Due</h1><div class="sub" id="sub"></div></div><button type="button" class="btn small primary hide" id="addBtn">+ Add</button></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button type="button" data-tab="due"><span class="ico">📅</span>Due</button>
  <button type="button" data-tab="things"><span class="ico">🏠</span>Things</button>
  <button type="button" data-tab="logs"><span class="ico">📈</span>Logs</button>
  <button type="button" data-tab="warranties"><span class="ico">🛡️</span>Warranties</button>
  <button type="button" data-tab="backup"><span class="ico">💾</span>Backup</button>
</div></nav>
<script>
'use strict';
/* ===================== shared helpers (identical in every Goobs app) ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && Number.isFinite(v);
const str = v => (typeof v === 'string' ? v : v == null ? '' : String(v));

/* ---- dates: always local calendar dates stored as 'YYYY-MM-DD' ---- */
const pad = n => String(n).padStart(2, '0');
const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isISO = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fmtISO(parseISO(s)) === s;
const todayISO = () => fmtISO(new Date());
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return fmtISO(d); };
function addMonths(s, n, anchorDay) {
  const d = parseISO(s);
  const day = anchorDay || d.getDate();
  const first = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  first.setDate(Math.min(day, last));
  return fmtISO(first);
}
const monthEndISO = s => { const d = parseISO(s); return fmtISO(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };

function fmtDate(s, withWeekday = true) {
  const d = parseISO(s);
  const o = { month: 'short', day: 'numeric' };
  if (withWeekday) o.weekday = 'short';
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString(undefined, o);
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? 'unknown date' : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}
const _mf = {};
function money(n, cur = 'USD') {
  if (!_mf[cur]) {
    try { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }); }
    catch { _mf[cur] = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD' }); }
  }
  return _mf[cur].format(n);
}
const csvCell = v => {
  let s = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // neutralise spreadsheet formula injection
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function safeUrl(u) {
  let s = String(u ?? '').trim();
  if (!s) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try { const x = new URL(s); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* ---- storage: one JSON string under one key in IndexedDB ---- */
function openDB(name) {
  return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('Database blocked'));
  });
}
function idbGet(db, key) {
  return new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('Write aborted'));
  });
}

/* ---- toast ---- */
function toast(msg, action) {
  const old = $('.toast'); if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action.label)}</button>` : '');
  if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
  document.body.appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 3200);
}

/* ---- dialogs ---- */
if (!$('#dlg')) document.body.insertAdjacentHTML('beforeend', '<dialog id="dlg"></dialog><dialog id="ask"></dialog>');
{
  const dlg = $('#dlg'); let down = false;
  dlg.addEventListener('pointerdown', e => { down = e.target === dlg; });
  dlg.addEventListener('click', e => { if (e.target === dlg && down) dlg.close(); });
}

function fieldHTML(f) {
  const id = 'f_' + f.name, v = f.value ?? '';
  if (f.type === 'checkbox')
    return `<div class="field check"><input type="checkbox" id="${id}" name="${f.name}"${f.value ? ' checked' : ''}><label for="${id}">${esc(f.label)}</label></div>`;
  let ctl;
  if (f.type === 'select') {
    ctl = `<select id="${id}" name="${f.name}">${f.options.map(o => {
      const [val, label] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(label)}</option>`;
    }).join('')}</select>`;
  } else if (f.type === 'textarea') {
    ctl = `<textarea id="${id}" name="${f.name}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`;
  } else {
    const t = f.type || 'text';
    const extra = t === 'number' ? ` inputmode="decimal" step="${f.step || 'any'}"` : '';
    ctl = `<input id="${id}" name="${f.name}" type="${t}" value="${esc(v)}" placeholder="${esc(f.placeholder || '')}"${extra}${f.min != null ? ` min="${f.min}"` : ''}${f.max != null ? ` max="${f.max}"` : ''} autocomplete="${f.autocomplete || 'off'}" autocapitalize="${f.capitalize || (t === 'email' || t === 'password' ? 'none' : 'sentences')}">`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? ' *' : ''}</label>${ctl}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ''}</div>`;
}

/* formDialog: fields -> values. onSubmit(values) may return an error string (keeps dialog open).
   onDelete() may return true to close. extra: [{label, kind, onClick}] extra buttons. */
function formDialog({ title, intro = '', fields, submitLabel = 'Save', onSubmit, onDelete, deleteLabel = 'Delete', extra = [], onClose, grid = '' }) {
  const dlg = $('#dlg');
  const body = grid ? `<div class="${grid}">${fields.map(fieldHTML).join('')}</div>` : fields.map(fieldHTML).join('');
  dlg.innerHTML = `<form class="dlg-form" novalidate>
    <h2>${esc(title)}</h2>${intro ? `<p class="muted">${esc(intro)}</p>` : ''}${body}
    <div class="dlg-err" role="alert"></div>
    <div class="dlg-actions">
      ${onDelete ? `<button type="button" class="btn danger" data-k="del">${esc(deleteLabel)}</button>` : ''}
      ${extra.map((x, i) => `<button type="button" class="btn ${x.kind || ''}" data-x="${i}">${esc(x.label)}</button>`).join('')}
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-k="cancel">Cancel</button>
      <button type="submit" class="btn primary">${esc(submitLabel)}</button>
    </div></form>`;
  const form = $('form', dlg), err = $('.dlg-err', dlg);
  const collect = () => {
    const vals = {};
    for (const f of fields) { const el = form.elements[f.name]; vals[f.name] = f.type === 'checkbox' ? el.checked : el.value; }
    return vals;
  };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const vals = collect();
    for (const f of fields) if (f.required && !String(vals[f.name]).trim()) { err.textContent = `${f.label} is required.`; return; }
    err.textContent = '';
    let msg;
    try { msg = await onSubmit(vals); } catch (ex) { msg = ex.message || 'Something went wrong.'; }
    if (msg) err.textContent = msg; else dlg.close();
  });
  $('[data-k="cancel"]', dlg).onclick = () => dlg.close();
  if (onDelete) $('[data-k="del"]', dlg).onclick = async () => { if (await onDelete()) dlg.close(); };

async function deliverFile(filename, text, mime = 'application/json') {
  const file = new File([text], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: filename }); return 'shared'; }

/* nag banner: only when there is data and no recent backup */
function backupNag(meta, hasData) {
  if (!hasData) return null;
  if (!meta.lastBackup) return 'You have data but no backup yet. Make one so you can restore it if this device loses it.';
  const age = (Date.now() - Date.parse(meta.lastBackup)) / 86400000;

      <p>Saves one file with your things, tasks, history, logs and warranties. On iPhone it opens the share sheet — save it to Files or OneDrive. <b>Never put this file in your GitHub repo.</b></p>
      ${canEncrypt ? `<div class="field"><label for="bkPass">Passphrase (optional — encrypts the file)</label><input id="bkPass" type="password" autocomplete="new-password"></div>
      <div class="field" style="margin-top:8px"><label for="bkPass2">Repeat passphrase</label><input id="bkPass2" type="password" autocomplete="new-password"></div>
      <p class="hint">If you set one, the file can’t be opened without it — not even by me.</p>` : ''}
      <button type="button" class="btn primary block" style="margin-top:12px" data-action="export">Back up now</button></section>
    <section class="card pad"><h3>Restore</h3><p>Pick a backup file made by this app. You’ll choose whether to replace what’s here or merge it in.</p>
      <button type="button" class="btn block" data-action="restore">Choose backup file…</button></section>
    <section class="card pad"><h3>Set up</h3><p>Add common house, pool, generator and vehicle tasks (you choose which), or paste your own list.</p>
      <div class="btnrow"><button type="button" class="btn" data-action="starters">Add starter items…</button><button type="button" class="btn" data-action="import">Import tasks from CSV…</button></div></section>
    <section class="card pad"><h3>Use in Excel</h3><p>Maintenance history, or yearly costs, as CSV files. Each log exports from its own screen.</p>
      <div class="btnrow"><button type="button" class="btn" data-action="hist-csv">Export history</button><button type="button" class="btn" data-action="costs-csv">Export costs</button></div></section>
    <section class="card pad"><h3>Danger zone</h3><p>Erases everything on this device.</p>
      <button type="button" class="btn danger block" data-action="wipe">Erase everything on this device</button></section>
    <p class="hint" style="text-align:center">Your data lives only on this device. Nothing is sent anywhere.</p></div>`;
}
const TITLES = { due: 'Due', things: 'Things', logs: 'Logs', warranties: 'Warranties', backup: 'Backup & restore' };
const ADD_LABEL = { due: '+ Task', things: '+ Thing', logs: '+ Log', warranties: '+ Warranty' };
function render() {
  const y = window.scrollY;
  let html, title = TITLES[nav.tab], add = ADD_LABEL[nav.tab] || null;
  if (nav.tab === 'things' && nav.sub === 'thing') { const t = thingById(nav.id); html = renderThing(nav.id); title = t ? t.name : 'Things'; add = '+ Task'; }
  else if (nav.tab === 'things' && nav.sub === 'costs') { html = renderCosts(); title = 'Costs'; add = null; }
  else if (nav.tab === 'logs' && nav.sub === 'log') { const l = logById(nav.id); html = renderLog(nav.id); title = l ? l.name : 'Logs'; add = '+ Entry'; }
  else if (nav.tab === 'due' && nav.sub === 'history') { html = renderHistoryAll(); title = 'History'; add = null; }
  else if (nav.tab === 'backup' && nav.sub === 'import') { html = renderImport(); title = 'Import tasks'; add = null; }
  else html = { due: renderDue, things: renderThings, logs: renderLogs, warranties: renderWarranties, backup: renderBackup }[nav.tab]();
  view.innerHTML = html;
  $$('nav.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === nav.tab ? 'page' : 'false'));
  const ab = $('#addBtn'); ab.classList.toggle('hide', !add); if (add) ab.textContent = add;
  $('#title').textContent = title;
  $('#sub').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  window.scrollTo(0, y);
}
function go(tab, sub = null, id = null) { nav = { tab, sub, id }; render(); window.scrollTo(0, 0); }
function addForCurrent() {
  if (nav.sub === 'thing') return taskDialog(null, nav.id);
  if (nav.sub === 'log') return readingDialog(nav.id);
  ({ due: () => taskDialog(), things: () => thingDialog(), logs: () => logDialog(), warranties: () => warrantyDialog() }[nav.tab] || (() => {}))();
}

/* ---- backup / restore / csv ---- */
async function doExport() {
  const pass = ($('#bkPass') || {}).value || '', pass2 = ($('#bkPass2') || {}).value || '';
  if (pass) {
    if (pass.length < 8) return toast('Use at least 8 characters for the passphrase.');
    if (pass !== pass2) return toast('The two passphrases don’t match.');
  }
  const btn = $('[data-action="export"]'); if (btn) btn.disabled = true;
  try {
    const text = await Backup.build({ appId: APP_ID, schema: SCHEMA, data: exportData(), passphrase: pass || null });
    const r = await deliverFile(`goobs-house-backup-${todayISO()}${pass ? '-encrypted' : ''}.json`, text, 'application/json');
    if (r !== 'cancelled') {
      state.meta.lastBackup = new Date().toISOString();
      await persist({ touch: false });
      render();
      toast(r === 'shared' ? 'Backup shared' : 'Backup saved to your downloads');
    }
  } catch (e) { toast('Backup failed: ' + e.message); }
  finally { const b2 = $('[data-action="export"]'); if (b2) b2.disabled = false; }
}
const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const countsText = d => `${plural(d.things.length, 'thing')}, ${plural(d.tasks.length, 'task')}, ${pl(d.history.length, 'history entry', 'history entries')}, ${plural(d.logs.length, 'log')}, ${pl(d.readings.length, 'log entry', 'log entries')} and ${pl(d.warranties.length, 'warranty', 'warranties')}`;
async function restoreFromText(text) {
  let parsed;
  try { parsed = await Backup.parse(text, { appId: APP_ID, schema: SCHEMA }); }
  catch (e) { await msgBox('Can’t restore that file', e.message); return false; }
  if (!parsed) return false;
  const { data, dropped } = normalizeData(parsed.data);
  const total = data.things.length + data.tasks.length + data.history.length + data.logs.length + data.readings.length + data.warranties.length;
  if (!total) { await msgBox('Nothing to restore', 'That backup has no things, tasks, logs or warranties in it.'); return false; }
  const hasLocal = hasAnyData();
  const sum = countsText(data);
  const when = parsed.exportedAt ? ` Backup made ${fmtDateTime(parsed.exportedAt)}.` : '';
  const skipped = dropped ? ` ${plural(dropped, 'unreadable item')} will be skipped.` : '';
  const body = `<p>${esc(sum + '.' + when + skipped)}</p>` + (hasLocal ? '<p class="muted"><b>Replace all</b> swaps everything here for the backup. <b>Merge</b> adds what isn’t here yet and keeps the rest.</p>' : '');
  const choice = await askDialog({
    title: 'Restore this backup?', body,
    buttons: hasLocal
      ? [{ label: 'Cancel', value: 'cancel' }, { label: 'Merge', value: 'merge' }, { label: 'Replace all', value: 'replace', kind: 'danger' }]
      : [{ label: 'Cancel', value: 'cancel' }, { label: 'Restore', value: 'replace', kind: 'primary' }]
  });
  if (choice === 'replace') {
    const ts = parsed.exportedAt && !isNaN(Date.parse(parsed.exportedAt)) ? parsed.exportedAt : new Date().toISOString();
    Object.assign(state, data);
    state.meta.lastBackup = ts; state.meta.lastChange = ts;
    nav = { tab: nav.tab, sub: null, id: null };
    await persist({ touch: false });
    render(); toast('Backup restored'); return true;
  }
  if (choice === 'merge') {
    let added = 0;
    for (const k of ['things', 'tasks', 'history', 'logs', 'readings', 'warranties']) {
      const ids = new Set(state[k].map(x => x.id));
      for (const x of data[k]) if (!ids.has(x.id) && state[k].length < MAX[k]) { state[k].push(x); added++; }
    }
    await persist(); render(); toast(`Merged in ${plural(added, 'item')}`); return true;
  }
  return false;
}
async function doRestore() {
  const f = await pickFile(); if (!f) return;
  let text;
  try { text = await readFileText(f); } catch { await msgBox('Couldn’t read that file', 'Try choosing it again.'); return; }
  await restoreFromText(text);
}
async function sendCsv(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const r = await deliverFile(name, csv, 'text/csv');
  if (r !== 'cancelled') toast(r === 'shared' ? 'CSV shared' : 'CSV saved to your downloads');
}
async function doHistCsv() {
  if (!state.history.length) return toast('No history to export yet.');
  const rows = [['Date', 'Thing', 'Task', 'Status', 'Cost', 'Done by', 'Odometer', 'Notes'],
    ...[...state.history].sort((a, b) => a.doneOn.localeCompare(b.doneOn) || a.createdAt - b.createdAt).map(h => [h.doneOn, h.thingId ? thingName(h.thingId) : h.thingName, h.title, h.kind, h.cost != null ? h.cost.toFixed(2) : '', h.who, h.odo != null ? h.odo : '', h.notes])];
  await sendCsv(`house-history-${todayISO()}.csv`, rows);
}
async function doLogCsv(id) {
  const l = logById(id); if (!l) return;
  const es = entriesOf(id);
  if (!es.length) return toast('No entries to export yet.');
  const rows = [['Date', ...l.fields.map(f => f.unit ? `${f.name} (${f.unit})` : f.name), 'Cost', 'Note'],
    ...es.map(r => [r.date, ...l.fields.map(f => isNum(r.values[f.id]) ? r.values[f.id] : ''), r.cost != null ? r.cost.toFixed(2) : '', r.note])];
  await sendCsv(`house-${l.name.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'log'}-${todayISO()}.csv`, rows);
}
async function doCostsCsv() {
  const items = costItems();
  if (!items.length) return toast('No costs recorded yet.');
  const by = new Map();
  for (const i of items) {
    const k = i.thingName + '\u0000' + i.year;
    if (!by.has(k)) by.set(k, { thing: i.thingName, year: i.year, maint: 0, log: 0 });
    by.get(k)[i.src === 'maint' ? 'maint' : 'log'] += i.amount;
  }
  const rows = [['Thing', 'Year', 'Maintenance', 'Logs', 'Total'], ...[...by.values()].sort((a, b) => a.thing.localeCompare(b.thing) || a.year.localeCompare(b.year)).map(r => [r.thing, r.year, r.maint.toFixed(2), r.log.toFixed(2), (r.maint + r.log).toFixed(2)])];
  await sendCsv(`house-costs-${todayISO()}.csv`, rows);
}
async function doWipe() {
  if (!(await confirmBox('Erase everything?', 'This permanently deletes all things, tasks, history, logs and warranties on this device. Make a backup first if you might want them.', 'Erase everything'))) return;
  state = defaultState(); nav = { tab: nav.tab, sub: null, id: null };
  await persist({ touch: false });
  render(); toast('Everything erased');
}

/* ---- wiring ---- */
view.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.action) {
    case 'add': addForCurrent(); break;
    case 'edit-task': taskDialog(id); break;
    case 'done': doneDialog(id); break;
    case 'snooze': snoozeDialog(id); break;
    case 'undo': undoEntry(id); break;
    case 'edit-hist': historyDialog(id); break;
    case 'history': go('due', 'history'); break;
    case 'back': go(nav.tab); break;
    case 'open-thing': go('things', 'thing', id); break;
    case 'edit-thing': thingDialog(id); break;
    case 'odo': odoDialog(id); break;
    case 'add-task-for': taskDialog(null, id); break;
    case 'add-log-for': logDialog(null, id); break;
    case 'add-warr-for': warrantyDialog(null, id); break;
    case 'costs': go('things', 'costs'); break;
    case 'cost-year': costYear = id; render(); break;
    case 'open-log': go('logs', 'log', id); break;
    case 'edit-log': logDialog(id); break;
    case 'add-reading': readingDialog(id); break;
    case 'edit-reading': readingDialog(nav.id, id); break;
    case 'log-csv': doLogCsv(id); break;
    case 'edit-warr': warrantyDialog(id); break;
    case 'claim': claimDialog(id); break;
    case 'go-warranties': go('warranties'); break;
    case 'starters': starterDialog(); break;
    case 'import': importRows = null; go('backup', 'import'); break;
    case 'import-preview': { const ta = $('#impText'); importText = ta ? ta.value : importText; importRows = parseTaskLines(importText); render(); break; }
    case 'import-go': {
      const r = applyImport(importRows || []);
      importRows = null; importText = '';
      commit(); toast(`Imported ${plural(r.n, 'task')}${r.newThings ? ` and created ${plural(r.newThings, 'thing')}` : ''}`);
      go('due'); break;
    }
    case 'export': doExport(); break;
    case 'restore': doRestore(); break;
    case 'hist-csv': doHistCsv(); break;
    case 'costs-csv': doCostsCsv(); break;
    case 'wipe': doWipe(); break;
    case 'install': runInstall(); break;
  }
});
view.addEventListener('input', e => { if (e.target.id === 'impText') importText = e.target.value; });
$('#addBtn').onclick = () => addForCurrent();
$$('nav.tabs button').forEach(b => { b.onclick = () => go(b.dataset.tab); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('dialog[open]')) render(); });

(async function init() {
  try { db = await openDB(DB_NAME); } catch (e) { console.error(e); db = null; }
  if (db) {
    try {
      const raw = await idbGet(db, 'state');
      if (raw) {
        try { state = loadState(JSON.parse(raw)); }
        catch (e) { console.error(e); await idbPut(db, 'state-damaged-' + Date.now(), raw); toast('Saved data looked damaged — a copy was kept aside.'); }
      }
    } catch (e) { console.error(e); db = null; }
  }
  render();
})();
</script>
</body>
</html>
